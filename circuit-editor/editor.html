<title>電控線路圖編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: CAD workbench — toolbar / [symbol library | drawing sheet | properties] / sheet tabs + status */
:root{
  --bg:#e6eaee; --panel:#f5f7f9; --panel2:#ffffff; --line:#d0d8de; --fg:#1a242b; --muted:#5b6a74;
  --accent:#0d6f8c; --accent-ink:#ffffff; --accent-soft:#d9eef4; --desk:#c5ced5; --sel:#1478d4; --danger:#c23b2a; --ok:#1e8a4c;
  --font-ui:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181c; --panel:#1a2126; --panel2:#20282e; --line:#2e3941; --fg:#e2e8ec; --muted:#91a0aa;
  --accent:#4cb6d4; --accent-ink:#04222b; --accent-soft:#16343e; --desk:#0d1114; --sel:#4aa3ff; --danger:#ff7b66; --ok:#4fd18a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181c; --panel:#1a2126; --panel2:#20282e; --line:#2e3941; --fg:#e2e8ec; --muted:#91a0aa;
  --accent:#4cb6d4; --accent-ink:#04222b; --accent-soft:#16343e; --desk:#0d1114; --sel:#4aa3ff; --danger:#ff7b66; --ok:#4fd18a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* toolbar */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
.brand svg{flex:none}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border:0;border-radius:4px;background:transparent;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:16px;height:16px;flex:none}
.btn kbd{font-family:var(--font-mono);font-size:10px;opacity:.6}
.btn:disabled{opacity:.4;cursor:default}
.sp{flex:1}
.chk{display:inline-flex;align-items:center;gap:4px;padding:0 6px;height:30px;white-space:nowrap;cursor:pointer}
.swatch{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);display:inline-block}

/* main */
#main{display:grid;grid-template-columns:232px 1fr 272px;min-height:0}
aside{background:var(--panel);min-height:0;overflow:auto}
#lib{border-right:1px solid var(--line)}
#props{border-left:1px solid var(--line)}
.ph{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.ph h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.search{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);padding:0 8px}
.cat{border-bottom:1px solid var(--line)}
.cat>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:0;background:transparent;font-weight:700;font-size:12px}
.cat>button span{color:var(--muted);font-weight:400;font-family:var(--font-mono)}
.cat.closed .cells{display:none}
.cells{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 10px 10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:grab;user-select:none;text-align:center;min-width:0}
.cell:hover{border-color:var(--accent)}
.cell.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cell svg{width:100%;height:46px;background:#fff;border-radius:3px}
.cell b{font-size:11px;font-weight:500;line-height:1.25}
.cell i{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--font-mono)}

#stage{position:relative;background:var(--desk);overflow:hidden;min-width:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
#cv.pan{cursor:grab}
#cv.cross{cursor:crosshair}
.hit{pointer-events:all}
.hint{position:absolute;left:12px;top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted);pointer-events:none;max-width:calc(100% - 24px)}
.hint b{color:var(--fg)}
.zoombox{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px}
.zoombox .btn{height:28px;padding:0 8px}
#zl{font-family:var(--font-mono);font-size:11px;min-width:44px;text-align:center;align-self:center}

/* properties */
.pf{padding:10px 12px;display:grid;gap:10px}
.sec{display:grid;gap:7px}
.sec h3{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:4px 0 0;text-transform:uppercase}
.row{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:6px}
.row>label{color:var(--muted);font-size:12px}
.row input,.row select,.row textarea{width:100%;min-width:0;height:28px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);padding:0 7px}
.row textarea{height:auto;min-height:70px;padding:5px 7px;resize:vertical;font-family:var(--font-mono);font-size:12px;line-height:1.45}
.row input[type=checkbox]{width:16px;height:16px}
.row input[type=color]{padding:1px 2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.btns .btn{border:1px solid var(--line);background:var(--panel2);height:28px;padding:0 8px}
.btns .btn:hover{border-color:var(--accent)}
.colors{display:flex;flex-wrap:wrap;gap:4px}
.colors button{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);padding:0}
.colors button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;font-family:var(--font-mono)}
.danger{color:var(--danger)}

/* footer */
footer{display:flex;align-items:stretch;gap:8px;background:var(--panel);border-top:1px solid var(--line);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));min-height:36px;flex-wrap:wrap}
#tabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;border:0;border-top:3px solid transparent;background:transparent;white-space:nowrap;color:var(--muted)}
.tab.on{border-top-color:var(--accent);background:var(--panel2);color:var(--fg);font-weight:500}
.tab small{font-family:var(--font-mono);font-size:10px;opacity:.7}
.tab input{width:120px;height:24px;border:1px solid var(--accent);border-radius:3px;background:var(--panel2);padding:0 5px}
.pgops{display:flex;align-items:center;gap:2px}
#status{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}

/* dialogs */
.mask{position:fixed;inset:0;background:rgba(10,16,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column}
.dlg.wide{width:min(1100px,100%)}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg header h2{margin:0;font-size:15px}
.dlg .body{padding:14px 16px;overflow:auto;display:grid;gap:12px}
.dlg .foot .sp{flex:1}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg .foot .btn{border:1px solid var(--line)}
.opt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt>span{width:84px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:5px 11px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:6px}
table.bom{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.bom th,table.bom td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;white-space:nowrap}
table.bom th{background:var(--panel2);position:sticky;top:0;font-weight:700;color:var(--muted);font-size:11px}
table.bom td.n{text-align:right;font-family:var(--font-mono)}
table.bom input{width:100%;min-width:70px;border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:3px}
table.bom input:hover,table.bom input:focus{border-color:var(--line);background:var(--panel2)}
table.bom tfoot td{font-weight:700}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.keys kbd{font-family:var(--font-mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 5px}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.mob{display:none}

@media (max-width:1680px){#tools .tlabel,.chk .tlabel{display:none}}
@media (max-width:980px){
  #main{grid-template-columns:1fr}
  #lib,#props{position:absolute;top:0;bottom:0;width:min(300px,86vw);z-index:20;box-shadow:0 0 30px rgba(0,0,0,.25)}
  #lib{left:0} #props{right:0}
  #main{position:relative}
  #lib:not(.open),#props:not(.open){display:none}
  .mob{display:inline-flex}
  .tlabel{display:none}
  #status .opt-hide{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <div class="tb" role="toolbar" aria-label="主工具列">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="var(--accent)"/><path d="M5 11h4m4 0h4M9 6v10M13 6v10" stroke="var(--accent-ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span class="tlabel">線路圖編輯器</span>
    </div>
    <button class="btn mob" id="bLib" title="元件庫">元件庫</button>
    <div class="grp">
      <button class="btn" id="bNew" title="新增空白專案">新增</button>
      <button class="btn" id="bSample" title="載入範例（依上傳電氣迴路圖）">範例</button>
      <button class="btn" id="bOpen" title="開啟 .json 專案檔">開啟</button>
      <button class="btn" id="bSave" title="儲存專案為 .json (Ctrl+S)">儲存</button>
    </div>
    <div class="grp">
      <button class="btn" id="bXlIn" title="匯入 Excel：零件表、IO 表或本編輯器匯出的專案">匯入 Excel</button>
      <button class="btn" id="bXlOut" title="匯出 Excel：零件表、IO 表、元件清單、接線表、圖面">匯出 Excel</button>
    </div>
    <div class="grp">
      <button class="btn" id="bUndo" title="復原 (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M5 3L2 6l3 3M2.5 6H10a4 4 0 010 8H7" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn" id="bRedo" title="重做 (Ctrl+Y)"><svg viewBox="0 0 16 16"><path d="M11 3l3 3-3 3M13.5 6H6a4 4 0 000 8h3" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="grp" id="tools">
      <button class="btn" data-tool="select" title="選取 / 移動 (V)"><svg viewBox="0 0 16 16"><path d="M3 2l9 6-4 1 2 4.5-1.6.7-2-4.5L3 12z" fill="currentColor"/></svg><span class="tlabel">選取</span></button>
      <button class="btn" data-tool="wire" title="導線 (W)：點擊起點→轉折→點到接點結束；/ 切換轉向"><svg viewBox="0 0 16 16"><path d="M2 12h5V4h7" stroke="currentColor" fill="none" stroke-width="1.8"/><circle cx="2" cy="12" r="1.6" fill="currentColor"/><circle cx="14" cy="4" r="1.6" fill="currentColor"/></svg><span class="tlabel">導線</span></button>
      <button class="btn" data-tool="text" title="文字 (T)"><svg viewBox="0 0 16 16"><path d="M3 3h10M8 3v10" stroke="currentColor" stroke-width="1.8" fill="none"/></svg><span class="tlabel">文字</span></button>
      <button class="btn" data-tool="line" title="直線 (L)"><svg viewBox="0 0 16 16"><path d="M2 14L14 2" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="btn" data-tool="rect" title="矩形框 (B)"><svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
      <button class="btn" data-tool="ellipse" title="橢圓 / 虛線框 (E)"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="4.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="2 1.5"/></svg></button>
    </div>
    <div class="grp">
      <button class="btn" id="bRot" title="旋轉 90° (R)"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 11-1.5-3.6M13 2v3h-3" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button class="btn" id="bMir" title="水平鏡像 (M)"><svg viewBox="0 0 16 16"><path d="M8 1v14M6 4L2 12h4zM10 4l4 8h-4z" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      <button class="btn" id="bDel" title="刪除 (Del)"><svg viewBox="0 0 16 16"><path d="M3 4h10M6 4V2.5h4V4M4.5 4l.8 9.5h5.4l.8-9.5" stroke="currentColor" fill="none" stroke-width="1.5"/></svg></button>
    </div>
    <label class="chk" title="新導線顏色"><span class="tlabel">線色</span>
      <select id="wcol" aria-label="新導線顏色"></select>
    </label>
    <div class="sp"></div>
    <label class="chk"><input type="checkbox" id="oGrid" checked> 格點</label>
    <label class="chk"><input type="checkbox" id="oSnap" checked> 吸附</label>
    <label class="chk" title="導線交叉處畫跳線弧"><input type="checkbox" id="oHop" checked> 跳線弧</label>
    <button class="btn" id="bBom" title="零件表 / 估價">零件表</button>
    <button class="btn" id="bHelp" title="快捷鍵說明">?</button>
    <button class="btn primary" id="bExport" title="匯出 PDF / PNG / SVG">匯出 PDF</button>
    <button class="btn mob" id="bProps" title="屬性">屬性</button>
  </div>

  <div id="main">
    <aside id="lib" aria-label="元件庫">
      <div class="ph"><h2>元件庫</h2><input class="search" id="q" placeholder="搜尋：按鈕、NFB、PLC…" aria-label="搜尋元件"></div>
      <div id="cats"></div>
    </aside>
    <div id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs"></defs>
        <g id="vp"></g>
      </svg>
      <div class="hint" id="hint"></div>
      <div class="zoombox">
        <button class="btn" id="zOut" title="縮小 (-)">−</button>
        <span id="zl">100%</span>
        <button class="btn" id="zIn" title="放大 (+)">+</button>
        <button class="btn" id="zFit" title="整頁 (F)">整頁</button>
      </div>
    </div>
    <aside id="props" aria-label="屬性"><div class="ph"><h2 id="ptitle">屬性</h2></div><div id="pbody" class="pf"></div></aside>
  </div>

  <footer>
    <div id="tabs" role="tablist" aria-label="圖頁"></div>
    <div class="pgops">
      <button class="btn" id="pgAdd" title="新增圖頁">＋ 頁</button>
      <button class="btn" id="pgDup" title="複製目前圖頁">複製</button>
      <button class="btn" id="pgL" title="往前移">◀</button>
      <button class="btn" id="pgR" title="往後移">▶</button>
      <button class="btn danger" id="pgDel" title="刪除目前圖頁">刪除</button>
    </div>
    <div id="status"><span id="sXY">X 0.0  Y 0.0 mm</span><span id="sSel" class="opt-hide"></span><span id="sSave" class="opt-hide"></span></div>
  </footer>
</div>
<input type="file" id="fileIn" accept=".json,.xlsx,application/json" hidden>
<input type="file" id="xlIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<div id="dlg"></div>
<div id="toast" hidden></div>

<script>
(()=>{
'use strict';
/* ====================== 基本工具 ====================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const PF="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Noto Sans TC','Heiti TC',Arial,sans-serif";
const INK='#111';
const U=4;            // 4 單位 = 1 mm
const GRID=10;        // 2.5 mm 格點
const SIZES={A4L:[1188,840,'A4 橫式'],A4P:[840,1188,'A4 直式'],A3L:[1680,1188,'A3 橫式'],A3P:[1188,1680,'A3 直式']};
const WCOL=[['#111111','黑'],['#d12a1f','紅'],['#1f4fd1','藍'],['#8a5a2b','棕'],['#e07b00','橙'],['#c9a800','黃'],['#1e8f3a','綠'],['#8a8f94','灰/白'],['#7a3fb0','紫']];
const STD={symW:1.3,wireW:1.4,tagSize:10,txtScale:1,wireLbl:9};
const ST=()=>Object.assign({},STD,(typeof doc!=='undefined'&&doc&&doc.style)||{});
const fz=n=>n*(TX.fs||1);
const mctx=document.createElement('canvas').getContext('2d');
const tw=(s,size)=>{mctx.font=`${size}px ${PF}`;return mctx.measureText(String(s)).width};

/* ---------- SVG primitives (local symbol coordinates) ---------- */
let TX={rot:0,mir:false,fs:1};   // current symbol transform, used to keep text readable
const L=(x1,y1,x2,y2,d)=>`<line x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}"${d?' stroke-dasharray="4 3"':''}/>`;
const C=(cx,cy,r,f)=>`<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r}"${f?` fill="${f===1?INK:f}"`:''}/>`;
const R=(x,y,w,h,f,d)=>`<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}"${f?` fill="${f}"`:''}${d?' stroke-dasharray="4 3"':''}/>`;
const E=(cx,cy,rx,ry,d,f)=>`<ellipse cx="${r2(cx)}" cy="${r2(cy)}" rx="${r2(rx)}" ry="${r2(ry)}"${d?' stroke-dasharray="4 3"':''}${f?` fill="${f}"`:''}/>`;
const P=(d,f,dash)=>`<path d="${d}"${f?` fill="${f===1?INK:f}"`:''}${dash?' stroke-dasharray="4 3"':''}/>`;
function T(x,y,s,size=10,anchor='middle',bold){
  s=String(s??''); if(!s) return '';
  size=r2(size*(TX.fs||1));
  const w=tw(s,size);

    const ts=+it.tsz||stl.tagSize,t9=r2(ts*0.9),t11=r2(ts*1.1);
    if(mode==='right')s+=t(bb[2]+6+dx,(bb[1]+bb[3])/2+ts*0.4+dy,(it.tag||'')+(spec?`(${spec})`:''),'start',t11);
    else if(mode==='in')s+=t((bb[0]+bb[2])/2+dx,(bb[1]+bb[3])/2+t9*0.38+dy,it.tag,'middle',r2(t9*Math.min(1.6,sc)))+t((bb[0]+bb[2])/2+dx,bb[3]+t9*1.2+dy,spec?`(${spec})`:'','middle',t9);
    else s+=t((bb[0]+bb[2])/2+dx,bb[1]-(spec?4+t9*1.2:4)+dy,it.tag,'middle',ts)+t((bb[0]+bb[2])/2+dx,bb[1]-4+dy,spec?`(${spec})`:'','middle',t9);}
  return s}
function wireSVG(w,hops,exp){const dash=w.dash?' stroke-dasharray="6 4"':'';
  let s=`<g${exp?'':` data-id="${w.id}"`}><path d="${wirePath(w,hops)}" stroke="${w.color||INK}" stroke-width="${+w.w||ST().wireW}" fill="none" stroke-linejoin="round"${dash}/>`;
  if(w.label){const [x,y]=wireLabelPos(w);s+=`<text x="${r2(x)}" y="${r2(y-4)}" font-size="${+w.lsz||ST().wireLbl}" text-anchor="middle" fill="${INK}">${esc(w.label)}</text>`}
  if(!exp)for(let i=0;i<w.pts.length-1;i++){const a=w.pts[i],b=w.pts[i+1];s+=`<line class="hit" data-seg="${i}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="9"/>`}
  return s+'</g>'}
function textSVG(it,exp){const lines=String(it.text||'').split('\n');const s=+it.size||12;
  return `<text${exp?'':` data-id="${it.id}"`} x="${it.x}" y="${it.y}" font-size="${s}" text-anchor="${it.anchor||'start'}" fill="${it.color||INK}"${it.bold?' font-weight="700"':''}${it.rot?` transform="rotate(${it.rot} ${it.x} ${it.y})"`:''}>`+
    lines.map((l,i)=>`<tspan x="${it.x}" dy="${i?s*1.25:0}">${esc(l)||' '}</tspan>`).join('')+'</text>'}
function shapeSVG(it,exp){const a=exp?'':` data-id="${it.id}"`;const st=` stroke="${it.color||INK}" stroke-width="${it.sw||1.2}" fill="${it.fill||'none'}"${it.dash?' stroke-dasharray="5 3"':''}`;
  const hit=exp?'':' class="hit"';
  if(it.t==='l')return `<g${a}><line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}"${st}/>${exp?'':`<line${hit} x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="transparent" stroke-width="9"/>`}</g>`;
  if(it.t==='r')return `<rect${a} x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}"${st} pointer-events="${exp?'auto':'stroke'}"/>`;
  return `<ellipse${a} cx="${it.x+it.w/2}" cy="${it.y+it.h/2}" rx="${Math.abs(it.w/2)}" ry="${Math.abs(it.h/2)}"${st} pointer-events="${exp?'auto':'stroke'}"/>`}
function itemsSVG(pg,exp){const hops=opt.hops?computeHops(pg):null;let s='';
  const order={r:0,e:0,l:0,w:1,s:2,t:3};const arr=[...pg.items].sort((a,b)=>order[a.t]-order[b.t]);
  for(const it of arr){if(it.t==='s')s+=symSVG(it,exp);else if(it.t==='w')s+=wireSVG(it,hops,exp);else if(it.t==='t')s+=textSVG(it,exp);else s+=shapeSVG(it,exp)}
  computeDots(pg).forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${INK}"/>`);
  return `<g font-family="${PF.replace(/"/g,'')}">${s}</g>`}

function frameSVG(pg,idx,total,overrideTitle){const [W,H]=SIZES[pg.size];const m=doc.meta,pm=pg.meta;let s='';
  s+=`<g font-family="${PF}" fill="none" stroke="${INK}">`;
  s+=`<rect x="10" y="10" width="${W-20}" height="${H-20}" stroke-width="0.6"/><rect x="20" y="20" width="${W-40}" height="${H-40}" stroke-width="1.6"/>`;
  const nc=Math.max(4,Math.round((W-40)/150)),nr=Math.max(3,Math.round((H-40)/150));
  for(let i=0;i<nc;i++){const x=20+(W-40)*i/nc,xm=x+(W-40)/nc/2;if(i)s+=`<line x1="${x}" y1="10" x2="${x}" y2="20" stroke-width=".6"/><line x1="${x}" y1="${H-20}" x2="${x}" y2="${H-10}" stroke-width=".6"/>`;
    s+=`<text x="${xm}" y="18" font-size="7" text-anchor="middle" fill="${INK}" stroke="none">${i+1}</text><text x="${xm}" y="${H-12}" font-size="7" text-anchor="middle" fill="${INK}" stroke="none">${i+1}</text>`}
  for(let i=0;i<nr;i++){const y=20+(H-40)*i/nr,ym=y+(H-40)/nr/2+2.5;if(i)s+=`<line x1="10" y1="${y}" x2="20" y2="${y}" stroke-width=".6"/><line x1="${W-20}" y1="${y}" x2="${W-10}" y2="${y}" stroke-width=".6"/>`;
    const L=String.fromCharCode(65+i);s+=`<text x="15" y="${ym}" font-size="7" text-anchor="middle" fill="${INK}" stroke="none">${L}</text><text x="${W-15}" y="${ym}" font-size="7" text-anchor="middle" fill="${INK}" stroke="none">${L}</text>`}
  // 標題欄
  const cw=[50,190,50,110,50,110],tbW=560,rh=22,x0=W-20-tbW,y0=H-20-rh*5;
  s+=`<rect x="${x0}" y="${y0}" width="${tbW}" height="${rh*5}" fill="#fff" stroke-width="1.2"/>`;
  for(let r=1;r<5;r++)s+=`<line x1="${x0}" y1="${y0+r*rh}" x2="${x0+tbW}" y2="${y0+r*rh}" stroke-width=".7"/>`;
  const X=[x0];cw.forEach(w=>X.push(X[X.length-1]+w));
  const vline=(c,r0,r1)=>s+=`<line x1="${X[c]}" y1="${y0+r0*rh}" x2="${X[c]}" y2="${y0+r1*rh}" stroke-width=".7"/>`;
  vline(1,1,5);vline(2,1,5);vline(3,1,5);vline(4,2,5);vline(5,2,5);
  const lab=(c,r,t)=>s+=`<text x="${(X[c]+X[c+1])/2}" y="${y0+r*rh+14}" font-size="8" text-anchor="middle" fill="#555" stroke="none">${esc(t)}</text>`;
  const val=(c,r,t,span=1,sz=10,bold)=>{const x=(X[c]+X[c+span])/2;s+=`<text x="${x}" y="${y0+r*rh+15}" font-size="${sz}" text-anchor="middle" fill="${INK}" stroke="none"${bold?' font-weight="700"':''}>${esc(t)}</text>`};
  s+=`<text x="${x0+tbW/2}" y="${y0+16}" font-size="13" text-anchor="middle" font-weight="700" fill="${INK}" stroke="none">${esc(m.company||'')}</text>`;
  lab(0,1,'件名');val(1,1,m.project);lab(2,1,'圖號');val(3,1,pm.dwgNo,3,11,true);
  lab(0,2,'圖名');val(1,2,overrideTitle||pm.title,1,10,true);lab(2,2,'CAD NO');val(3,2,m.cadNo);lab(4,2,'比例');val(5,2,'NTS');
  lab(0,3,'設計');val(1,3,m.designer);lab(2,3,'檢圖');val(3,3,m.checker);lab(4,3,'認可');val(5,3,m.approver);
  lab(0,4,'日期');val(1,4,m.date);lab(2,4,'版次');val(3,4,pm.rev);lab(4,4,'頁次');val(5,4,`${idx+1} / ${total}`);
  return s+'</g>'}

function overlaySVG(){let s='';const k=view.k,sw=1.2/k;
  for(const it of selItems()){
    if(it.t==='w'){s+=`<path d="${wirePath(it,null)}" stroke="var(--sel)" stroke-width="${4/k}" stroke-opacity=".35" fill="none" pointer-events="none"/>`;
      it.pts.forEach((p,j)=>s+=`<rect data-h="${j}" data-wid="${it.id}" x="${p[0]-4/k}" y="${p[1]-4/k}" width="${8/k}" height="${8/k}" fill="#fff" stroke="var(--sel)" stroke-width="${sw}" style="cursor:move"/>`);}
    else{const b=bbox(it);s+=`<rect x="${b[0]-4}" y="${b[1]-4}" width="${b[2]-b[0]+8}" height="${b[3]-b[1]+8}" fill="none" stroke="var(--sel)" stroke-width="${sw}" stroke-dasharray="${4/k} ${3/k}" pointer-events="none"/>`}}
  if(tool==='wire'||placing){cur().items.forEach(i=>{if(i.t==='s')symPins(i).forEach(p=>s+=`<circle cx="${p.x}" cy="${p.y}" r="${2.2/k+0.6}" fill="none" stroke="#e0533d" stroke-width="${1/k}" pointer-events="none"/>`)})}
  if(hoverPin)s+=`<circle cx="${hoverPin.x}" cy="${hoverPin.y}" r="${6/k}" fill="none" stroke="#e0533d" stroke-width="${2/k}" pointer-events="none"/>`;
  if(placing){const g=mkSym(placing.id,snap(cursor.x),snap(cursor.y),{rot:placing.rot,mir:placing.mir});s+=`<g opacity=".55" pointer-events="none">${symSVG(g,true)}</g>`}
  if(draft){const pts=[...draft.pts,...route(draft.pts[draft.pts.length-1],wpt(cursor),draft.mode)];
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${wireColor}" stroke-width="1.6" stroke-dasharray="${5/k} ${3/k}" pointer-events="none"/>`}
  if(drag&&drag.kind==='marq'){const a=drag.p0,b=drag.p1,x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);const cross=b.x<a.x;
    s+=`<rect x="${x}" y="${y}" width="${Math.abs(b.x-a.x)}" height="${Math.abs(b.y-a.y)}" fill="${cross?'rgba(30,160,90,.08)':'rgba(20,120,212,.08)'}" stroke="${cross?'#1ea05a':'var(--sel)'}" stroke-width="${sw}"${cross?` stroke-dasharray="${5/k} ${3/k}"`:''} pointer-events="none"/>`}
  if(drag&&drag.kind==='shape'&&drag.preview)s+=`<g opacity=".7" pointer-events="none">${shapeSVG(drag.preview,true)}</g>`;
  return s}

let saveTimer=null;
function render(){const pg=cur();const [W,H]=SIZES[pg.size];
  vp.setAttribute('transform',`translate(${r2(view.x)},${r2(view.y)}) scale(${view.k})`);
  vp.innerHTML=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff" style="filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))"/>`+
    (opt.grid?`<rect x="20" y="20" width="${W-40}" height="${H-40}" fill="url(#gridp)" pointer-events="none"/>`:'')+
    frameSVG(pg,pi,doc.pages.length)+itemsSVG(pg,false)+`<g>${overlaySVG()}</g>`;
  $('#zl').textContent=Math.round(view.k*100)+'%';
  $('#sSel').textContent=sel.size?`已選 ${sel.size}`:`${pg.items.length} 物件`;
  $('#bUndo').disabled=!undoS.length;$('#bRedo').disabled=!redoS.length;
  updHint();clearTimeout(saveTimer);saveTimer=setTimeout(autosave,700);}
function autosave(){try{localStorage.setItem('ckt-editor-doc',JSON.stringify({doc,pi}));$('#sSave').textContent='已自動儲存 '+new Date().toLocaleTimeString().slice(0,5)}catch(e){$('#sSave').textContent=''}}

/* ====================== 歷史 ====================== */
function mark(){undoS.push(JSON.stringify({doc,pi}));if(undoS.length>200)undoS.shift();redoS=[]}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify({doc,pi}));const s=JSON.parse(undoS.pop());doc=s.doc;pi=Math.min(s.pi,doc.pages.length-1);sel.clear();full()}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify({doc,pi}));const s=JSON.parse(redoS.pop());doc=s.doc;pi=Math.min(s.pi,doc.pages.length-1);sel.clear();full()}
function full(){render();renderProps();renderTabs()}

/* ====================== 互動 ====================== */
const snap=v=>opt.snap?snapU(v):Math.round(v);
function toW(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.k,y:(e.clientY-r.top-view.y)/view.k}}
function allPins(){const a=[];cur().items.forEach(i=>{if(i.t==='s')a.push(...symPins(i))});return a}
function nearPin(p,rad){let best=null,bd=rad;for(const q of allPins()){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}return best}
function wpt(p){const q=nearPin(p,10/Math.min(view.k,1.5));return q?[q.x,q.y]:[snap(p.x),snap(p.y)]}
function route(a,b,mode){if(a[0]===b[0]||a[1]===b[1])return[b];return mode==='vh'?[[a[0],b[1]],b]:[[b[0],a[1]],b]}
function simplify(pts){const o=[];for(const p of pts){const l=o[o.length-1];if(l&&l[0]===p[0]&&l[1]===p[1])continue;o.push(p)}
  for(let i=1;i<o.length-1;){const a=o[i-1],b=o[i],c=o[i+1];if((a[0]===b[0]&&b[0]===c[0])||(a[1]===b[1]&&b[1]===c[1])){o.splice(i,1)}else i++}return o}
function onWireOrPin(p,excludeDraft){if(allPins().some(q=>q.x===p[0]&&q.y===p[1]))return true;
  for(const s of segs(cur())){const a=s.a,b=s.b;if((a[0]===b[0]&&p[0]===a[0]&&p[1]>=Math.min(a[1],b[1])&&p[1]<=Math.max(a[1],b[1]))||(a[1]===b[1]&&p[1]===a[1]&&p[0]>=Math.min(a[0],b[0])&&p[0]<=Math.max(a[0],b[0])))return true}return false}
function finishWire(){if(draft){const pts=simplify(draft.pts);if(pts.length>=2){mark();const w={id:uid(),t:'w',pts,color:wireColor,dash:false,label:''};cur().items.push(w)}draft=null;render()}}

function setTool(t){if(draft)finishWire();tool=t;placing=null;document.querySelectorAll('.cell.on').forEach(c=>c.classList.remove('on'));
  document.querySelectorAll('#tools [data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t));
  svg.classList.toggle('cross',t!=='select');render()}
function startPlace(id){if(draft)finishWire();placing={id,rot:0,mir:false};tool='place';
  document.querySelectorAll('#tools [data-tool]').forEach(b=>b.setAttribute('aria-pressed','false'));
  document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('on',c.dataset.id===id));svg.classList.add('cross');render()}
function placeAt(id,p,rot=0,mir=false){mark();const lb=LIBM[id];const it=mkSym(id,snap(p.x),snap(p.y),{rot,mir});it.tag=nextTag(lb.pre);cur().items.push(it);sel=new Set([it.id]);render();renderProps();}

function updHint(){const h=$('#hint');let t='';
  if(tool==='place'&&placing)t=`放置 <b>${esc(LIBM[placing.id].name)}</b>：點擊放置（可連續）· <b>R</b> 旋轉 · <b>M</b> 鏡像 · <b>Esc</b> 結束`;
  else if(tool==='wire')t=draft?'點擊加入轉折 · 點到接腳 / 導線自動結束 · 雙擊或 <b>Enter</b> 完成 · <b>/</b> 切換先橫 / 先直':'導線：點擊起點（自動吸附元件接腳 <span style="color:#e0533d">○</span>）';
  else if(tool==='text')t='點擊放置文字，於右側屬性編輯內容';
  else if(tool==='line'||tool==='rect'||tool==='ellipse')t='拖曳繪製圖形';
  else t=sel.size?'拖曳移動（相連導線自動跟隨）· <b>R</b> 旋轉 · <b>M</b> 鏡像 · <b>Ctrl+C/V</b> 複製貼上 · 方向鍵微調':'從左側拖曳元件到圖面 · 框選：左→右 全包含、右→左 碰到即選 · 滾輪縮放 · 空白鍵/中鍵拖曳平移';
  h.innerHTML=t;}

/* ---- 移動（含相連導線跟隨） ---- */
function moveStart(){const items=selItems();const st={orig:new Map(items.map(i=>[i.id,clone(i)])),att:[]};
  const pk=new Set();items.forEach(i=>{if(i.t==='s')symPins(i).forEach(p=>pk.add(p.x+','+p.y))});
  if(pk.size)cur().items.forEach(w=>{if(w.t!=='w'||sel.has(w.id))return;const a=w.pts[0],b=w.pts[w.pts.length-1];const as=pk.has(a+''),ae=pk.has(b+'');
    if(!as&&!ae)return;if(w.pts.length===2&&!(as&&ae)){if(a[1]===b[1]){const m=snapU((a[0]+b[0])/2);w.pts=[a,[m,a[1]],[m,b[1]],b]}else if(a[0]===b[0]){const m=snapU((a[1]+b[1])/2);w.pts=[a,[a[0],m],[b[0],m],b]}}
    st.att.push({w,orig:clone(w.pts),as,ae})});
  return st}
function moveApply(st,dx,dy){for(const it of selItems()){const o=st.orig.get(it.id);Object.assign(it,clone(o));translate(it,dx,dy)}
  for(const a of st.att){const p=clone(a.orig);if(a.as&&a.ae)a.w.pts=p.map(q=>[q[0]+dx,q[1]+dy]);else{const me=(i,j)=>{const wasH=p[i][1]===p[j][1],wasV=p[i][0]===p[j][0];p[i]=[p[i][0]+dx,p[i][1]+dy];if(p.length>2){if(wasH&&!wasV)p[j][1]+=dy;else if(wasV&&!wasH)p[j][0]+=dx}};
    if(a.as)me(0,1);if(a.ae)me(p.length-1,p.length-2);a.w.pts=p}}}
function moveEnd(st){for(const a of st.att)a.w.pts=simplify(a.w.pts);selItems().forEach(i=>{if(i.t==='w')i.pts=simplify(i.pts)})}

svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);const p=toW(e);cursor=p;
  if(e.button===1||spaceDown||(e.button===0&&e.altKey&&tool==='select')){drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};svg.classList.add('pan');return}
  if(e.button===2)return;
  if(tool==='place'&&placing){placeAt(placing.id,p,placing.rot,placing.mir);return}
  if(tool==='wire'){const q=wpt(p);
    if(!draft){draft={pts:[q],mode:'hv'};render();return}
    const last=draft.pts[draft.pts.length-1];if(q[0]===last[0]&&q[1]===last[1]){finishWire();return}
    draft.pts.push(...route(last,q,draft.mode));
    if(draft.pts.length>1&&onWireOrPin(q))finishWire();else render();return}
  if(tool==='text'){mark();const t={id:uid(),t:'t',x:snap(p.x),y:snap(p.y),text:'文字',size:12,rot:0,bold:false,anchor:'start',color:'#111111'};cur().items.push(t);sel=new Set([t.id]);setTool('select');renderProps();setTimeout(()=>{const f=$('#pbody [data-k="text"]');if(f){f.focus();f.select()}},30);return}
  if(tool==='line'||tool==='rect'||tool==='ellipse'){drag={kind:'shape',p0:{x:snap(p.x),y:snap(p.y)},preview:null};return}
  // select tool
  const h=e.target.closest('[data-h]');
  if(h){const w=findIt(h.dataset.wid);drag={kind:'vtx',w,j:+h.dataset.h,orig:clone(w.pts),p0:p,moved:false};return}
  const g=e.target.closest('[data-id]');
  if(g){const id=g.dataset.id;const it=findIt(id);
    if(e.shiftKey||e.ctrlKey||e.metaKey){sel.has(id)?sel.delete(id):sel.add(id);render();renderProps();return}
    const segEl=e.target.closest('[data-seg]');
    if(it&&it.t==='w'&&sel.size===1&&sel.has(id)&&segEl){drag={kind:'seg',w:it,i:+segEl.dataset.seg,orig:clone(it.pts),p0:p,moved:false};return}
    if(!sel.has(id)){sel=new Set([id]);renderProps()}
    drag={kind:'move',p0:p,st:null,moved:false};render();return}
  if(sel.size){sel.clear();renderProps()}
  drag={kind:'marq',p0:p,p1:p,add:e.shiftKey};render();});

svg.addEventListener('pointermove',e=>{const p=toW(e);cursor=p;
  $('#sXY').textContent=`X ${(p.x/U).toFixed(1)}  Y ${(p.y/U).toFixed(1)} mm`;
  if(drag){
    if(drag.kind==='pan'){view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy;render();return}
    if(drag.kind==='move'){const dx=snap(p.x-drag.p0.x),dy=snap(p.y-drag.p0.y);if(!drag.moved&&(dx||dy)){mark();drag.st=moveStart();drag.moved=true}if(drag.moved){moveApply(drag.st,dx,dy);render()}return}
    if(drag.kind==='vtx'){const q=wpt(p);if(!drag.moved){mark();drag.moved=true}const pts=clone(drag.orig);pts[drag.j]=q;drag.w.pts=pts;render();return}
    if(drag.kind==='seg'){const pts=clone(drag.orig);let i=drag.i;const a=pts[i],b=pts[i+1];const hz=a[1]===b[1];const d=hz?snap(p.y-drag.p0.y):snap(p.x-drag.p0.x);if(!d&&!drag.moved)return;if(!drag.moved){mark();drag.moved=true}
      if(i===0){pts.unshift([...pts[0]]);i++}if(i+1===pts.length-1)pts.push([...pts[pts.length-1]]);
      if(hz){pts[i][1]+=d;pts[i+1][1]+=d}else{pts[i][0]+=d;pts[i+1][0]+=d}drag.w.pts=pts;render();return}
    if(drag.kind==='marq'){drag.p1=p;render();return}
    if(drag.kind==='shape'){const a=drag.p0,b={x:snap(p.x),y:snap(p.y)};const st={color:'#111111',sw:1.2,dash:tool==='ellipse',fill:'none'};
      drag.preview=tool==='line'?{t:'l',x1:a.x,y1:a.y,x2:b.x,y2:b.y,...st}:{t:tool==='rect'?'r':'e',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y),...st};render();return}
    return}
  if(tool==='wire'||placing){const q=nearPin(p,10/Math.min(view.k,1.5));const changed=(q?q.x+','+q.y:'')!==(hoverPin?hoverPin.x+','+hoverPin.y:'');hoverPin=q;if(draft||placing||changed)render()}
});

function delSel(){if(!sel.size)return;mark();cur().items=cur().items.filter(i=>!sel.has(i.id));sel.clear();render();renderProps()}
function groupCenter(items){const bs=items.map(bbox);const c=[(Math.min(...bs.map(b=>b[0]))+Math.max(...bs.map(b=>b[2])))/2,(Math.min(...bs.map(b=>b[1]))+Math.max(...bs.map(b=>b[3])))/2];return[snapU(c[0]),snapU(c[1])]}
function rotSel(){if(placing){placing.rot=(placing.rot+90)%360;render();return}const items=selItems();if(!items.length)return;mark();
  let c;if(items.length===1&&items[0].t==='s'){const g=geom(items[0]);const pv=pivot(g);c=[items[0].x+pv[0],items[0].y+pv[1]]}else c=groupCenter(items);
  for(const it of items){
    if(it.t==='s'){const g=geom(it),pv=pivot(g);const np=rotP([it.x+pv[0],it.y+pv[1]],c);it.x=np[0]-pv[0];it.y=np[1]-pv[1];it.rot=((it.rot||0)+90)%360}
    else if(it.t==='w')it.pts=it.pts.map(p=>rotP(p,c));
    else if(it.t==='t'){const np=rotP([it.x,it.y],c);it.x=np[0];it.y=np[1];it.rot=(it.rot||0)===0?270:0}
    else if(it.t==='l'){const a=rotP([it.x1,it.y1],c),b=rotP([it.x2,it.y2],c);Object.assign(it,{x1:a[0],y1:a[1],x2:b[0],y2:b[1]})}
    else{const a=rotP([it.x,it.y],c),b=rotP([it.x+it.w,it.y+it.h],c);Object.assign(it,{x:Math.min(a[0],b[0]),y:Math.min(a[1],b[1]),w:Math.abs(a[0]-b[0]),h:Math.abs(a[1]-b[1])})}}
  render();renderProps()}
function mirSel(){if(placing){placing.mir=!placing.mir;render();return}const items=selItems();if(!items.length)return;mark();
  let c;if(items.length===1&&items[0].t==='s'){const pv=pivot(geom(items[0]));c=[items[0].x+pv[0],items[0].y]}else c=groupCenter(items);
  for(const it of items){
    if(it.t==='s'){const pv=pivot(geom(it));const np=mirP([it.x+pv[0],0],c);it.x=np[0]-pv[0];it.rot=(360-(it.rot||0))%360;it.mir=!it.mir}
    else if(it.t==='w')it.pts=it.pts.map(p=>mirP(p,c));
    else if(it.t==='t'){it.x=2*c[0]-it.x;it.anchor=it.anchor==='start'?'end':it.anchor==='end'?'start':'middle'}
    else if(it.t==='l'){it.x1=2*c[0]-it.x1;it.x2=2*c[0]-it.x2}
    else it.x=2*c[0]-it.x-it.w}
  render();renderProps()}
function copySel(){const items=selItems();if(!items.length)return;clip=clone(items);pasteN=0;toast(`已複製 ${items.length} 個物件`)}
function paste(){if(!clip)return;mark();pasteN++;const ids=new Set();
  for(const o of clip){const it=clone(o);it.id=uid();translate(it,20*pasteN,20*pasteN);
    if(it.t==='s'&&it.tag){const lb=LIBM[it.s];if(lb&&lb.pre&&allSyms().some(s=>s.tag===it.tag))it.tag=nextTag(lb.pre)}
    cur().items.push(it);ids.add(it.id)}
  sel=ids;render();renderProps()}
function align(mode){const items=selItems();if(items.length<2)return;mark();const bs=items.map(bbox);
  const X0=Math.min(...bs.map(b=>b[0])),X1=Math.max(...bs.map(b=>b[2])),Y0=Math.min(...bs.map(b=>b[1])),Y1=Math.max(...bs.map(b=>b[3]));
  if(mode==='dh'||mode==='dv'){const idx=items.map((it,i)=>i).sort((a,b)=>mode==='dh'?bs[a][0]-bs[b][0]:bs[a][1]-bs[b][1]);
    const tot=idx.reduce((s,i)=>s+(mode==='dh'?bs[i][2]-bs[i][0]:bs[i][3]-bs[i][1]),0);const gap=((mode==='dh'?X1-X0:Y1-Y0)-tot)/(items.length-1);let pos=mode==='dh'?X0:Y0;
    idx.forEach(i=>{const b=bs[i];const d=snap(pos-(mode==='dh'?b[0]:b[1]));mode==='dh'?translate(items[i],d,0):translate(items[i],0,d);pos+=(mode==='dh'?b[2]-b[0]:b[3]-b[1])+gap})}
  else items.forEach((it,i)=>{const b=bs[i];let dx=0,dy=0;
    if(mode==='l')dx=X0-b[0];if(mode==='r')dx=X1-b[2];if(mode==='ch')dx=(X0+X1)/2-(b[0]+b[2])/2;
    if(mode==='t')dy=Y0-b[1];if(mode==='b')dy=Y1-b[3];if(mode==='cv')dy=(Y0+Y1)/2-(b[1]+b[3])/2;translate(it,snap(dx),snap(dy))});
  render()}
function nudge(dx,dy){if(!sel.size)return;mark();const st=moveStart();moveApply(st,dx,dy);moveEnd(st);render()}

window.addEventListener('keydown',e=>{const tg=e.target;const typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT');
  if(e.key==='Escape'){if($('#dlg').innerHTML){closeDlg();return}if(typing){tg.blur();return}if(draft){finishWire();return}if(placing||tool!=='select'){setTool('select');return}sel.clear();render();renderProps();return}
  if(typing)return;const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod&&k==='c'){e.preventDefault();copySel();return}
  if(mod&&k==='x'){e.preventDefault();copySel();delSel();return}
  if(mod&&k==='v'){e.preventDefault();paste();return}
  if(mod&&k==='d'){e.preventDefault();copySel();paste();return}
  if(mod&&k==='a'){e.preventDefault();sel=new Set(cur().items.map(i=>i.id));render();renderProps();return}
  if(mod&&k==='s'){e.preventDefault();saveJSON();return}
  if(mod)return;
  if(e.key===' '){spaceDown=true;svg.classList.add('pan');e.preventDefault();return}
  if(k==='delete'||k==='backspace'){e.preventDefault();delSel();return}
  if(k==='enter'&&draft){finishWire();return}
  if(k==='/'&&draft){draft.mode=draft.mode==='hv'?'vh':'hv';render();return}
  const arrows={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]};
  if(arrows[k]){e.preventDefault();const s=e.shiftKey?50:10;nudge(arrows[k][0]*s,arrows[k][1]*s);return}
  const map={v:'select',w:'wire',t:'text',l:'line',b:'rect',e:'ellipse'};
  if(map[k]){setTool(map[k]);return}
  if(e.key===']'){scaleSel(1.25);return}if(e.key==='['){scaleSel(0.8);return}
  if(k==='r'){rotSel();return}if(k==='m'){mirSel();return}if(k==='f'){fit();return}
  if(k==='+'||k==='='){$('#zIn').click();return}if(k==='-'){$('#zOut').click();return}
});

/* ====================== 網路 (Netlist) ====================== */
function onSegInterior(p,a,b){if(a[1]===b[1]&&p[1]===a[1])return p[0]>Math.min(a[0],b[0])&&p[0]<Math.max(a[0],b[0]);if(a[0]===b[0]&&p[0]===a[0])return p[1]>Math.min(a[1],b[1])&&p[1]<Math.max(a[1],b[1]);return false}
function netlist(pg){const par=new Map();const f=k=>{while(par.has(k)&&par.get(k)!==k){par.set(k,par.get(par.get(k))||par.get(k));k=par.get(k)}return k};
  const u=(a,b)=>{if(!par.has(a))par.set(a,a);if(!par.has(b))par.set(b,b);a=f(a);b=f(b);if(a!==b)par.set(a,b)};const K=p=>p[0]+','+p[1];
  const W=pg.items.filter(i=>i.t==='w'),S=segs(pg);
  W.forEach(w=>w.pts.forEach(p=>u(K(w.pts[0]),K(p))));
  const pins=[];pg.items.forEach(s=>{if(s.t==='s')symPins(s).forEach(p=>pins.push({s,p:[p.x,p.y],n:p.n}))});
  const touch=pt=>{for(const sg of S)if(onSegInterior(pt,sg.a,sg.b))u(K(pt),K(sg.a))};
  W.forEach(w=>{touch(w.pts[0]);touch(w.pts[w.pts.length-1])});pins.forEach(q=>{if(!par.has(K(q.p)))par.set(K(q.p),K(q.p));touch(q.p)});
  const nets=new Map();const g=k=>{const r=f(k);if(!nets.has(r))nets.set(r,{wires:[],pins:[]});return nets.get(r)};
  W.forEach(w=>g(K(w.pts[0])).wires.push(w));pins.forEach(q=>{const r=f(K(q.p));if(nets.has(r))nets.get(r).pins.push(q)});
  return[...nets.values()]}
function pinLabel(q){const lb=LIBM[q.s.s];const b=lb&&lb.b;
  if(b==='arrow_out'||b==='arrow_in')return'→ '+(q.s.p.text||'');if(b==='net')return'['+(q.s.p.text||'')+']';if(b==='gnd'||b==='fg')return'接地';if(b==='dot')return'';
  return(q.s.tag||lb.name)+':'+q.n}
function zoneOf(pg,x,y){const [W,H]=SIZES[pg.size];const nc=Math.max(4,Math.round((W-40)/150)),nr=Math.max(3,Math.round((H-40)/150));
  const c=Math.min(nc,Math.max(1,Math.floor((x-20)/((W-40)/nc))+1)),r=Math.min(nr,Math.max(1,Math.floor((y-20)/((H-40)/nr))+1));return String.fromCharCode(64+r)+c}

  [['X0','原點復歸','按鈕 a 接點','PB1'],['X1','啟動','',''],['X2','停止','',''],['X3','X 前限','',''],['X4','X 後限','',''],['X5','門檢知','近接開關 PNP',''],['X7','緊急停止','',''],['X10','手動選擇 X','選擇開關 2 段',''],
   ['Y0','servo1 SON','',''],['Y1','servo2 SON','',''],['Y2','氣壓缸上升','',''],['Y3','運轉指示燈','',''],['Y4','蜂鳴器','','']].forEach(r=>ws.addRow(r));
  ws=wb.addWorksheet('說明');ws.getColumn(1).width=100;
  ['【零件表】表頭需有「名稱」「規格」，其餘欄位可省略；數量決定自動放置的元件個數。電線、線槽、端子、鋁軌、繼電器座等耗材不畫符號，列入零件表「其他材料」。',
   '【IO表】位址採三菱 8 進位（X0~X7、X10~X17…），每 8 點產生一頁；「元件」欄可填元件庫名稱，空白時依註解判斷：',
   '　輸入：含「緊急」→ 緊急停止；含「停止」→ 按鈕 b 接點；含「限 / 原點 / 感測 / 近接」→ 極限開關；其他 → 按鈕 a 接點',
   '　輸出：含「燈」→ 指示燈；含「閥 / 缸」→ 電磁閥；含「蜂鳴」→ 蜂鳴器；其他 → 繼電器線圈',
   '　可指定的兩端子元件：'+Object.values(LIBM).filter(l=>{const g=B[l.b](l.p||{});return g.pins.length===2&&g.pins[1].x===40&&g.pins[1].y===0}).map(l=>l.name).join('、'),
   '【還原】由本編輯器「匯出 Excel」產生的檔案含完整專案，匯入即可原樣還原。'].forEach(t=>{const r=ws.addRow([t]);r.getCell(1).alignment={wrapText:true}});
  const buf=await wb.xlsx.writeBuffer();await saveFile('線路圖_Excel範本.xlsx',new Blob([buf],{type:XLMIME}))}

function bomPagesSVG(){const rows=bomRows();const per=26;const pages=[];const base={size:'A4L',meta:{title:'零件表',dwgNo:'',rev:''}};
  for(let k=0;k<Math.max(1,Math.ceil(rows.length/per));k++){const chunk=rows.slice(k*per,(k+1)*per);const cw=[40,190,220,100,150,60,90,110];const hd=['NO','名稱','規格','廠商','料號','數量','單價','合計'];
    const X=[50];cw.forEach(w=>X.push(X[X.length-1]+w));let s=`<g font-family="${PF}" font-size="11" fill="${INK}"><text x="50" y="60" font-size="18" font-weight="700">零件表${rows.length>per?` (${k+1})`:''}</text>`;
    const y0=76,rh=22;s+=`<rect x="${X[0]}" y="${y0}" width="${X[8]-X[0]}" height="${rh}" fill="#e8ecef"/>`;
    hd.forEach((h,i)=>s+=`<text x="${X[i]+6}" y="${y0+15}" font-weight="700">${h}</text>`);
    chunk.forEach((r,i)=>{const y=y0+rh*(i+1);const vals=[k*per+i+1,r.name,r.spec,r.maker,r.partno,r.qty,money(r.price),money(r.qty*r.price)];
      vals.forEach((v,j)=>s+=`<text x="${j>=5?X[j+1]-6:X[j]+6}" y="${y+15}"${j>=5?' text-anchor="end"':''}>${esc(v)}</text>`);s+=`<line x1="${X[0]}" y1="${y+rh}" x2="${X[8]}" y2="${y+rh}" stroke="#bbb" stroke-width=".6"/>`});
    if(k===Math.ceil(rows.length/per)-1||!rows.length){const y=y0+rh*(chunk.length+1)+18;s+=`<text x="${X[7]-6}" y="${y}" text-anchor="end" font-weight="700">總價</text><text x="${X[8]-6}" y="${y}" text-anchor="end" font-weight="700">${money(rows.reduce((a,r)=>a+r.qty*r.price,0))}</text>`}
    s+=`<rect x="${X[0]}" y="${y0}" width="${X[8]-X[0]}" height="${rh*(chunk.length+1)}" fill="none" stroke="${INK}" stroke-width=".8"/></g>`;
    pages.push({page:base,body:s})}
  return pages}

/* ====================== 匯出 ====================== */
function fname(kind,ext){const n=(doc.meta.project||'線路圖').replace(/[\\/:*?"<>|]/g,'_').slice(0,60);return`${n}_${kind}.${ext}`}
function pageSVG(pg,idx,total,body,titleOverride){const [W,H]=SIZES[pg.size];
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W/U}mm" height="${H/U}mm" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#fff"/>${frameSVG(pg,idx,total,titleOverride)}${body??itemsSVG(pg,true)}</svg>`}
function svgToCanvas(str,W,H,dpi){return new Promise((res,rej)=>{const img=new Image();const sc=dpi/25.4/U;img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c)};img.onerror=()=>rej(new Error('圖面轉換失敗'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str)})}
let dlP=null;function dlNS(){if(!dlP)dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);return dlP}
async function saveFile(name,blob){const ns=await dlNS();
  if(ns){try{await ns.save({filename:name,data:blob});toast('已儲存 '+name)}catch(e){const c=e&&e.code;toast(c==='declined'?'已取消儲存':c==='rate_limited'?'已有一個儲存視窗開啟中，請稍後再試':'此檢視無法儲存檔案（'+(c||'unavailable')+'）')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('已下載 '+name)}
function saveJSON(){saveFile(fname('專案','json'),new Blob([JSON.stringify(doc,null,1)],{type:'application/json'}))}
const ex={range:'all',dpi:300,bom:true};
function exportDlg(){const seg=(k,opts)=>`<div class="seg">${opts.map(([v,n])=>`<button type="button" data-ek="${k}" data-ev="${v}" aria-pressed="${String(ex[k])===String(v)}">${n}</button>`).join('')}</div>`;
  openDlg('匯出圖面',`<div class="opt"><span>頁面範圍</span>${seg('range',[['all',`全部 ${doc.pages.length} 頁`],['cur','目前頁']])}</div>
    <div class="opt"><span>解析度</span>${seg('dpi',[[200,'200 dpi'],[300,'300 dpi (建議)'],[400,'400 dpi']])}</div>
    <div class="opt"><span>零件表</span>${seg('bom',[[true,'附在最後'],[false,'不附']])}</div>
    <p class="note">PDF 為每頁一張高解析圖面（中文字型完整保留），圖紙尺寸依各頁設定（A4 / A3）。需要向量檔可匯出 SVG，再以 AutoCAD / Inkscape 開啟。</p>
    <div class="prog" id="eprog" hidden><i></i></div>`,
    `<button class="btn" data-x="svg">SVG（目前頁）</button><button class="btn" data-x="png">PNG（目前頁）</button><button class="btn primary" data-x="pdf">匯出 PDF</button>`);
  $('#dlg .body').addEventListener('click',e=>{const b=e.target.closest('[data-ek]');if(!b)return;const k=b.dataset.ek;let v=b.dataset.ev;ex[k]=k==='dpi'?+v:k==='bom'?v==='true':v;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#dlg [data-x="pdf"]').onclick=exportPDF;
  $('#dlg [data-x="png"]').onclick=async()=>{const pg=cur();const [W,H]=SIZES[pg.size];const c=await svgToCanvas(pageSVG(pg,pi,doc.pages.length),W,H,ex.dpi);c.toBlob(b=>saveFile(fname(pg.name,'png'),b),'image/png')};
  $('#dlg [data-x="svg"]').onclick=()=>{const pg=cur();saveFile(fname(pg.name,'svg'),new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+pageSVG(pg,pi,doc.pages.length)],{type:'image/svg+xml'}))};}
async function exportPDF(){if(!window.jspdf){toast('PDF 元件尚未載入，請確認網路後重試');return}
  const btn=$('#dlg [data-x="pdf"]');btn.disabled=true;const prog=$('#eprog');prog.hidden=false;
  try{const list=[];const total=doc.pages.length;const bp=ex.bom?bomPagesSVG():[];const tot2=total+bp.length;
    (ex.range==='all'?doc.pages.map((p,i)=>[p,i]):[[cur(),pi]]).forEach(([p,i])=>list.push({pg:p,svg:pageSVG(p,i,tot2)}));
    bp.forEach((b,k)=>list.push({pg:b.page,svg:pageSVG(b.page,total+k,tot2,b.body,'零件表')}));
    let pdf=null;
    for(let k=0;k<list.length;k++){const {pg,svg:s}=list[k];const [W,H]=SIZES[pg.size];const wmm=W/U,hmm=H/U;const ori=wmm>hmm?'landscape':'portrait';
      const c=await svgToCanvas(s,W,H,ex.dpi);const data=c.toDataURL('image/png');
      if(!pdf)pdf=new window.jspdf.jsPDF({orientation:ori,unit:'mm',format:[wmm,hmm],compress:true});else pdf.addPage([wmm,hmm],ori);
      pdf.addImage(data,'PNG',0,0,wmm,hmm,undefined,'FAST');prog.firstElementChild.style.width=((k+1)/list.length*100)+'%';await new Promise(r=>setTimeout(r,0))}
    pdf.setProperties({title:doc.meta.project||'電氣迴路圖',subject:'電氣迴路圖',creator:'線路圖編輯器'});
    await saveFile(fname(ex.range==='all'?'電氣迴路圖':cur().name,'pdf'),pdf.output('blob'));closeDlg()}
  catch(err){toast('匯出失敗：'+err.message)}finally{if(btn.isConnected){btn.disabled=false;prog.hidden=true}}}

/* ====================== 對話框 / 提示 ====================== */
function openDlg(title,body,foot,wide){$('#dlg').innerHTML=`<div class="mask"><div class="dlg${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="btn" data-x="close" aria-label="關閉">✕</button></header><div class="body">${body}</div><div class="foot">${foot||''}</div></div></div>`;
  $('#dlg .mask').addEventListener('click',e=>{if(e.target.classList.contains('mask')||e.target.closest('[data-x="close"]'))closeDlg()})}
function closeDlg(){$('#dlg').innerHTML='';render()}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function helpDlg(){const K=[['V','選取 / 移動'],['W','導線'],['T','文字'],['L','直線'],['B','矩形'],['E','橢圓 / 虛線框'],['R','旋轉 90°'],['M','水平鏡像'],[']  /  [','元件放大 / 縮小'],['Del','刪除'],['Ctrl+Z / Ctrl+Y','復原 / 重做'],['Ctrl+C / Ctrl+V','複製 / 貼上'],['Ctrl+D','原地複製'],['Ctrl+A','全選本頁'],['Ctrl+S','儲存專案 .json'],['方向鍵','微調 2.5 mm（Shift 12.5 mm）'],['F','整頁顯示'],['滾輪','以游標為中心縮放'],['空白鍵 / 中鍵 拖曳','平移畫面'],['Enter / 雙擊 / 右鍵','結束導線'],['/','導線切換先橫或先直'],['Esc','取消 / 回到選取']];
  openDlg('操作說明',`<div class="keys">${K.map(([k,v])=>`<div><span>${v}</span><kbd>${k}</kbd></div>`).join('')}</div>
   <p class="note"><b>參考市售軟體的做法：</b>元件接腳落在 2.5 mm 格點上（同 EPLAN / AutoCAD Electrical）；導線端點碰到接腳或其他導線即自動連接，T 字分歧自動加黑點，未連接的交叉自動畫跳線弧（同原圖的 R/S/T 匯流排畫法）；移動元件時相連導線會跟著拉伸；框選由左往右為「完全包含」、由右往左為「碰到即選」（同 AutoCAD）。</p>
   <p class="note"><b>Excel：</b>「匯入 Excel」可讀取零件表（自動放置元件、耗材列入其他材料）、IO 表（每 8 點自動產生 PLC 圖頁）或本編輯器匯出的檔案（完整還原）；「匯出 Excel」產生零件表（含公式）、IO 表、元件清單、接線表及各頁圖面。</p><p class="note">元件代號自動編號（NFB1、MS1、CR1…），零件表由元件屬性自動彙整並可匯出 CSV 或附在 PDF 最後一頁。專案會自動暫存於此瀏覽器，正式保存請按「儲存」下載 .json 檔。</p>`,`<button class="btn primary" data-x="close">知道了</button>`,true)}

/* ====================== 工具列 ====================== */
document.querySelectorAll('#tools [data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bRot').onclick=rotSel;$('#bMir').onclick=mirSel;$('#bDel').onclick=delSel;
$('#bNew').onclick=()=>{mark();doc=blankDoc();pi=0;sel.clear();full();fit();toast('已建立空白專案（可按復原取回）')};
$('#bSample').onclick=()=>{mark();doc=sampleDoc();pi=0;sel.clear();full();fit();toast('已載入範例（可按復原取回）')};
$('#bOpen').onclick=()=>$('#fileIn').click();
$('#xlIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readExcel(f)};
$('#bXlIn').onclick=excelImportDlg;$('#bXlOut').onclick=exportXLSX;
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;if(/\.xlsx$/i.test(f.name)){e.target.value='';readExcel(f);return}const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.pages)||!d.pages.length)throw new Error('不是線路圖專案檔');
  d.meta=d.meta||blankDoc().meta;d.extra=d.extra||[];d.pages.forEach(p=>{p.items=(p.items||[]).filter(i=>i.t!=='s'||LIBM[i.s]);p.size=SIZES[p.size]?p.size:'A4L';p.meta=p.meta||{title:'',dwgNo:'',rev:''}});
  mark();doc=d;pi=0;sel.clear();full();fit();toast('已開啟 '+f.name)}catch(err){toast('無法開啟：'+err.message)}};r.readAsText(f);e.target.value=''};
$('#bSave').onclick=saveJSON;$('#bExport').onclick=exportDlg;$('#bBom').onclick=bomDialog;$('#bHelp').onclick=helpDlg;
$('#oGrid').onchange=e=>{opt.grid=e.target.checked;render()};$('#oSnap').onchange=e=>{opt.snap=e.target.checked};$('#oHop').onchange=e=>{opt.hops=e.target.checked;render()};
$('#wcol').innerHTML=WCOL.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');$('#wcol').onchange=e=>{wireColor=e.target.value};
$('#bLib').onclick=()=>{$('#lib').classList.toggle('open');$('#props').classList.remove('open')};
$('#bProps').onclick=()=>{$('#props').classList.toggle('open');$('#lib').classList.remove('open')};
window.addEventListener('resize',()=>render());

/* ====================== 啟動 ====================== */
try{const s=JSON.parse(localStorage.getItem('ckt-editor-doc')||'null');if(s&&s.doc&&Array.isArray(s.doc.pages)&&s.doc.pages.length){doc=s.doc;pi=Math.min(s.pi||0,doc.pages.length-1)}}catch(e){}
if(!doc)doc=sampleDoc();
renderLib();setTool('select');full();requestAnimationFrame(fit);
window.__ckt={get doc(){return doc},exportXLSX,netlist,analyzeWB,applyImport,readExcel,exportPDF,pageSVG,bomRows,sampleDoc,computeDots,computeHops};
})();
</script>
