<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鋁擠型機架設計器</title>
<style>
:root{--bg:#070c16;--panel:#0e1524;--panel2:#121b2e;--line:#1f2b43;--line2:#2c3d5c;--text:#e6edf7;--muted:#8fa0ba;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:linear-gradient(180deg,#101c33,#0b1324);border-bottom:1px solid var(--line);padding:8px 12px 6px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:6px;flex-wrap:wrap}
.brand small{color:var(--muted);font-weight:400;font-size:12px} .sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row+.row{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:2px} .f>label,.lbl{font-size:11px;color:var(--muted);font-weight:600}
input,select,button{font:inherit;color:var(--text)}
input[type=number],select{height:28px;background:#0a1222;border:1px solid var(--line2);border-radius:6px;padding:0 8px}
input[type=number]{width:80px;text-align:right;color:#7dd3fc;font-weight:700}
input.sm{width:58px} input[type=color]{width:32px;height:28px;padding:0;border:1px solid var(--line2);border-radius:6px;background:none}
.btn{height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:#13203a;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)} .btn.pri{background:linear-gradient(135deg,#0ea5e9,#2563eb);border:none;color:#fff}
.vb{height:26px;padding:0 9px;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;height:28px;cursor:pointer;font-size:12px;white-space:nowrap}
.splist{display:flex;gap:4px;overflow-x:auto;max-width:420px} .splist input{width:66px;height:26px;text-align:center;font-size:12px}
.main{flex:1;display:flex;min-height:0} .viewport{flex:1;display:flex;flex-direction:column;min-width:0}
.vtabs{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.vtab{padding:5px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:700} .vtab.on{background:rgba(56,189,248,.14);color:var(--accent)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 30% 0%,#1d3a63 0%,#0b1528 48%,#060a13 100%)}
#c3d,#c2d{position:absolute;inset:0;width:100%;height:100%;display:block} #c2d{display:none;background:#fff}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dim{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(8,47,73,.88);border:1px solid #38bdf8;color:#e0f2fe;border-radius:5px;padding:1px 6px;font:700 11px/16px ui-monospace,Consolas,monospace;white-space:nowrap}
.dim:hover{background:#0284c7} .dim.tot{background:rgba(30,58,138,.92);border-color:#93c5fd} .dim.lv{border-color:#a78bfa;background:rgba(46,16,101,.85)}
.hud{position:absolute;left:12px;top:12px;background:rgba(2,6,23,.62);border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:10px 12px;font-size:12px;pointer-events:none}
.hud b{color:#7dd3fc} .hud .k{color:var(--muted)}
.hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:#9fb3d1;background:rgba(2,6,23,.55);padding:5px 10px;border-radius:8px;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:#0b1220;border:1px solid var(--accent);color:#e0f2fe;padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;display:none;z-index:6}
.editor{position:absolute;z-index:9;background:#0d1729;border:1px solid var(--accent);border-radius:10px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.55);width:210px}
.editor .et{font-weight:700;font-size:12px;color:var(--accent);margin-bottom:6px} .editor input{width:100%;height:32px;font-size:15px}
.editor .eb{display:flex;gap:6px;justify-content:flex-end;margin-top:8px} .editor .eh{font-size:11px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#7c2d12;border:1px solid #fb923c;color:#fff;padding:8px 16px;border-radius:8px;z-index:50;display:none}
.side{width:310px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)} .sec h4{margin:0 0 10px;font-size:12px;color:var(--accent);display:flex;gap:6px}
.sub{font-size:11px;color:var(--muted);margin:10px 0 5px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px} .cards.c3{grid-template-columns:repeat(3,1fr)}
.pc{border:1px solid var(--line2);border-radius:8px;padding:5px 2px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;background:#0a1222;color:#cbd5e1}
.pc svg{display:block;margin:0 auto 3px} .pc.on{border-color:var(--accent);background:rgba(56,189,248,.12);color:var(--accent)}
.pc small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swc{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)} .swc.on{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 8px;font-size:12px;margin-bottom:8px} .kv b{color:var(--muted);font-weight:600}
.ed-row{display:flex;align-items:center;gap:6px;margin-bottom:6px} .ed-row label{flex:1;font-size:12px} .ed-row input{width:90px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:var(--accent)}
.bom{height:34vh;flex:none;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
.btabs{display:flex;align-items:center;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btab{padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-radius:6px 6px 0 0} .btab.on{color:var(--accent);background:var(--panel2)}
.btabs .tot{font-size:12px;color:var(--muted)} .btabs .tot b{color:#86efac;font-size:14px}
.bbody{flex:1;overflow:auto;background:var(--panel2)}
table{width:100%;border-collapse:collapse;font-size:12px} th{position:sticky;top:0;background:#16213a;color:#9fb3d1;text-align:left;padding:7px 8px}
td{padding:5px 8px;border-bottom:1px solid #1a2540;white-space:nowrap} tr.sum td{font-weight:700;background:#111b30}
.n{text-align:right;font-variant-numeric:tabular-nums} .dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
td input[type=number]{height:24px;width:80px}
.barrow{display:flex;align-items:center;gap:8px;margin:0 10px 4px} .bar{flex:1;display:flex;height:20px;border-radius:4px;overflow:hidden;background:repeating-linear-gradient(45deg,#1e293b 0 6px,#111827 6px 12px)}
.seg{height:100%;font-size:10px;color:#0b1220;font-weight:700;border-right:2px solid #0b1220;display:flex;align-items:center;justify-content:center;overflow:hidden}
.note{font-size:11px;color:var(--muted);padding:6px 10px}
@media (max-width:980px){ body{height:auto;overflow:auto} .main{flex-direction:column} .viewport{height:62vh} .side{width:auto} .bom{height:auto;min-height:50vh} }
</style>

<body>
<header class="topbar">
  <div class="brand">鋁擠型機架設計器 <small>參數化結構・料件樣式・BOM・下料・估價・STEP／PDF</small><span class="sp"></span>
    <button class="btn" data-export id="btn-csv">匯出 BOM (CSV)</button>
    <span style="display:inline-flex"><select id="pdf2d-size" style="border-radius:6px 0 0 6px"><option>A3</option><option>A4</option></select><button class="btn" data-export id="btn-pdf2d" style="border-radius:0 6px 6px 0">匯出 2D 圖面 PDF</button></span>
    <button class="btn" data-export id="btn-report">匯出 PDF 報告書</button>
    <button class="btn pri" data-export id="btn-stp">匯出 3D STEP</button>
  </div>
  <div class="row">
    <div class="f"><label>總寬 W</label><input type="number" id="in-w" step="10"></div>
    <div class="f"><label>總深 D</label><input type="number" id="in-d" step="10"></div>
    <div class="f"><label>總高 H</label><input type="number" id="in-h" step="10"></div>
    <div class="f"><label>寬度格數</label><input type="number" class="sm" id="in-cols" min="1" max="8"></div>
    <div class="f"><label>層數（含底層）</label><input type="number" class="sm" id="in-levels" min="1" max="6"></div>
    <label class="chk"><input type="checkbox" id="in-lock"> 鎖定總尺寸</label>
    <div class="f"><label>各格淨距 (mm)</label><div class="splist" id="sp-w"></div></div>
    <div class="f"><label>各層淨高 (mm，由下而上)</label><div class="splist" id="sp-h"></div></div>

<div class="main">
  <section class="viewport">
    <div class="vtabs"><div class="vtab on" id="tab-3d">3D 預覽</div><div class="vtab" id="tab-2d">工程三視圖</div><span class="sp"></span>
      <button class="btn vb" data-view="iso">等角</button><button class="btn vb" data-view="front">前視</button><button class="btn vb" data-view="right">右視</button><button class="btn vb" data-view="top">俯視</button></div>
    <div id="stage">
      <canvas id="c3d"></canvas><canvas id="c2d"></canvas><div id="labels"></div>
      <div class="hud" id="hud"></div>
      <div class="hint" id="hint">左鍵旋轉｜右鍵平移｜滾輪縮放｜點料件可改尺寸/顏色｜點藍色尺寸直接修改</div>
      <div class="tip" id="tip"></div>
      <div class="editor" id="editor" hidden><div class="et" id="ed-t"></div><input type="number" id="ed-v"><div class="eh" id="ed-h"></div>
        <div class="eb"><button class="btn" id="ed-c">取消</button><button class="btn pri" id="ed-o">確定</button></div></div>
    </div>
  </section>
  <aside class="side">
    <div class="sec"><h4>型材系列</h4><div class="cards" id="prof-cards"></div></div>
    <div class="sec"><h4>型材顏色</h4><div class="sw" id="alu-sw"></div></div>
    <div class="sec"><h4>側板</h4><div class="cards" id="panel-cards"></div>
      <div class="sub">安裝面</div><div style="display:flex;gap:10px"><label class="chk"><input type="checkbox" data-side="back">背面</label><label class="chk"><input type="checkbox" data-side="left">左側</label><label class="chk"><input type="checkbox" data-side="right">右側</label></div>
      <div class="sub">顏色</div><div class="sw" id="panel-sw"></div></div>
    <div class="sec"><h4>檯面板與底座</h4>
      <div style="display:flex;gap:10px;align-items:center"><label class="chk"><input type="checkbox" id="top-on">檯面板</label><div class="f"><label>厚度</label><select id="top-t"><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option></select></div><input type="color" id="top-col"></div>
      <div class="sub">底座</div><div class="cards c3" id="base-cards"></div></div>
    <div class="sec"><h4>選取料件<span class="sp"></span><button class="btn vb" id="sel-clear" style="display:none">取消選取</button></h4><div id="sel-body"></div></div>
  </aside>
</div>
<section class="bom">
  <div class="btabs"><div class="btab on" data-t="alu">鋁材裁切</div><div class="btab" data-t="panel">板材</div><div class="btab" data-t="acc">五金配件</div><div class="btab" data-t="nest">下料排版</div><div class="btab" data-t="est">估價</div>
    <span class="sp"></span><span class="tot">鋁材 <b id="t-len">0</b> m｜重量 <b id="t-kg">0</b> kg｜含稅 <b id="t-cost">0</b></span></div>
  <div class="bbody" id="bbody"></div>
</section>
<div class="toast" id="toast"></div>
<div id="errbar" style="display:none;position:fixed;left:0;right:0;top:0;z-index:999;background:#7f1d1d;color:#fff;padding:10px 16px;font-size:14px"></div>

<script>
(function(){
"use strict";
/*__LIBS__*/

/* ========== 1. 資料表（領域資料：換題目時主要改這裡） ========== */
const ALU_COLORS=[{id:'silver',name:'銀白陽極',hex:'#c9ced6',metal:.85,rough:.3,up:0},{id:'black',name:'黑色陽極',hex:'#2a2c31',metal:.55,rough:.4,up:.1},
  {id:'champ',name:'香檳金陽極',hex:'#c9a96e',metal:.85,rough:.3,up:.15},{id:'white',name:'白色烤漆',hex:'#eef0f2',metal:.05,rough:.55,up:.2}];
const PANELS={sheet:{name:'鋁板 t2',short:'鋁板',price:1650,t:2,metal:true},mesh:{name:'焊接網 50 目',short:'網板',price:650,t:4,tex:true,pitch:50},
  acrylic:{name:'透明壓克力 t5',short:'壓克力',price:1800,t:5,clear:true},none:{name:'無',short:'無',price:0,t:0}};
const PANEL_COLORS=['#c9ced6','#1f2328','#f2f2f2','#f2b705','#9fd3ff'];
const BASES={none:{name:'直接落地',h:0},foot:{name:'調整腳座',h:60},caster:{name:'萬向輪',h:105}};

/* ========== 2. 狀態（單一資料來源） ========== */
const S={w:1500,d:750,h:900,cols:2,levels:3,lock:true,spW:[],spH:[],profile:'4040',alu:'silver',
  panel:'sheet',panelColor:'#c9ced6',sides:{back:true,left:true,right:true},top:true,topT:20,topColor:'#d6cfc2',base:'foot',overrides:{},
  price:{aluKg:180,cut:15,labor:800,kerf:3,stock:6000,margin:15,tax:5,topM2:1800},accPrice:{}};
let parts=[], GEO={}, BOM=null, selectedId=null, view='3d', bomTab='alu';

const $=id=>document.getElementById(id);
const fmt=(n,d)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const money=n=>'NT$ '+fmt(Math.round(n));
const P_=()=>PROFILES[S.profile].s, ins=()=>Math.round(PROFILES[S.profile].slot*0.75);
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2800); }
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
const aluDef=k=>k&&k[0]==='#'?{name:'自訂 '+k,hex:k,metal:.35,rough:.42,up:.25}:(ALU_COLORS.find(c=>c.id===k)||ALU_COLORS[0]);
const partAlu=p=>aluDef(S.overrides[p.id]||S.alu), partCol=p=>S.overrides[p.id]||(p.kind==='plate'?S.topColor:S.panelColor);
const isAlu=p=>p.kind==='post'||p.kind==='beam', isPanel=p=>p.kind==='panel'||p.kind==='plate';

/* ========== 3. 尺寸邏輯：總尺寸 ↔ 各格淨距 ========== */
const spArr=a=>a==='w'?S.spW:S.spH, cnt=a=>a==='w'?S.cols:S.levels-1;
function resetSpacing(a){ const P=P_(), n=cnt(a); if(n<1){ if(a==='h') S.spH=[]; return; }
  const clear=S[a]-(n+1)*P; if(clear<n*10){ toast('總尺寸過小'); S[a]=(n+1)*P+n*100; return resetSpacing(a); }
  const each=Math.floor(clear/n), arr=Array(n).fill(each); arr[n-1]=clear-each*(n-1); if(a==='w') S.spW=arr; else S.spH=arr; }
function setSpan(a,i,v){ v=Math.round(+v); if(!(v>=10)) return toast('尺寸需 ≥ 10');
  const arr=spArr(a);
  if(!S.lock||arr.length===1){ arr[i]=v; S[a]=arr.reduce((x,y)=>x+y,0)+(arr.length+1)*P_(); }
  else{ const j=i===arr.length-1?arr.length-2:arr.length-1, pool=arr[i]+arr[j]; if(v>pool-10){ toast('超過總尺寸，可解除「鎖定總尺寸」'); v=pool-10; } arr[i]=v; arr[j]=pool-v; }
  update(); }
function setTotal(a,v){ v=Math.round(+v); if(!(v>0)) return; S[a]=v; if(a!=='d') resetSpacing(a); update(); }
function setCount(k,v){ S[k]=Math.max(k==='levels'?2:1,Math.min(k==='levels'?6:8,Math.round(+v)||1)); resetSpacing(k==='cols'?'w':'h'); update(); }

/* ========== 4. 結構展開 buildParts()：所有輸出（3D/2D/BOM/STEP）都從這份清單來 ========== */
const B=(cx,cy,cz,sx,sy,sz)=>({cx,cy,cz,sx,sy,sz});
function axisPos(total,sp,P){ const a=[-total/2+P/2]; let c=a[0]; sp.forEach(s=>{c+=P+s;a.push(c)}); return a; }
function buildParts(){
  const P=P_(), I=ins(), h=S.h, out=[];
  const xs=axisPos(S.w,S.spW,P), zs=[-S.d/2+P/2,S.d/2-P/2], ys=axisPos(h,S.spH,P).map(v=>v+h/2), dspan=S.d-2*P;
  GEO={xs,zs,ys,P,dspan};
  xs.forEach((x,c)=>zs.forEach((z,r)=>out.push({id:`P${c}-${r}`,kind:'post',name:'立柱',series:S.profile,len:h,axis:'y',box:B(x,h/2,z,P,h,P),c,r})));
  const lvName=k=>k===0?'底橫梁':k===ys.length-1?'頂橫梁':'中橫梁';
  ys.forEach((y,k)=>{
    zs.forEach((z,r)=>S.spW.forEach((s,c)=>out.push({id:`BW${r}-${c}-${k}`,kind:'beam',name:lvName(k)+'(寬)',series:S.profile,len:s,axis:'x',dir:'W',line:r,bay:c,lvl:k,box:B((xs[c]+xs[c+1])/2,y,z,s,P,P)})));
    xs.forEach((x,c)=>out.push({id:`BD${c}-${k}`,kind:'beam',name:lvName(k)+'(深)',series:S.profile,len:dspan,axis:'z',dir:'D',line:c,bay:0,lvl:k,box:B(x,y,0,P,P,dspan)}));
  });
  if(S.panel!=='none'){ const T=PANELS[S.panel].t;
    for(let k=0;k<ys.length-1;k++){ const y0=ys[k]+P/2, y1=ys[k+1]-P/2, ph=y1-y0, cy=(y0+y1)/2;
      if(S.sides.back) S.spW.forEach((s,c)=>out.push({id:`NB${c}-${k}`,kind:'panel',name:'背板',w:s+2*I,h:ph+2*I,t:T,dir:'W',lvl:k,bay:c,box:B((xs[c]+xs[c+1])/2,cy,zs[0],s,ph,T)}));
      [['left',0],['right',xs.length-1]].forEach(([sd,c])=>{ if(S.sides[sd]) out.push({id:`NS${c}-${k}`,kind:'panel',name:'側板',w:dspan+2*I,h:ph+2*I,t:T,dir:'D',lvl:k,box:B(xs[c],cy,0,T,ph,dspan)}); });
    } }
  if(S.top) out.push({id:'TOP',kind:'plate',name:'檯面板',w:S.w,h:S.d,t:S.topT,box:B(0,h+S.topT/2,0,S.w,S.topT,S.d)});
  return out;
}

/* ========== 5. BOM / 下料 / 估價 ========== */
const accP=(k,d)=>S.accPrice[k]!=null?S.accPrice[k]:d;
function computeBOM(){
  const alu={}, pan={}, acc=[], nest={}, st=S.price; let lenTot=0,kgTot=0,cuts=0;
  parts.forEach(p=>{
    if(isAlu(p)){ const c=partAlu(p), L=Math.round(p.len*10)/10, k=[p.series,L,c.hex,p.name].join('|');
      (alu[k]=alu[k]||{name:p.name,series:p.series,len:L,color:c,qty:0}).qty++; lenTot+=p.len; kgTot+=p.len/1000*PROFILES[p.series].kg; cuts++;
      (nest[p.series+c.hex]=nest[p.series+c.hex]||{series:p.series,color:c,lens:[]}).lens.push(L); }
    else { const col=partCol(p), type=p.kind==='plate'?'檯面板':PANELS[S.panel].name, price=p.kind==='plate'?st.topM2:PANELS[S.panel].price;
      const k=[p.name,Math.round(p.w),Math.round(p.h),p.t,col].join('|');

  if(HAS3D){ const pr=renderer.getPixelRatio(); renderer.setPixelRatio(1); renderer.setSize(1780,1120,false); camera.aspect=1780/1120; camera.updateProjectionMatrix(); dimGroup.visible=false; renderer.render(scene,camera); dimGroup.visible=true; x.drawImage(renderer.domElement,40,72,890,560); renderer.setPixelRatio(pr); resize(); }
  [['外形',`${S.w}×${S.d}×${S.h} mm`],['型材',`${S.profile} ${aluDef(S.alu).name}`],['側板',PANELS[S.panel].name],['檯面',S.top?`t${S.topT}`:'無'],['底座',BASES[S.base].name],['鋁材',`${fmt(BOM.lenTot/1000,2)} m／${fmt(BOM.kgTot,1)} kg`],['含稅估價',money(BOM.cost.total)]]
    .forEach((r,i)=>{ x.fillStyle=i%2?'#fff':'#f1f5f9'; x.fillRect(955,98+i*34,405,34); x.fillStyle='#475569'; x.font=`700 13px ${F}`; x.fillText(r[0],965,115+i*34); x.fillStyle='#0f172a'; x.font=`13px ${F}`; x.fillText(r[1],1060,115+i*34); });
  x=page('工程三視圖'); x.save(); x.translate(30,64); draw2D({ctx:x,w:PW-60,h:PH-104}); x.restore();
  x=page('鋁材裁切清單'); x.font=`13px ${F}`; let y=90; [['品名','型材','長度 mm','數量','顏色'],...BOM.alu.map(g=>[g.name,g.series,fmt(g.len,1),g.qty,g.color.name])].forEach((r,i)=>{ x.fillStyle=i?(i%2?'#f8fafc':'#fff'):'#1e3a8a'; x.fillRect(40,y,PW-80,24); x.fillStyle=i?'#0f172a':'#fff'; r.forEach((v,j)=>x.fillText(String(v),50+j*250,y+12)); y+=24; });
  if(keep) select(keep);
  download(buildRasterPDF(pages.map(c=>canvasJpegBytes(c)),PX,PY),baseName()+'_報告.pdf'); toast(`報告已輸出，共 ${pages.length} 頁`); };

/* ========== 11. 啟動（WebGL 失敗→自動改三視圖，提示列不可擋住按鈕） ========== */
function no3D(){ const b=$('errbar'); b.style.cssText='display:block;position:static;flex:none;background:#78350f;color:#fff;padding:8px 16px;font-size:13px'; document.body.prepend(b);
  b.innerHTML=`⚠ 3D 無法顯示（WebGL 未啟用${GLERR?'：'+GLERR:''}），三視圖、BOM、匯出仍可使用。請在 chrome://settings/system 開啟「圖形加速」後重新啟動瀏覽器。`; }
['w','h'].forEach(resetSpacing);
try{ update(); }catch(e){ console.error(e); window.onerror(e.message,'',0); }
resize(); if(HAS3D) fitView('iso'); else { switchView('2d'); no3D(); }
window.__app={S,select,get HAS3D(){return HAS3D;},get view(){return view;}};
})();
