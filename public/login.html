<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入｜全道親車輛安排系統</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <p class="eyebrow">共編排車</p>
      <h1>全道親車輛安排系統</h1>
      <form id="loginForm" class="login-form">
        <label for="passwordInput">請輸入密碼</label>
        <input id="passwordInput" name="password" type="password" inputmode="numeric" autocomplete="current-password" autofocus required />
        <p id="loginError" class="login-error" role="alert"></p>
        <button class="primary-button" type="submit">登入</button>
      </form>
    </main>
    <script src="login.js" type="module"></script>
  </body>
</html>
