<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><title>鋼構廠房 3D 設計器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 控制室式 — 上方參數列、3D 視窗 + 右側規格欄、下方 BOM 帳冊。單一深色鋼構藍圖風格（刻意單一主題）。 */
:root{
  color-scheme: dark;
  --bg:#0c1520; --panel:#111e2c; --panel-2:#162638; --line:#24384e; --line-2:#2f4a66;
  --fg:#dce6ef; --muted:#8ba0b4; --dim:#5f7891;
  --accent:#e98a35;        /* 紅丹/安全橘：選取、主要動作 */
  --accent-soft:#e98a3522;
  --steel:#6fb0e6;         /* 標註藍 */
  --steel-soft:#6fb0e61f;
  --ok:#4fc58e; --ng:#f2676a; --warn:#e8c450;
  --font-ui:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 32px}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;min-width:0;width:100%;font-family:var(--font-mono);font-size:13px}
select{font-family:var(--font-ui)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
button{cursor:pointer}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0f05;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}

header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.params{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px 0;border-bottom:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.lb{font-size:11.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.w60{width:64px}.w80{width:84px}.w100{width:100px}.w120{width:124px}.w150{width:156px}
.grp{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel)}
.grp-t{font-size:11px;color:var(--accent);letter-spacing:.12em;align-self:center;writing-mode:vertical-rl;padding-right:2px}
.bays{display:flex;flex-wrap:wrap;gap:6px}
.bays input{width:76px}
.chk{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:12.5px;white-space:nowrap;padding-bottom:7px}

.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;margin-top:12px}
.viewer{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.vtabs{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.vbtns{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.stage{position:relative;height:min(64vh,620px);min-height:380px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;white-space:nowrap;
  background:#0c1520d9;border:1px solid var(--steel);color:var(--steel)}
.lbl.h{border-color:#b48cf0;color:#c9aef7}
.lbl.o{border-color:var(--accent);color:var(--accent)}
.lbl.g{border-color:var(--dim);color:var(--muted);border-radius:999px;min-width:22px;text-align:center}
.card{position:absolute;left:10px;top:10px;background:#0c1520e6;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;max-width:calc(100% - 20px);line-height:1.65;font-size:12px;pointer-events:none}
.card b{color:var(--fg)}
.card .k{color:var(--muted)}
.card .big{color:var(--accent);font-weight:700}
.pick{position:absolute;right:10px;top:10px;background:#0c1520f0;border:1px solid var(--accent);border-radius:var(--r);padding:8px 12px;font-size:12px;line-height:1.6;max-width:260px}
.hint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:#0c1520cc;padding:3px 8px;border-radius:4px;pointer-events:none}
.legend{position:absolute;right:10px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);background:#0c1520cc;padding:4px 8px;border-radius:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#views{display:none;padding:12px;gap:12px;overflow:auto;height:min(64vh,620px);min-height:380px}
#views.on{display:grid;grid-template-columns:1fr 1fr}
.sheet{border:1px solid var(--line-2);border-radius:6px;background:#0a121b;min-width:0;display:flex;flex-direction:column}
.sheet.wide{grid-column:1/-1}
.sheet h3{margin:0;font-size:12px;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;letter-spacing:.06em}
.sheet svg{width:100%;height:auto;display:block}

aside.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:14px;min-width:0;max-height:calc(min(64vh,620px) + 44px);overflow:auto}
.sec-t{font-size:12px;font-weight:700;color:var(--steel);letter-spacing:.08em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g1{display:grid;gap:8px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:5px;border:2px solid var(--line-2);padding:0}
.sw button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.walls{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.walls .chk{padding:0}
.op{border:1px solid var(--line-2);border-radius:6px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;position:relative;background:var(--panel-2)}
.op .full{grid-column:1/-1;display:flex;gap:6px}
.op .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--muted);font-size:16px;line-height:1}
.op .x:hover{color:var(--ng)}
details.price summary{cursor:pointer;color:var(--steel);font-weight:700;font-size:12px;letter-spacing:.08em}
details.price .g2{margin-top:8px}
.note{font-size:11.5px;color:var(--muted);line-height:1.6}

.bom{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.btabs{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sum{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:6px 4px}
.sum b{color:var(--fg);font-family:var(--font-mono);font-size:14px}
.sum .tot b{color:var(--accent);font-size:16px}
.tbl-wrap{overflow:auto;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:500;font-size:12px;z-index:1}
td.r,th.r{text-align:right}
td.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr.sub td{background:var(--panel-2);color:var(--muted);font-size:11.5px;letter-spacing:.06em}
tr.total td{font-weight:700;color:var(--fg);background:var(--panel-2)}
tr.grand td{font-weight:700;color:var(--accent);font-size:14px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:#4fc58e22;color:var(--ok)}
.chip.ng{background:#f2676a22;color:var(--ng)}
.chip.warn{background:#e8c45022;color:var(--warn)}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%}
.foot{padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--accent);color:#1a0f05;font-weight:700;padding:8px 16px;border-radius:6px;z-index:20}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

@media (max-width:980px){
  .work{grid-template-columns:1fr}
  aside.side{max-height:none}
  #views.on{grid-template-columns:1fr}
}
@media (max-width:560px){
  .stage,#views{height:58vh;min-height:320px}
  .card{display:none}
  .legend{display:none}
  .grp-t{writing-mode:horizontal-tb;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#e98a35"/><path d="M6 27V15L17 8l11 7v12" fill="none" stroke="#1a0f05" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 27V17M24 27V17M10 19l14 6M24 19l-14 6" stroke="#1a0f05" stroke-width="1.6"/></svg>
    <div><h1>鋼構廠房 3D 設計器</h1><small>門型剛架・小鐵屋・車棚｜型鋼選用・裁切 BOM・結構初檢・估價</small></div>
  </div>
  <div class="top-actions">
    <button class="btn" id="bCopy" title="複製全部清單為表格，可直接貼到 Excel">複製 BOM（貼 Excel）</button>
    <button class="btn" id="bCsv">下載 CSV</button>
    <button class="btn" id="bPng">匯出圖片</button>
    <button class="btn" id="bPdf" title="A3 圖框：立面、側面、平面、3D、BOM、估價">匯出 2D 圖面 PDF</button>
    <button class="btn" id="bStp" title="3D 實體模型 STEP AP214，單位 mm，Z 軸向上">匯出 3D STEP</button>
    <button class="btn primary" id="bOffline" hidden title="下載單一 HTML 檔，離線雙擊即可使用">下載單機版</button>
  </div>
</header>

<section class="params" aria-label="主要尺寸">
  <div class="f"><label for="projName">案名</label><input id="projName" data-k="projName" type="text" class="w150" style="font-family:var(--font-ui)"></div>
  <div class="f"><label for="preset">結構模式</label>
    <select id="preset" class="w150">
      <option value="factory">廠房（單跨門型剛架）</option>
      <option value="ware2">倉庫（雙跨・中柱）</option>
      <option value="shed">小鐵屋（單斜）</option>
      <option value="factoryMz">廠房＋內夾層（半樓層）</option>
      <option value="house2">二層鐵屋</option>
      <option value="house3">三層鐵屋（店住）</option>
      <option value="carport">車棚（開放雙斜）</option>
    </select></div>
  <div class="f"><label for="roof">屋頂形式</label>
    <select id="roof" data-k="roof" class="w100"><option value="gable">雙斜</option><option value="mono">單斜</option><option value="flat">平頂</option></select></div>
  <div class="f"><label for="W">跨度 W (mm)</label><input id="W" data-k="W" type="number" step="100" min="2000" class="w100"></div>
  <div class="f"><label for="L">總長 L (mm)</label><input id="L" data-k="L" type="number" step="100" min="2000" class="w100"></div>
  <div class="f"><label for="H">簷高 H (mm)</label><input id="H" data-k="H" type="number" step="100" min="1800" class="w100"></div>
  <div class="f"><label for="slope">屋面坡度 %</label><input id="slope" data-k="slope" type="number" step="1" min="0" max="50" class="w80"></div>
  <div class="f"><label for="spans">跨數</label><input id="spans" data-k="spans" type="number" min="1" max="4" step="1" class="w60"></div>
  <div class="f"><label for="nBays">開間數</label><input id="nBays" type="number" min="1" max="30" step="1" class="w60"></div>
  <div class="f"><label for="eaveOh">簷口出挑</label><input id="eaveOh" data-k="eaveOh" type="number" step="50" min="0" class="w80"></div>
  <div class="f"><label for="gableOh">山牆出挑</label><input id="gableOh" data-k="gableOh" type="number" step="50" min="0" class="w80"></div>
  <label class="chk"><input type="checkbox" id="lockL" checked> 鎖定總長</label>
  <div class="f" style="flex-basis:100%"><span class="lb">各開間柱距 (mm，1 軸起)</span><div class="bays" id="bays"></div></div>
</section>

<main class="work">
  <section class="viewer" aria-label="模型預覽">
    <div class="vtabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-v="3d">3D 結構預覽</button>
      <button class="tab" role="tab" aria-selected="false" data-v="2d">工程三視圖</button>
      <div class="vbtns" id="camBtns">
        <button class="btn sm" data-cam="iso">等角</button>
        <button class="btn sm" data-cam="front">前視</button>
        <button class="btn sm" data-cam="side">側視</button>
        <button class="btn sm" data-cam="top">俯視</button>
        <label class="chk" style="padding:0 0 0 6px"><input type="checkbox" id="showSkin" checked> 外殼</label>
        <label class="chk" style="padding:0 0 0 2px"><input type="checkbox" id="showDim" checked> 標註</label>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="labels"></div>
      <div class="loading" id="loading">載入 3D 引擎中…</div>
      <div class="card" id="card"></div>
      <div class="pick" id="pick" hidden></div>
      <div class="hint">左鍵旋轉｜右鍵平移｜滾輪縮放｜點構件看規格</div>
      <div class="legend"><span><i style="background:#c9ced6"></i>主構架</span><span><i style="background:#e0b84f"></i>桁條/牆檁</span><span><i style="background:#5fb3a1"></i>樓層構架</span><span><i style="background:#e98a35"></i>斜撐</span></div>
    </div>
    <div id="views"></div>
  </section>

  <aside class="side" aria-label="構件與外殼設定">
    <div>
      <h2 class="sec-t">型鋼規格</h2>
      <div class="g1">
        <div class="f"><label for="p_col">主柱</label><select id="p_col" data-k="prof.col"></select></div>
        <div class="f"><label for="p_raf">屋頂大樑</label><select id="p_raf" data-k="prof.raf"></select></div>
        <div class="f"><label for="p_wind">山牆柱</label><select id="p_wind" data-k="prof.wind"></select></div>
        <div class="g2">
          <div class="f"><label for="p_pur">桁條</label><select id="p_pur" data-k="prof.pur"></select></div>
          <div class="f"><label for="p_girt">牆檁</label><select id="p_girt" data-k="prof.girt"></select></div>
          <div class="f"><label for="p_eave">簷口繫樑</label><select id="p_eave" data-k="prof.eave"></select></div>
          <div class="f"><label for="p_brace">斜撐圓鋼</label><select id="p_brace" data-k="prof.brace"></select></div>
        </div>
      </div>
    </div>
    <div>
      <h2 class="sec-t">樓層與夾層</h2>
      <div class="g1">
        <div class="g2">
          <div class="f"><label for="floors">樓層數</label><select id="floors" data-k="floors" data-num="1"><option value="1">1 層</option><option value="2">2 層</option><option value="3">3 層</option></select></div>
          <div class="f"><label for="floorLL">樓板活載 kgf/m²</label><input id="floorLL" data-k="floorLL" type="number" step="50" min="0"></div>
        </div>
        <div class="f" id="shBox"><span class="lb">各層樓高 (mm，由 1F 起；合計＝簷高)</span><div class="bays" id="storyH"></div></div>
        <div class="f" id="mzBox">
          <label class="chk" style="padding:0"><input type="checkbox" data-k="mz.on"> 廠房內夾層（半樓層）</label>
          <div class="g2" style="margin-top:6px">
            <div class="f"><label for="mz_h">夾層樓板高 FL</label><input id="mz_h" data-k="mz.h" type="number" step="100" min="2000"></div>
            <div class="f"><label for="mz_side">夾層位置</label><select id="mz_side" data-k="mz.side"><option value="left">靠左側牆（A 軸）</option><option value="right">靠右側牆</option><option value="full">全跨度</option></select></div>
            <div class="f"><label for="mz_d">夾層深度 (跨向)</label><input id="mz_d" data-k="mz.d" type="number" step="100" min="1500"></div>
            <div class="f"><label for="mz_cs">夾層柱最大間距</label><input id="mz_cs" data-k="mz.colSp" type="number" step="100" min="1500"></div>
            <div class="f"><label for="mz_b0">起始開間</label><input id="mz_b0" data-k="mz.b0" type="number" step="1" min="1"></div>
            <div class="f"><label for="mz_b1">結束開間</label><input id="mz_b1" data-k="mz.b1" type="number" step="1" min="1"></div>
          </div>
        </div>
        <div class="g2">
          <div class="f"><label for="deck">樓板型式</label><select id="deck" data-k="deck"></select></div>
          <div class="f"><label for="joistSp">小樑間距</label><input id="joistSp" data-k="joistSp" type="number" step="100" min="500"></div>
          <div class="f"><label for="p_fbeam">樓層大樑</label><select id="p_fbeam" data-k="prof.fbeam"></select></div>
          <div class="f"><label for="p_joist">樓板小樑</label><select id="p_joist" data-k="prof.joist"></select></div>
          <div class="f"><label for="p_mcol">夾層柱</label><select id="p_mcol" data-k="prof.mcol"></select></div>
          <div class="f"><label for="p_stair">樓梯斜樑</label><select id="p_stair" data-k="prof.stair"></select></div>
          <label class="chk" style="padding:0;align-self:end"><input type="checkbox" data-k="stairOn"> 設置鋼梯</label>
          <div class="f"><label for="stairW">樓梯寬</label><input id="stairW" data-k="stairW" type="number" step="50" min="600"></div>
        </div>
        <p class="note" id="flNote"></p>
      </div>
    </div>
    <div>
      <h2 class="sec-t">次構件配置</h2>
      <div class="g2">
        <div class="f"><label for="purSp">桁條間距</label><input id="purSp" data-k="purSp" type="number" step="50" min="400"></div>
        <div class="f"><label for="girtSp">牆檁間距</label><input id="girtSp" data-k="girtSp" type="number" step="50" min="400"></div>
        <div class="f"><label for="windSp">山牆柱最大間距</label><input id="windSp" data-k="windSp" type="number" step="100" min="1000"></div>
        <div class="f"><label for="brace">斜撐配置</label><select id="brace" data-k="brace"><option value="ends">端開間</option><option value="ends3">端開間＋每 3 間</option><option value="all">全部開間</option><option value="none">不設</option></select></div>
      </div>
    </div>
    <div>
      <h2 class="sec-t">外殼與牆面</h2>
