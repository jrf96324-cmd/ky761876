<title>鋼構廠房 3D 設計器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 控制室式 — 上方參數列、3D 視窗 + 右側規格欄、下方 BOM 帳冊。單一深色鋼構藍圖風格（刻意單一主題）。 */
:root{
  color-scheme: dark;
  --bg:#0c1520; --panel:#111e2c; --panel-2:#162638; --line:#24384e; --line-2:#2f4a66;
  --fg:#dce6ef; --muted:#8ba0b4; --dim:#5f7891;
  --accent:#e98a35;        /* 紅丹/安全橘：選取、主要動作 */
  --accent-soft:#e98a3522;
  --steel:#6fb0e6;         /* 標註藍 */
  --steel-soft:#6fb0e61f;
  --ok:#4fc58e; --ng:#f2676a; --warn:#e8c450;
  --font-ui:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 32px}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;min-width:0;width:100%;font-family:var(--font-mono);font-size:13px}
select{font-family:var(--font-ui)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
button{cursor:pointer}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0f05;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}

header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.params{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px 0;border-bottom:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.lb{font-size:11.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.w60{width:64px}.w80{width:84px}.w100{width:100px}.w120{width:124px}.w150{width:156px}
.grp{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel)}
.grp-t{font-size:11px;color:var(--accent);letter-spacing:.12em;align-self:center;writing-mode:vertical-rl;padding-right:2px}
.bays{display:flex;flex-wrap:wrap;gap:6px}
.bays input{width:76px}
.chk{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:12.5px;white-space:nowrap;padding-bottom:7px}

.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;margin-top:12px}
.viewer{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.vtabs{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.vbtns{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.stage{position:relative;height:min(64vh,620px);min-height:380px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;white-space:nowrap;
  background:#0c1520d9;border:1px solid var(--steel);color:var(--steel)}
.lbl.h{border-color:#b48cf0;color:#c9aef7}
.lbl.o{border-color:var(--accent);color:var(--accent)}
.lbl.g{border-color:var(--dim);color:var(--muted);border-radius:999px;min-width:22px;text-align:center}
.card{position:absolute;left:10px;top:10px;background:#0c1520e6;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;max-width:calc(100% - 20px);line-height:1.65;font-size:12px;pointer-events:none}
.card b{color:var(--fg)}
.card .k{color:var(--muted)}
.card .big{color:var(--accent);font-weight:700}
.pick{position:absolute;right:10px;top:10px;background:#0c1520f0;border:1px solid var(--accent);border-radius:var(--r);padding:8px 12px;font-size:12px;line-height:1.6;max-width:260px}
.hint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:#0c1520cc;padding:3px 8px;border-radius:4px;pointer-events:none}
.legend{position:absolute;right:10px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);background:#0c1520cc;padding:4px 8px;border-radius:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#views{display:none;padding:12px;gap:12px;overflow:auto;height:min(64vh,620px);min-height:380px}
#views.on{display:grid;grid-template-columns:1fr 1fr}
.sheet{border:1px solid var(--line-2);border-radius:6px;background:#0a121b;min-width:0;display:flex;flex-direction:column}
.sheet.wide{grid-column:1/-1}
.sheet h3{margin:0;font-size:12px;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;letter-spacing:.06em}
.sheet svg{width:100%;height:auto;display:block}

aside.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:14px;min-width:0;max-height:calc(min(64vh,620px) + 44px);overflow:auto}
.sec-t{font-size:12px;font-weight:700;color:var(--steel);letter-spacing:.08em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g1{display:grid;gap:8px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:5px;border:2px solid var(--line-2);padding:0}
.sw button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.walls{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.walls .chk{padding:0}
.op{border:1px solid var(--line-2);border-radius:6px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;position:relative;background:var(--panel-2)}
.op .full{grid-column:1/-1;display:flex;gap:6px}
.op .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--muted);font-size:16px;line-height:1}
.op .x:hover{color:var(--ng)}
details.price summary{cursor:pointer;color:var(--steel);font-weight:700;font-size:12px;letter-spacing:.08em}
details.price .g2{margin-top:8px}
.note{font-size:11.5px;color:var(--muted);line-height:1.6}

.bom{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.btabs{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sum{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:6px 4px}
.sum b{color:var(--fg);font-family:var(--font-mono);font-size:14px}
.sum .tot b{color:var(--accent);font-size:16px}
.tbl-wrap{overflow:auto;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:500;font-size:12px;z-index:1}
td.r,th.r{text-align:right}
td.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr.sub td{background:var(--panel-2);color:var(--muted);font-size:11.5px;letter-spacing:.06em}
tr.total td{font-weight:700;color:var(--fg);background:var(--panel-2)}
tr.grand td{font-weight:700;color:var(--accent);font-size:14px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:#4fc58e22;color:var(--ok)}
.chip.ng{background:#f2676a22;color:var(--ng)}
.chip.warn{background:#e8c45022;color:var(--warn)}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%}
.foot{padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--accent);color:#1a0f05;font-weight:700;padding:8px 16px;border-radius:6px;z-index:20}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

@media (max-width:980px){
  .work{grid-template-columns:1fr}
  aside.side{max-height:none}
  #views.on{grid-template-columns:1fr}
}
@media (max-width:560px){
  .stage,#views{height:58vh;min-height:320px}
  .card{display:none}
  .legend{display:none}
  .grp-t{writing-mode:horizontal-tb;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#e98a35"/><path d="M6 27V15L17 8l11 7v12" fill="none" stroke="#1a0f05" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 27V17M24 27V17M10 19l14 6M24 19l-14 6" stroke="#1a0f05" stroke-width="1.6"/></svg>
    <div><h1>鋼構廠房 3D 設計器</h1><small>門型剛架・小鐵屋・車棚｜型鋼選用・裁切 BOM・結構初檢・估價</small></div>
  </div>
  <div class="top-actions">
    <button class="btn" id="bCopy" title="複製全部清單為表格，可直接貼到 Excel">複製 BOM（貼 Excel）</button>
    <button class="btn" id="bCsv" title="本機開啟時可下載 CSV">下載 CSV</button>
    <button class="btn primary" id="bPng" title="本機開啟時可下載 PNG">匯出圖片</button>
  </div>
</header>

<section class="params" aria-label="主要尺寸">
  <div class="f"><label for="preset">結構模式</label>
    <select id="preset" class="w150">
      <option value="factory">廠房（單跨門型剛架）</option>
      <option value="ware2">倉庫（雙跨・中柱）</option>
      <option value="shed">小鐵屋（單斜）</option>
      <option value="carport">車棚（開放雙斜）</option>
    </select></div>
  <div class="f"><label for="roof">屋頂形式</label>
    <select id="roof" data-k="roof" class="w100"><option value="gable">雙斜</option><option value="mono">單斜</option><option value="flat">平頂</option></select></div>
  <div class="f"><label for="W">跨度 W (mm)</label><input id="W" data-k="W" type="number" step="100" min="2000" class="w100"></div>
  <div class="f"><label for="L">總長 L (mm)</label><input id="L" data-k="L" type="number" step="100" min="2000" class="w100"></div>
  <div class="f"><label for="H">簷高 H (mm)</label><input id="H" data-k="H" type="number" step="100" min="1800" class="w100"></div>
  <div class="f"><label for="slope">屋面坡度 %</label><input id="slope" data-k="slope" type="number" step="1" min="0" max="50" class="w80"></div>
  <div class="f"><label for="spans">跨數</label><input id="spans" data-k="spans" type="number" min="1" max="4" step="1" class="w60"></div>
  <div class="f"><label for="nBays">開間數</label><input id="nBays" type="number" min="1" max="30" step="1" class="w60"></div>
  <div class="f"><label for="eaveOh">簷口出挑</label><input id="eaveOh" data-k="eaveOh" type="number" step="50" min="0" class="w80"></div>
  <div class="f"><label for="gableOh">山牆出挑</label><input id="gableOh" data-k="gableOh" type="number" step="50" min="0" class="w80"></div>
  <label class="chk"><input type="checkbox" id="lockL" checked> 鎖定總長</label>
  <div class="f" style="flex-basis:100%"><span class="lb">各開間柱距 (mm，1 軸起)</span><div class="bays" id="bays"></div></div>
</section>

<main class="work">
  <section class="viewer" aria-label="模型預覽">
    <div class="vtabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-v="3d">3D 結構預覽</button>
      <button class="tab" role="tab" aria-selected="false" data-v="2d">工程三視圖</button>
      <div class="vbtns" id="camBtns">
        <button class="btn sm" data-cam="iso">等角</button>
        <button class="btn sm" data-cam="front">前視</button>
        <button class="btn sm" data-cam="side">側視</button>
        <button class="btn sm" data-cam="top">俯視</button>
        <label class="chk" style="padding:0 0 0 6px"><input type="checkbox" id="showSkin" checked> 外殼</label>
        <label class="chk" style="padding:0 0 0 2px"><input type="checkbox" id="showDim" checked> 標註</label>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="labels"></div>
      <div class="loading" id="loading">載入 3D 引擎中…</div>
      <div class="card" id="card"></div>
      <div class="pick" id="pick" hidden></div>
      <div class="hint">左鍵旋轉｜右鍵平移｜滾輪縮放｜點構件看規格</div>
      <div class="legend"><span><i style="background:#c9ced6"></i>主構架</span><span><i style="background:#e0b84f"></i>桁條/牆檁</span><span><i style="background:#e98a35"></i>斜撐</span></div>
    </div>
    <div id="views"></div>
  </section>

  <aside class="side" aria-label="構件與外殼設定">
    <div>
      <h2 class="sec-t">型鋼規格</h2>
      <div class="g1">
        <div class="f"><label for="p_col">主柱</label><select id="p_col" data-k="prof.col"></select></div>
        <div class="f"><label for="p_raf">屋頂大樑</label><select id="p_raf" data-k="prof.raf"></select></div>
        <div class="f"><label for="p_wind">山牆柱</label><select id="p_wind" data-k="prof.wind"></select></div>
        <div class="g2">
          <div class="f"><label for="p_pur">桁條</label><select id="p_pur" data-k="prof.pur"></select></div>
          <div class="f"><label for="p_girt">牆檁</label><select id="p_girt" data-k="prof.girt"></select></div>
          <div class="f"><label for="p_eave">簷口繫樑</label><select id="p_eave" data-k="prof.eave"></select></div>
          <div class="f"><label for="p_brace">斜撐圓鋼</label><select id="p_brace" data-k="prof.brace"></select></div>
        </div>
      </div>
    </div>
    <div>
      <h2 class="sec-t">次構件配置</h2>
      <div class="g2">
        <div class="f"><label for="purSp">桁條間距</label><input id="purSp" data-k="purSp" type="number" step="50" min="400"></div>
        <div class="f"><label for="girtSp">牆檁間距</label><input id="girtSp" data-k="girtSp" type="number" step="50" min="400"></div>
        <div class="f"><label for="windSp">山牆柱最大間距</label><input id="windSp" data-k="windSp" type="number" step="100" min="1000"></div>
        <div class="f"><label for="brace">斜撐配置</label><select id="brace" data-k="brace"><option value="ends">端開間</option><option value="ends3">端開間＋每 3 間</option><option value="all">全部開間</option><option value="none">不設</option></select></div>
      </div>
    </div>
    <div>
      <h2 class="sec-t">外殼與牆面</h2>
      <div class="g1">
        <div class="f"><label for="roofPanel">屋面板</label><select id="roofPanel" data-k="roofPanel"></select></div>
        <div class="f"><label for="wallPanel">牆面板</label><select id="wallPanel" data-k="wallPanel"></select></div>
        <div class="walls">
          <label class="chk"><input type="checkbox" data-k="walls.front"> 前山牆（1 軸）</label>
          <label class="chk"><input type="checkbox" data-k="walls.back"> 後山牆（末軸）</label>
          <label class="chk"><input type="checkbox" data-k="walls.left"> 左側牆（A 軸）</label>
          <label class="chk"><input type="checkbox" data-k="walls.right"> 右側牆（末軸）</label>
        </div>
        <div class="f"><span class="lb">鋼構塗裝色</span><div class="sw" data-sw="steel"></div></div>
        <div class="f"><span class="lb">屋面板顏色</span><div class="sw" data-sw="roof"></div></div>
        <div class="f"><span class="lb">牆面板顏色</span><div class="sw" data-sw="wall"></div></div>
      </div>
    </div>
    <div>
      <h2 class="sec-t">門窗開口 <span style="display:flex;gap:4px"><button class="btn sm" data-add="rollup">＋鐵捲門</button><button class="btn sm" data-add="door">＋門</button><button class="btn sm" data-add="window">＋窗</button></span></h2>
      <div class="g1" id="ops"></div>
    </div>
    <div>
      <h2 class="sec-t">設計荷重</h2>
      <div class="g2">
        <div class="f"><label for="LL">屋頂活載 kgf/m²</label><input id="LL" data-k="LL" type="number" step="10"></div>
        <div class="f"><label for="wq">設計風壓 kgf/m²</label><input id="wq" data-k="wq" type="number" step="10"></div>
        <div class="f"><label for="Fy">鋼材 Fy kgf/cm²</label><select id="Fy" data-k="Fy"><option value="2500">SS400 (2500)</option><option value="3300">SN490B (3300)</option></select></div>
        <div class="f"><label for="paint">表面處理</label><select id="paint" data-k="paint"><option value="paint">防鏽漆＋面漆</option><option value="galv">熱浸鍍鋅</option></select></div>
      </div>
    </div>
    <details class="price">
      <summary>單價設定（NT$，可依當期報價修改）</summary>
      <div class="g2" id="priceBox"></div>
      <p class="note">預設值為 2026 年台灣市場參考行情，實際依鋼價、地區、運距、工期調整。</p>
    </details>
  </aside>
</main>

<section class="bom" aria-label="材料清單">
  <div class="btabs" role="tablist" id="btabs">
    <button class="tab" role="tab" aria-selected="true" data-t="steel">鋼材裁切清單</button>
    <button class="tab" role="tab" aria-selected="false" data-t="skin">板材・收邊</button>
    <button class="tab" role="tab" aria-selected="false" data-t="hw">五金・門窗</button>
    <button class="tab" role="tab" aria-selected="false" data-t="check">結構初檢</button>
    <button class="tab" role="tab" aria-selected="false" data-t="quote">估價單</button>
    <div class="sum" id="sum"></div>
  </div>
  <div class="tbl-wrap" id="tbl"></div>
  <div class="foot" id="foot"></div>
</section>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 型鋼資料 (CNS/JIS 常用斷面；kg/m、Ix cm⁴、Zx cm³) ================= */

function makeState(key){
  const p = structuredClone(PRESETS[key]);
  const s = {preset:key, ...p, LL:60, wq:110, Fy:'2500', paint:'paint', colors:{steel:'#c9ced6',roof:'#3f7fb5',wall:'#d8dde3'}};
  if(key==='shed'){s.colors.roof='#b8bec6';s.colors.wall='#e9e5dc'}
  s.bays = Array(p.nBays).fill(Math.round(p.L/p.nBays));
  s.bays[s.bays.length-1] = p.L - s.bays.slice(0,-1).reduce((a,b)=>a+b,0);
  s.price = {...BASE_PRICE, fMain:p.found.fMain, fWind:p.found.fWind};
  delete s.found; delete s.nBays;
  return s;
}

/* ================= 幾何產生 ================= */
function gen(){
  const s=st, W=+s.W, L=+s.L, H=+s.H, k=(+s.slope)/100;
  const raf=PROF[s.prof.raf], col=PROF[s.prof.col], wind=PROF[s.prof.wind], pur=PROF[s.prof.pur], girt=PROF[s.prof.girt], eave=PROF[s.prof.eave];
  const roofY = x => s.roof==='gable' ? H + k*(x<=W/2? x : W-x) : s.roof==='mono' ? H + k*x : H;
  const spans = Math.max(1, Math.min(4, Math.round(+s.spans)||1));
  const colX = Array.from({length:spans+1},(_,i)=>W*i/spans);
  const fz=[0]; s.bays.forEach(b=>fz.push(fz[fz.length-1]+(+b)));
  const nb=s.bays.length, gOh=+s.gableOh, oh=+s.eaveOh;
  const M=[], add=o=>M.push(o);
  const conn = {knee:0, ridge:0, splice:0, colTop:0, purEnds:0, clips:0, turnbuckle:0};

  // 主柱
  fz.forEach((z,fi)=>colX.forEach((x,ci)=>{
    const top = roofY(x)-raf.h;
    const edge = ci===0||ci===spans;
    add({grp:'main',name:edge?'主柱':'中柱',prof:s.prof.col,p1:[x,0,z],p2:[x,top,z],up:[1,0,0],len:top,note:'底板焊接・頂部端板',axis:`${fi+1}/${String.fromCharCode(65+ci)}`});
    if(edge) conn.knee++; else conn.colTop++;
  }));
  // 屋頂大樑
  const bp = new Set([-oh, W+oh, ...colX.slice(1,-1)]); if(s.roof==='gable') bp.add(W/2);
  const xs=[...bp].sort((a,b)=>a-b);
  fz.forEach((z,fi)=>{
    for(let i=0;i<xs.length-1;i++){
      const a=xs[i], b=xs[i+1], ya=roofY(a)-raf.h/2, yb=roofY(b)-raf.h/2;
      const len=Math.hypot(b-a, yb-ya), n=Math.ceil(len/12000);
      for(let j=0;j<n;j++){
        const t0=j/n,t1=(j+1)/n;
        add({grp:'main',name:'屋頂大樑',prof:s.prof.raf,p1:[a+(b-a)*t0,ya+(yb-ya)*t0,z],p2:[a+(b-a)*t1,ya+(yb-ya)*t1,z],up:[0,1,0],len:len/n,note:n>1?'分段・續接板':'兩端端板・高強度螺栓',axis:`${fi+1}`});
      }
      conn.splice += n-1;
    }
    if(s.roof==='gable') conn.ridge++;
  });
  // 山牆柱
  const windXs={front:[],back:[]};
  [['front',0],['back',L]].forEach(([w,z])=>{
    if(!s.walls[w]) return;
    for(let j=0;j<spans;j++){
      const gap=colX[j+1]-colX[j], n=Math.max(0,Math.ceil(gap/(+s.windSp))-1);
      for(let m=1;m<=n;m++){
        const x=colX[j]+gap*m/(n+1), top=roofY(x)-raf.h;
        windXs[w].push(x);
        add({grp:'main',name:'山牆柱',prof:s.prof.wind,p1:[x,0,z],p2:[x,top,z],up:[0,0,1],len:top,note:'底板焊接・頂部連接板',axis:w==='front'?'1':`${nb+1}`});
      }
    }
  });
  // 簷口繫樑 / 中柱繫樑
  colX.forEach((x,ci)=>{
    const y=roofY(x)-raf.h/2, edge=ci===0||ci===spans;
    for(let j=0;j<nb;j++) add({grp:'sec',name:edge?'簷口繫樑':'中柱繫樑',prof:s.prof.eave,p1:[x,y,fz[j]],p2:[x,y,fz[j+1]],up:[1,0,0],len:+s.bays[j],note:'兩端連接板螺栓'});
  });
  // 桁條
  const planes = s.roof==='gable' ? [{x0:-oh,x1:W/2,nx:-k},{x0:W+oh,x1:W/2,nx:k}] : [{x0:-oh,x1:W+oh,nx:s.roof==='mono'?-k:0}];
  const sec=Math.sqrt(1+k*k), purX=[];
  planes.forEach(pl=>{
    const S=Math.abs(pl.x1-pl.x0)*sec, n=Math.max(2,Math.ceil((S-250)/(+s.purSp))+1);
    const sign=Math.sign(pl.x1-pl.x0), nrm=new THREE.Vector3(pl.nx,1,0).normalize();
    for(let i=0;i<n;i++){
      const sp=100+i*(S-250)/(n-1), x=pl.x0+sign*sp/sec, y=roofY(x)+pur.h/2;
      purX.push(x);
      for(let j=0;j<nb;j++){
        const z0=fz[j]-(j===0?gOh:0), z1=fz[j+1]+(j===nb-1?gOh:0);
        add({grp:'sec',name:'桁條',prof:s.prof.pur,p1:[x,y,z0],p2:[x,y,z1],up:[nrm.x,nrm.y,0],len:z1-z0,note:'兩端各 2 孔 φ14・檁托接合'});
        conn.purEnds+=2;
      }
      conn.clips += nb+1;
    }
  });
  // 斜撐開間
  const braceBays=new Set();
  if(s.brace==='all') for(let j=0;j<nb;j++) braceBays.add(j);
  else if(s.brace!=='none'){ braceBays.add(0); braceBays.add(nb-1); if(s.brace==='ends3') for(let j=3;j<nb-1;j+=3) braceBays.add(j); }
  const inPts=[...new Set([...colX, ...(s.roof==='gable'?[W/2]:[])])].sort((a,b)=>a-b);
  braceBays.forEach(j=>{
    const z0=fz[j], z1=fz[j+1], bay=z1-z0;
    for(let i=0;i<inPts.length-1;i++){
      const a=inPts[i], b=inPts[i+1], m=Math.max(1,Math.round((b-a)/bay));
      for(let q=0;q<m;q++){
        const xa=a+(b-a)*q/m, xb=a+(b-a)*(q+1)/m, ya=roofY(xa)-15, yb=roofY(xb)-15;
        const len=Math.hypot(xb-xa,yb-ya,bay);
        add({grp:'brace',name:'屋面斜撐',prof:s.prof.brace,p1:[xa,ya,z0],p2:[xb,yb,z1],up:[0,1,0],len,note:'兩端車牙＋花籃螺絲'});
        add({grp:'brace',name:'屋面斜撐',prof:s.prof.brace,p1:[xa,ya,z1],p2:[xb,yb,z0],up:[0,1,0],len,note:'兩端車牙＋花籃螺絲'});
        conn.turnbuckle+=2;
      }
    }
    [0,W].forEach(x=>{
      const top=roofY(x)-raf.h-100, m=Math.max(1,Math.round((top-200)/bay));
      for(let q=0;q<m;q++){
        const y0=200+(top-200)*q/m, y1=200+(top-200)*(q+1)/m, len=Math.hypot(bay,y1-y0);
        add({grp:'brace',name:'牆面斜撐',prof:s.prof.brace,p1:[x,y0,z0],p2:[x,y1,z1],up:[1,0,0],len,note:'兩端車牙＋花籃螺絲'});
        add({grp:'brace',name:'牆面斜撐',prof:s.prof.brace,p1:[x,y0,z1],p2:[x,y1,z0],up:[1,0,0],len,note:'兩端車牙＋花籃螺絲'});
        conn.turnbuckle+=2;
      }
    });
  });
  // 牆檁 (扣除開口)
  const ops=s.openings.filter(o=>s.walls[o.wall]);
  const cut=(a,b,y,wall)=>{
    let segs=[[a,b]];
    ops.filter(o=>o.wall===wall && y>(+o.sill)-60 && y<(+o.sill)+(+o.h)+60).forEach(o=>{
      const oa=+o.pos, ob=+o.pos+(+o.w);
      segs=segs.flatMap(([p,q])=> ob<=p||oa>=q ? [[p,q]] : [[p,oa],[ob,q]].filter(([u,v])=>v-u>150));
    });
    return segs;
  };
  const rows=(top)=>{const r=[]; for(let y=300;y<=top;y+=(+s.girtSp)) r.push(y); if(r.length && top-r[r.length-1]>(+s.girtSp)*0.45) r.push(top); return r;};
  const offSide=col.h/2+girt.h/2, offG=Math.max(col.b/2,wind.h/2)+girt.h/2;
  [['left',0,-1],['right',W,1]].forEach(([w,x,sg])=>{
    if(!s.walls[w]) return;
    const top=roofY(x)-raf.h-150;
    rows(top).forEach(y=>{ for(let j=0;j<nb;j++) cut(fz[j],fz[j+1],y,w).forEach(([a,b])=>{
      add({grp:'sec',name:'牆檁',prof:s.prof.girt,p1:[x+sg*offSide,y,a],p2:[x+sg*offSide,y,b],up:[sg,0,0],len:b-a,note:'兩端各 2 孔 φ14'}); conn.purEnds+=2; }); });
  });
  [['front',0,-1],['back',L,1]].forEach(([w,z,sg])=>{
    if(!s.walls[w]) return;
    const posts=[...colX,...windXs[w]].sort((a,b)=>a-b);
    for(let i=0;i<posts.length-1;i++){
      const a=posts[i], b=posts[i+1], top=Math.min(roofY(a),roofY(b))-raf.h-150;
      rows(top).forEach(y=>cut(a,b,y,w).forEach(([p,q])=>{
        add({grp:'sec',name:'牆檁',prof:s.prof.girt,p1:[p,y,z+sg*offG],p2:[q,y,z+sg*offG],up:[0,0,sg],len:q-p,note:'兩端各 2 孔 φ14'}); conn.purEnds+=2; }));
    }
  });
  // 開口框料
  const wallPos=(w,u,y)=>{
    if(w==='front') return [u,y,-offG]; if(w==='back') return [u,y,L+offG];
    if(w==='left') return [-offSide,y,u]; return [W+offSide,y,u];
  };
  const wallTop=(w,u)=> (w==='left'?roofY(0):w==='right'?roofY(W):roofY(u))-raf.h-150;
  ops.forEach(o=>{
    const a=+o.pos, b=a+(+o.w), sill=+o.sill, hd=sill+(+o.h);
    const upN = (o.wall==='front'||o.wall==='back')?[0,0,1]:[1,0,0];
    [a,b].forEach(u=>{ const t=Math.min(wallTop(o.wall,u),hd+600);
      add({grp:'sec',name:'開口框料（立框）',prof:s.prof.girt,p1:wallPos(o.wall,u,0),p2:wallPos(o.wall,u,t),up:upN,len:t,note:`${OPS[o.type]} ${o.w}×${o.h}`}); });
    add({grp:'sec',name:'開口框料（橫框）',prof:s.prof.girt,p1:wallPos(o.wall,a,hd),p2:wallPos(o.wall,b,hd),up:[0,1,0],len:+o.w,note:`${OPS[o.type]} 上框`});
    if(sill>0) add({grp:'sec',name:'開口框料（橫框）',prof:s.prof.girt,p1:wallPos(o.wall,a,sill),p2:wallPos(o.wall,b,sill),up:[0,1,0],len:+o.w,note:`${OPS[o.type]} 下框`});
  });

  const mainCols = M.filter(m=>m.name==='主柱'||m.name==='中柱').length;
  const windCols = M.filter(m=>m.name==='山牆柱').length;
  return {W,L,H,k,roofY,colX,fz,nb,gOh,oh,M,conn,planes,purX,windXs,braceBays,ops,offSide,offG,mainCols,windCols,spans,
    ridge: s.roof==='gable'?roofY(W/2):s.roof==='mono'?roofY(W):H, raf,col,wind,pur,girt,eave};
}

const r5 = v => Math.round(v/5)*5;
function quantities(g){
  const s=st, rows=[];
  // 型鋼合併
  const map=new Map();
  g.M.forEach(m=>{ const key=m.name+'|'+m.prof+'|'+r5(m.len);
    if(!map.has(key)) map.set(key,{name:m.name,prof:m.prof,len:r5(m.len),qty:0,note:m.note,grp:m.grp}); map.get(key).qty++; });
  const order=['主柱','中柱','屋頂大樑','山牆柱','簷口繫樑','中柱繫樑','桁條','牆檁','開口框料（立框）','開口框料（橫框）','屋面斜撐','牆面斜撐'];
  const steel=[...map.values()].sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name)||b.len-a.len).map(r=>{
    const kgm=PROF[r.prof].kg; return {...r,kgm,totLen:r.len*r.qty/1000,kg:kgm*r.len/1000*r.qty,cat:catOf(r.prof)};
  });
  // 鋼板
  const plateKg=(a,b,t)=>a*b*t*7.85e-6;
  const plates=[];
  const pb=[g.col.h+150,g.col.b+150,g.col.h>=300?25:g.col.h>=150?20:12];
  plates.push({name:'柱底板',spec:`${pb[0]}×${pb[1]}×${pb[2]}`,qty:g.mainCols,kgE:plateKg(...pb),note:'4 孔・錨栓'});
  if(g.windCols){const wb=[g.wind.h+120,g.wind.b+120,g.wind.h>=200?16:12]; plates.push({name:'山牆柱底板',spec:`${wb[0]}×${wb[1]}×${wb[2]}`,qty:g.windCols,kgE:plateKg(...wb),note:'4 孔・錨栓'});}
  const ep=[Math.round(g.raf.h*1.4+100),g.raf.b+50,g.raf.h>=300?20:16];
  const nEnd=g.conn.knee*2+g.conn.ridge*2+g.conn.colTop*2+g.conn.splice*2;
  plates.push({name:'端板（柱頂・屋脊・續接）',spec:`${ep[0]}×${ep[1]}×${ep[2]}`,qty:nEnd,kgE:plateKg(...ep),note:'高強度螺栓孔'});
  const clipKg=plateKg(g.pur.h+60,120,6);
  plates.push({name:'檁托（L 型連接片）',spec:`${g.pur.h+60}×120×6`,qty:g.conn.clips,kgE:clipKg,note:'焊於大樑上翼'});
  plates.push({name:'加勁板',spec:`${Math.round(g.raf.h-2*(g.raf.tf||8))}×${Math.round(((g.raf.b||100)-(g.raf.tw||6))/2)}×10`,qty:(g.conn.knee+g.conn.ridge)*4,kgE:plateKg(g.raf.h-20,(g.raf.b-6)/2,10),note:'柱頂・屋脊'});
  plates.forEach(p=>p.kg=p.kgE*p.qty);

  const steelKg = steel.reduce((a,r)=>a+r.kg,0), plateTot=plates.reduce((a,r)=>a+r.kg,0);
  const kgByCat={}; steel.forEach(r=>kgByCat[r.cat]=(kgByCat[r.cat]||0)+r.kg);
  kgByCat['鋼板']=plateTot;
  const totKg=steelKg+plateTot, totLen=steel.reduce((a,r)=>a+r.totLen,0);
  const bars=steel.filter(r=>r.cat!=='圓鋼').reduce((a,r)=>a+Math.ceil(r.qty/Math.max(1,Math.floor(12000/(r.len+5)))),0);

  // 板材
  const k=g.k, sec=Math.sqrt(1+k*k), Lr=g.L+2*g.gOh;
  const roofPlanes = g.planes.map(pl=>Math.abs(pl.x1-pl.x0)*sec*Lr/1e6);
  const roofArea = s.roofPanel==='none'?0:roofPlanes.reduce((a,b)=>a+b,0);
  const opArea=w=>g.ops.filter(o=>o.wall===w).reduce((a,o)=>a+o.w*o.h/1e6,0);
  const gableArea = s.roof==='gable' ? (g.W*g.H + g.W*(g.ridge-g.H)/2)/1e6 : s.roof==='mono' ? (g.W*g.H + g.W*(g.ridge-g.H)/2)/1e6 : g.W*g.H/1e6;
  const walls = [
    ['front','前山牆',gableArea],['back','後山牆',gableArea],
    ['left','左側牆',g.L*g.H/1e6],['right','右側牆',g.L*g.roofY(g.W)/1e6],
  ].filter(([w])=>s.walls[w]).map(([w,n,a])=>({w,n,gross:a,op:opArea(w),net:a-opArea(w)}));
  const wallArea = s.wallPanel==='none'?0:walls.reduce((a,b)=>a+b.net,0);
  const trims=[];
  if(s.roofPanel!=='none'){
    if(s.roof==='gable') trims.push({n:'屋脊蓋板',q:Lr/1000,u:'m'});
    if(s.roof==='mono') trims.push({n:'高側封簷收邊',q:Lr/1000,u:'m'});
    trims.push({n:'山牆封邊（博風收邊）',q:2*roofPlanes.length*(roofPlanes.length? Math.abs(g.planes[0].x1-g.planes[0].x0)*sec/1000:0),u:'m'});
    const eaves = s.roof==='gable'?2:1;
    trims.push({n:'簷溝（天溝）',q:eaves*Lr/1000,u:'m'});
    trims.push({n:'落水管（含彎頭）',q:eaves*(Math.ceil(Lr/9000)+1),u:'支',pipe:true});
  }
  if(s.wallPanel!=='none' && walls.length){
    trims.push({n:'外包角',q:4*g.H/1000,u:'m'});
    trims.push({n:'門窗收邊',q:g.ops.reduce((a,o)=>a+(2*o.h+2*o.w)/1000,0),u:'m'});
    trims.push({n:'牆腳泛水',q:walls.reduce((a,w)=>a+(w.w==='front'||w.w==='back'?g.W:g.L),0)/1000,u:'m'});
  }
  // 五金
  const hw=[];
  hw.push({n:'地腳螺栓 主柱',spec:g.col.h>=300?'M24×700 附雙螺帽墊片':'M20×500 附雙螺帽墊片',q:g.mainCols*4,u:'支',p:'anchor'});
  if(g.windCols) hw.push({n:'地腳螺栓 山牆柱',spec:'M16×400 附雙螺帽墊片',q:g.windCols*4,u:'支',p:'anchor'});
  const hsbPer=g.raf.h>=300?8:6;
  hw.push({n:'高強度螺栓 F10T',spec:`${g.raf.h>=300?'M20':'M16'}×${g.raf.h>=300?60:50} 附螺帽墊片`,q:(g.conn.knee+g.conn.ridge+g.conn.colTop+g.conn.splice)*hsbPer,u:'組',p:'hsb'});
  hw.push({n:'C型鋼接合螺栓',spec:'M12×35 鍍鋅',q:g.conn.purEnds*2+g.M.filter(m=>m.name.includes('繫樑')).length*4,u:'組',p:'bolt'});
  if(g.conn.turnbuckle) hw.push({n:'花籃螺絲',spec:`${st.prof.brace.replace(' 圓鋼','')} 用`,q:g.conn.turnbuckle,u:'組',p:null});
  const screws=Math.ceil(roofArea*6+wallArea*4);
  if(screws) hw.push({n:'自攻螺絲（附防水墊圈）',spec:'#12×25～65（依板厚）',q:screws,u:'支',p:null});
  const opRows = g.ops.map(o=>({n:OPS[o.type],spec:`${o.w}×${o.h}${o.sill>0?' 窗台 '+o.sill:''}・${({front:'前山牆',back:'後山牆',left:'左側牆',right:'右側牆'})[o.wall]}`,q:o.type==='door'?1:o.w*o.h/1e6,u:o.type==='door'?'樘':'m²',type:o.type}));

  return {steel,plates,steelKg,plateTot,totKg,kgByCat,totLen,bars,roofArea,roofPlanes,walls,wallArea,trims,hw,opRows,screws,gableArea};
}

function estimate(g,q){
  const s=st, P=s.price, it=[];
  const kH=q.kgByCat['H型鋼']||0, kC=(q.kgByCat['C型鋼']||0)+(q.kgByCat['方管']||0), kR=(q.kgByCat['圓鋼']||0)+(q.kgByCat['鋼板']||0);
  const T=q.totKg;
  const add=(grp,n,qty,u,p)=>it.push({grp,n,qty,u,p,amt:qty*p});
  add('鋼構','H型鋼 材料',kH,'kg',P.matH);
  add('鋼構','C型鋼・方管 材料',kC,'kg',P.matC);
  add('鋼構','圓鋼・鋼板 材料',kR,'kg',P.matR);
  add('鋼構','加工製作（裁切・鑽孔・焊接）',T,'kg',P.fab);
  add('鋼構',s.paint==='galv'?'熱浸鍍鋅':'防鏽漆＋面漆',T,'kg',s.paint==='galv'?P.galv:P.paint);
  add('鋼構','運輸・吊裝組立',T,'kg',P.erect);
  if(q.roofArea) add('外殼','屋面 '+PANELS[s.roofPanel].n,q.roofArea,'m²',P[s.roofPanel]);
  if(q.wallArea) add('外殼','牆面 '+PANELS[s.wallPanel].n,q.wallArea,'m²',P[s.wallPanel]);
  const trimM=q.trims.filter(t=>t.u==='m').reduce((a,t)=>a+t.q,0); if(trimM) add('外殼','收邊・簷溝',trimM,'m',P.trim);
  const pipes=q.trims.filter(t=>t.pipe).reduce((a,t)=>a+t.q,0); if(pipes) add('外殼','落水管',pipes,'支',P.pipe);
  q.hw.filter(h=>h.p).forEach(h=>add('五金',h.n,h.q,h.u,P[h.p]));
  const misc=q.hw.filter(h=>!h.p);
  if(misc.length) add('五金','花籃螺絲・自攻螺絲等雜項',1,'式',Math.round(misc.reduce((a,h)=>a+(h.n.includes('花籃')?h.q*180:h.q*3.5),0)));
  const ru=q.opRows.filter(o=>o.type==='rollup'); if(ru.length){ add('門窗','鐵捲門',ru.reduce((a,o)=>a+o.q,0),'m²',P.rollup); add('門窗','鐵捲門電動馬達',ru.length,'組',P.motor); }
  const dr=q.opRows.filter(o=>o.type==='door'); if(dr.length) add('門窗','鋼製門（含鎖、門框）',dr.length,'樘',P.door);
  const wn=q.opRows.filter(o=>o.type==='window'); if(wn.length) add('門窗','鋁窗',wn.reduce((a,o)=>a+o.q,0),'m²',P.window);
  add('基礎','主柱獨立基礎（開挖・鋼筋・混凝土）',g.mainCols,'座',P.fMain);
  if(g.windCols) add('基礎','山牆柱基礎',g.windCols,'座',P.fWind);
  if(s.slab) add('基礎','RC 地坪 15cm（含鋼絲網）',g.W*g.L/1e6,'m²',P.slab);
  const sub=it.reduce((a,b)=>a+b.amt,0), mg=sub*P.mgmt/100, tax=(sub+mg)*0.05;
  return {it,sub,mg,tax,total:sub+mg+tax};
}

function checks(g,q){
  const s=st, E=2.04e6, Fy=+s.Fy, Fb=0.6*Fy, maxBay=Math.max(...s.bays.map(Number));
  const DL=PANELS[s.roofPanel].kg + g.pur.kg/(s.purSp/1000) + 10, LL=+s.LL, wq=+s.wq;
  const out=[];
  const beam=(name,prof,Lmm,wkgm,lim,note)=>{
    const p=PROF[prof], Lc=Lmm/10, w=wkgm/100;
    const M=w*Lc*Lc/8, fb=M/p.Zx, d=5*w*Lc**4/(384*E*p.Ix);
    out.push({name,prof,span:Lmm,load:`w = ${wkgm.toFixed(1)} kgf/m`,fml:'M = wL²/8',ratio:fb/Fb,fb,def:d*10,defLim:Lmm/lim,lim,note});
  };
  beam('桁條',s.prof.pur,maxBay,(DL+LL)*s.purSp/1000,180,`DL ${DL.toFixed(0)}＋LL ${LL} kgf/m²`);
  const gGap=Math.max(0, ...[...g.colX, ...g.windXs.front].sort((a,b)=>a-b).map((x,i,a)=>i?x-a[i-1]:0));
  const gSpan=Math.max(s.walls.left||s.walls.right?maxBay:0, s.walls.front||s.walls.back?gGap:0);
  if(gSpan) beam('牆檁',s.prof.girt,gSpan,wq*s.girtSp/1000,150,`風壓 ${wq} kgf/m²`);
  if(g.windCols){ const hc=Math.max(...g.M.filter(m=>m.name==='山牆柱').map(m=>m.len)); const gap=(g.W/g.spans)/(Math.ceil((g.W/g.spans)/s.windSp));
    beam('山牆柱',s.prof.wind,hc,wq*gap/1000,150,`受風寬 ${Math.round(gap)} mm`); }
  // 大樑 — 門型剛架近似
  const raf=g.raf, Ls=g.W/g.spans, wR=(DL+LL)*maxBay/1000+raf.kg;
  const Mr=wR*(Ls/1000)**2/10*100, fbr=Mr/raf.Zx;
  const dr=5*(wR/100)*(Ls/10)**4/(384*E*raf.Ix)*0.5*10;
  out.push({name:'屋頂大樑',prof:s.prof.raf,span:Ls,load:`w = ${wR.toFixed(0)} kgf/m`,fml:'門型剛架 M ≈ wL²/10',ratio:fbr/Fb,fb:fbr,def:dr,defLim:Ls/240,lim:240,note:'端部半剛接近似'});
  // 柱 — 軸力 + 彎矩
  const col=g.col, Hc=g.H-raf.h, P_=wR*Ls/1000/2*(g.spans>1?2:1);
  const Mg=wR*(Ls/1000)**2/12*100, Mw=wq*maxBay/1000*(Hc/1000)**2/4*100;
  const Mc=Math.max(Mg,0.75*(Mg+Mw));
  const rx=Math.sqrt(col.Ix/col.A), KLr=1.5*Hc/10/rx, Cc=Math.sqrt(2*Math.PI**2*E/Fy);
  const Fa= KLr<Cc ? (1-KLr**2/(2*Cc**2))*Fy/(5/3+3/8*KLr/Cc-KLr**3/(8*Cc**3)) : 12*Math.PI**2*E/(23*KLr**2);
  const fa=P_/col.A, fbc=Mc/col.Zx;
  out.push({name:'主柱',prof:s.prof.col,span:Hc,load:`P = ${(P_/1000).toFixed(1)} tf・M = ${(Mc/1e5).toFixed(2)} tf·m`,fml:'fa/Fa + fb/Fb',ratio:fa/Fa+fbc/Fb,fb:fbc,def:null,note:`KL/r = ${KLr.toFixed(0)}・風載組合 ×0.75`});
  // 斜撐
  if(g.braceBays.size){
    const rod=PROF[s.prof.brace], F=wq*q.gableArea/2/2; // 山牆一半風力，兩側分擔
    const per=F/Math.max(1,g.braceBays.size), Lb=Math.max(...g.M.filter(m=>m.name==='屋面斜撐').map(m=>m.len),1);
    const T=per*Lb/maxBay, Ae=Math.PI*(rod.d/10)**2/4*0.75, ft=T/Ae;
    out.push({name:'屋面斜撐',prof:s.prof.brace,span:Lb,load:`T = ${(T/1000).toFixed(2)} tf`,fml:'ft = T / Ae（牙底 0.75A）',ratio:ft/(0.6*Fy),fb:ft,def:null,note:'山牆風力傳遞'});
  }
  return out;
}

const setK=(o,k,v)=>{const ks=k.split('.'),l=ks.pop(); ks.reduce((a,b)=>a[b],o)[l]=v;};

let timer=null; const changed=(full)=>{ clearTimeout(timer); timer=setTimeout(()=>update(full),40); };
function wire(){
  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.type==='number' && el.min!=='' && !(parseFloat(el.value)>=+el.min)) return;
    if(el.dataset.k){ let v = el.type==='checkbox'?el.checked : el.type==='number'? (parseFloat(el.value)||0) : el.value;
      if(el.dataset.k==='L'){ const n=st.bays.length; st.L=v; st.bays=Array(n).fill(Math.round(v/n)); st.bays[n-1]=v-st.bays.slice(0,-1).reduce((a,b)=>a+b,0); renderBays(); }
      else setK(st,el.dataset.k,v);
      if(el.dataset.k.startsWith('walls')) renderOps();
      changed(true); return; }
    if(el.dataset.bay!==undefined){
      const i=+el.dataset.bay, v=Math.max(500,parseFloat(el.value)||0); st.bays[i]=v;
      if($('#lockL').checked && st.bays.length>1){
        const others=st.bays.map((_,j)=>j).filter(j=>j!==i), rest=st.L-v, each=Math.round(rest/others.length);
        if(each<500){ st.L=st.bays.reduce((a,b)=>a+b,0); $('#L').value=st.L; changed(true); return; }
        others.forEach((j,n)=>st.bays[j]= n===others.length-1? rest-each*(others.length-1) : each);
        $$('[data-bay]').forEach(inp=>{ if(+inp.dataset.bay!==i) inp.value=st.bays[+inp.dataset.bay]; });
      } else { st.L=st.bays.reduce((a,b)=>a+b,0); $('#L').value=st.L; }
      changed(true); return; }
    if(el.dataset.op!==undefined){ const o=st.openings[+el.dataset.op], f=el.dataset.f;
      o[f]= el.tagName==='SELECT'? el.value : (parseFloat(el.value)||0);
      if(f==='type'){ if(el.value==='window'){o.sill=o.sill||1000;o.h=Math.min(o.h,1500);} else o.sill=0; renderOps(); }
      if(f==='wall') renderOps();
      changed(true); return; }

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function build3D(){
  if(root){ scene.remove(root); root.traverse(o=>{ if(o.geometry && !o.userData.cached) o.geometry.dispose(); }); }
  if(geoCache.size>600){ geoCache.forEach(g=>g.dispose()); geoCache.clear(); }
  selected=null; $('#pick').hidden=true; $('#labels').innerHTML='';
  const g=G, s=st; root=new THREE.Group(); root.scale.setScalar(0.001); root.position.set(-g.W/2000,0,-g.L/2000);
  pickables=[]; labels=[];
  // 構件
  g.M.forEach(m=>{
    const a=V(...m.p1), b=V(...m.p2), dir=b.clone().sub(a), len=dir.length(); if(len<1) return; dir.normalize();
    let up=V(...m.up); up.sub(dir.clone().multiplyScalar(up.dot(dir))); if(up.lengthSq()<1e-6) up=Math.abs(dir.y)<0.9?V(0,1,0):V(1,0,0); up.normalize();
    const xa=new THREE.Vector3().crossVectors(up,dir).normalize();
    const mesh=new THREE.Mesh(memberGeo(m.prof,len),matFor(m.grp)); mesh.userData={m,mat:mesh.material,cached:true};
    mesh.matrixAutoUpdate=false; mesh.matrix.makeBasis(xa,up,dir).setPosition(a);
    mesh.castShadow=m.grp!=='brace'; mesh.receiveShadow=true;
    root.add(mesh); pickables.push(mesh);
  });
  // 底板＋基礎墩
  const conc=new THREE.MeshStandardMaterial({color:'#7d8794',roughness:.95});
  g.M.filter(m=>m.name==='主柱'||m.name==='中柱'||m.name==='山牆柱').forEach(m=>{
    const p=PROF[m.prof], sz=Math.max(p.h,p.b)+150;
    const bp=new THREE.Mesh(new THREE.BoxGeometry(sz,20,sz),matFor('main')); bp.position.set(m.p1[0],10,m.p1[2]); root.add(bp);
    const pd=new THREE.Mesh(new THREE.BoxGeometry(sz+300,250,sz+300),conc); pd.position.set(m.p1[0],-125+2,m.p1[2]); pd.receiveShadow=true; root.add(pd);
  });
  // 地坪
  if(s.slab){ const sl=new THREE.Mesh(new THREE.BoxGeometry(g.W+200,40,g.L+200),new THREE.MeshStandardMaterial({color:'#5b6573',roughness:1})); sl.position.set(g.W/2,-21,g.L/2); sl.receiveShadow=true; root.add(sl); }
  // 外殼
  if($('#showSkin').checked) buildSkin(g,root);
  scene.add(root);
  // 地面網格
  if(!scene.userData.grid){ const gr=new THREE.GridHelper(400,200,'#2c4560','#1a2c3f'); gr.position.y=-0.03; scene.add(gr); scene.userData.grid=gr;
    const gnd=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.ShadowMaterial({opacity:.35})); gnd.rotation.x=-Math.PI/2; gnd.position.y=-0.035; gnd.receiveShadow=true; scene.add(gnd); }
  const D=Math.max(g.W,g.L)/1000, sun=scene.userData.sun; const sc=sun.shadow.camera; sc.left=sc.bottom=-D;sc.right=sc.top=D; sc.far=D*6+100; sun.position.set(D*0.8,D*1.4,D*0.6); sc.updateProjectionMatrix();
  scene.fog=new THREE.Fog('#0f1b28',D*2.5,D*6);
  // 標註
  if($('#showDim').checked) buildDims(g);
}
function buildSkin(g,root){
  const s=st, k=g.k, sec=Math.sqrt(1+k*k), top=g.pur.h+8;
  if(s.roofPanel!=='none'){
    const tex=corrTex(s.roofPanel==='clear'?'#cfe6f5':s.colors.roof,true);
    g.planes.forEach(pl=>{
      const S=Math.abs(pl.x1-pl.x0)*sec, Lr=g.L+2*g.gOh;
      const geo=new THREE.PlaneGeometry(S,Lr); const t=tex.clone(); t.needsUpdate=true; t.repeat.set(S/350,1);
      const mat=new THREE.MeshStandardMaterial({map:t,side:THREE.DoubleSide,transparent:true,opacity:s.roofPanel==='clear'?.45:.88,metalness:.3,roughness:.55,depthWrite:s.roofPanel!=='clear'});
      const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.receiveShadow=true;
      const xm=(pl.x0+pl.x1)/2, ym=g.roofY(xm)+top;
      m.position.set(xm,ym,g.L/2);
      const ang=Math.atan2(g.roofY(pl.x1)-g.roofY(pl.x0), pl.x1-pl.x0);
      m.rotation.order='ZXY'; m.rotation.set(-Math.PI/2,0,0); // plane in xz
      const grp=new THREE.Group(); grp.position.set(xm,ym,g.L/2); m.position.set(0,0,0); grp.rotation.z=ang; grp.add(m); root.add(grp);
    });
  }
  if(s.wallPanel==='none') return;
  const wtex=corrTex(s.colors.wall,true);
  const wmat=(len)=>{const t=wtex.clone(); t.needsUpdate=true; t.repeat.set(len/300,1); return new THREE.MeshStandardMaterial({map:t,side:THREE.DoubleSide,transparent:true,opacity:.9,metalness:.2,roughness:.6});};
  const opMat={rollup:new THREE.MeshStandardMaterial({map:(()=>{const t=corrTex('#8a96a3',false);t.repeat.set(1,30);return t;})(),metalness:.5,roughness:.5,side:THREE.DoubleSide}),
    door:new THREE.MeshStandardMaterial({color:'#6b4a35',roughness:.6,side:THREE.DoubleSide}),
    window:new THREE.MeshStandardMaterial({color:'#9fd2f0',transparent:true,opacity:.45,metalness:.6,roughness:.1,side:THREE.DoubleSide})};
  const gt=g.girt.h;
  const mk=(wall,outline,umin,umax,place)=>{
    const sh=new THREE.Shape(outline.map(([u,y])=>new THREE.Vector2(u,y)));
    g.ops.filter(o=>o.wall===wall).forEach(o=>{ const a=Math.max(umin+10,+o.pos), b=Math.min(umax-10,+o.pos+(+o.w)); if(b<=a) return;
      const h=new THREE.Path([V(a,+o.sill),V(b,+o.sill),V(b,+o.sill+(+o.h)),V(a,+o.sill+(+o.h))].map(v=>new THREE.Vector2(v.x,v.y))); sh.holes.push(h);
      const op=new THREE.Mesh(new THREE.PlaneGeometry(b-a,+o.h),opMat[o.type]); op.position.set((a+b)/2,+o.sill+(+o.h)/2,0); place(op,15); });
    const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),wmat(umax-umin)); m.receiveShadow=true;
    // UV for texture
    const uv=m.geometry.attributes.uv; for(let i=0;i<uv.count;i++){ uv.setXY(i,(uv.getX(i)-umin)/(umax-umin),uv.getY(i)/3000); }
    place(m,0);
  };
  const T=g.raf.h;
  if(s.walls.front||s.walls.back){
    const pts=[[0,0],[g.W,0],[g.W,g.roofY(g.W)+top-5]]; if(s.roof==='gable') pts.push([g.W/2,g.roofY(g.W/2)+top-5]); pts.push([0,g.roofY(0)+top-5]);
    [['front',-g.offG-gt/2,-1],['back',g.L+g.offG+gt/2,1]].forEach(([w,z,sg])=>{ if(!s.walls[w]) return;
      mk(w,pts,0,g.W,(o,dz)=>{ o.position.z=z+sg*(5+dz); root.add(o); }); });
  }
  [['left',0,-1],['right',g.W,1]].forEach(([w,x,sg])=>{ if(!s.walls[w]) return;
    const yt=g.roofY(x)+top-5;
    mk(w,[[0,0],[g.L,0],[g.L,yt],[0,yt]],0,g.L,(o,dz)=>{ const grp=new THREE.Group(); grp.position.set(x+sg*(g.offSide+gt/2+5),0,0); grp.rotation.y=-Math.PI/2; o.position.z=sg<0?dz:-dz; grp.add(o); root.add(grp); });
  });
}
function addLabel(text,pos,cls=''){ const el=document.createElement('div'); el.className='lbl '+cls; el.textContent=text; $('#labels').appendChild(el); labels.push({el,p:pos}); }
function dimLine(a,b,ticks=true){
  const pts=[a,b]; const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:'#6fb0e6'})); root.add(ln);
  if(ticks){ const d=b.clone().sub(a).normalize(); const n=Math.abs(d.y)>0.9?V(1,0,0):V(0,1,0); [a,b].forEach(p=>{ const t=new THREE.BufferGeometry().setFromPoints([p.clone().addScaledVector(n,-180),p.clone().addScaledVector(n,180)]); root.add(new THREE.Line(t,new THREE.LineBasicMaterial({color:'#6fb0e6'}))); }); }
}
function buildDims(g){
  const off=Math.max(900,Math.max(g.W,g.L)*0.07), z0=-g.gOh-off, xL=-g.oh-off, xR=g.W+g.oh+off;
  dimLine(V(0,0,z0),V(g.W,0,z0)); addLabel(`W ${fmt(g.W)}`,V(g.W/2,0,z0));
  if(g.spans>1) g.colX.slice(0,-1).forEach((x,i)=>addLabel(fmt(g.colX[i+1]-x),V((x+g.colX[i+1])/2,0,z0-off*0.6),''));
  const xR2=xR+off*0.8; dimLine(V(xR2,0,0),V(xR2,0,g.L)); addLabel(`L ${fmt(g.L)}`,V(xR2,0,g.L/2));
  g.fz.slice(0,-1).forEach((z,i)=>{ dimLine(V(xR,0,z),V(xR,0,g.fz[i+1])); addLabel(fmt(st.bays[i]),V(xR,0,(z+g.fz[i+1])/2)); });
  g.fz.forEach((z,i)=>addLabel(String(i+1),V(xR+off*1.5,0,z),'g'));
  dimLine(V(xL,0,z0),V(xL,g.H,z0)); addLabel(`H ${fmt(g.H)}`,V(xL,g.H/2,z0),'h');
  if(g.ridge>g.H+1){ const xr=st.roof==='gable'?g.W/2:g.W; dimLine(V(xr,0,z0-off*0.3),V(xr,g.ridge,z0-off*0.3)); addLabel(`屋脊 ${fmt(g.ridge)}`,V(xr,g.ridge*0.75,z0-off*0.3),'h'); }
  g.ops.forEach(o=>{ const u=+o.pos+(+o.w)/2, y=+o.sill+(+o.h)+250;
    const p= o.wall==='front'?V(u,y,-g.offG): o.wall==='back'?V(u,y,g.L+g.offG): o.wall==='left'?V(-g.offSide,y,u):V(g.W+g.offSide,y,u);
    addLabel(`${OPS[o.type]} ${o.w}×${o.h}`,p,'o'); });
  g.colX.forEach((x,i)=>addLabel(String.fromCharCode(65+i),V(x,0,z0-off*(g.spans>1?1.1:0.6)),'g'));
}
function fitCam(v){
  if(!camera||!G) return;
  const D=Math.max(G.W,G.L,G.ridge*1.6)/1000, cy=G.ridge/2000;
  const f=D<12?1.35:1;
  const pos={iso:[D*0.95*f,D*0.62*f,-D*1.05*f],front:[0,cy,-D*1.7*f],side:[D*1.8*f,cy,0],top:[0,D*2*f,0.001]}[v];
  camera.position.set(...pos); controls.target.set(0,v==='top'?0:cy,0); controls.update();
}
const _v=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera);
  if(!labels.length) return;
  const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;
  root.updateMatrixWorld();
  labels.forEach(l=>{ _v.copy(l.p).applyMatrix4(root.matrixWorld).project(camera);
    const vis=_v.z<1&&Math.abs(_v.x)<1.05&&Math.abs(_v.y)<1.05; l.el.style.display=vis?'':'none';
    if(vis){ l.el.style.left=((_v.x+1)/2*w)+'px'; l.el.style.top=((1-_v.y)/2*h)+'px'; } });
}

/* ================= 工程三視圖 (SVG) ================= */
function drawViews(g){
  const s=st, C={ln:'#c9d6e3',mem:'#8fb3d6',sec:'#e0b84f',br:'#e98a35',dim:'#6fb0e6',op:'#e98a35',tx:'#c9d6e3',mut:'#6f879e',gr:'#3a5570'};
  const fsz=Math.max(g.W,g.L,g.ridge)*0.018;
  const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" fill="${o.c||C.tx}" font-size="${o.fs||fsz}" font-family="IBM Plex Mono, monospace" text-anchor="${o.a||'middle'}" ${o.r?`transform="rotate(${o.r} ${x} ${y})"`:''} dominant-baseline="middle">${t}</text>`;
  const Ln=(x1,y1,x2,y2,c,w=1.2,d='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" vector-effect="non-scaling-stroke" ${d?`stroke-dasharray="${d}"`:''}/>`;
  const R=(x,y,w,h,c,f='none',d='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" stroke="${c}" fill="${f}" stroke-width="1.2" vector-effect="non-scaling-stroke" ${d?`stroke-dasharray="${d}"`:''}/>`;
  const dimH=(x1,x2,y,t)=>Ln(x1,y,x2,y,C.dim,1)+Ln(x1,y-fsz*.5,x1,y+fsz*.5,C.dim,1)+Ln(x2,y-fsz*.5,x2,y+fsz*.5,C.dim,1)+T((x1+x2)/2,y-fsz*.7,t,{c:C.dim});
  const dimV=(x,y1,y2,t)=>Ln(x,y1,x,y2,C.dim,1)+Ln(x-fsz*.5,y1,x+fsz*.5,y1,C.dim,1)+Ln(x-fsz*.5,y2,x+fsz*.5,y2,C.dim,1)+T(x-fsz*.8,(y1+y2)/2,t,{c:C.dim,r:-90});
  const bub=(x,y,t)=>`<circle cx="${x}" cy="${y}" r="${fsz*.8}" fill="none" stroke="${C.mut}" stroke-width="1" vector-effect="non-scaling-stroke"/>`+T(x,y,t,{c:C.tx,fs:fsz*.85});
  const svg=(vb,body)=>`<svg viewBox="${vb.join(' ')}" xmlns="http://www.w3.org/2000/svg"><g transform="scale(1,-1)">${body}</g></svg>`;
  // 前視（山牆立面）— y 向上；以 scale(1,-1) 翻轉，文字需反轉
  const flipT=(x,y,t,o)=>`<g transform="translate(${x} ${y}) scale(1,-1)">${T(0,0,t,o)}</g>`;
  const dimHf=(x1,x2,y,t)=>Ln(x1,y,x2,y,C.dim,1)+Ln(x1,y-fsz*.5,x1,y+fsz*.5,C.dim,1)+Ln(x2,y-fsz*.5,x2,y+fsz*.5,C.dim,1)+flipT((x1+x2)/2,y+fsz*.7,t,{c:C.dim});
  const dimVf=(x,y1,y2,t)=>Ln(x,y1,x,y2,C.dim,1)+Ln(x-fsz*.5,y1,x+fsz*.5,y1,C.dim,1)+Ln(x-fsz*.5,y2,x+fsz*.5,y2,C.dim,1)+flipT(x-fsz*.8,(y1+y2)/2,t,{c:C.dim,r:-90});
  const bubf=(x,y,t)=>`<circle cx="${x}" cy="${y}" r="${fsz*.8}" fill="none" stroke="${C.mut}" stroke-width="1" vector-effect="non-scaling-stroke"/>`+flipT(x,y,t,{fs:fsz*.85});
  const rf=(x)=>g.roofY(x);
  // ---- 前視
  let b='';
  const pad=fsz*5;
  b+=Ln(-g.oh-pad*.5,0,g.W+g.oh+pad*.5,0,C.gr,1.5);
  const rx=[-g.oh, ...(s.roof==='gable'?[g.W/2]:[]), g.W+g.oh];
  b+=`<polyline points="${rx.map(x=>`${x},${rf(x)}`).join(' ')}" fill="none" stroke="${C.mem}" stroke-width="2.4" vector-effect="non-scaling-stroke"/>`;
  b+=`<polyline points="${rx.map(x=>`${x},${rf(x)-g.raf.h}`).join(' ')}" fill="none" stroke="${C.mem}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  g.colX.forEach(x=>b+=R(x-g.col.h/2,0,g.col.h,rf(x)-g.raf.h,C.mem));
  (g.windXs.front.length?g.windXs.front:[]).forEach(x=>b+=R(x-g.wind.b/2,0,g.wind.b,rf(x)-g.raf.h,C.mem,'none','4 3'));
  g.purX.forEach(x=>b+=R(x-g.pur.b/2,rf(x),g.pur.b,g.pur.h,C.sec,C.sec));
  g.ops.filter(o=>o.wall==='front').forEach(o=>{ b+=R(+o.pos,+o.sill,+o.w,+o.h,C.op,'none','6 4'); b+=flipT(+o.pos+(+o.w)/2,+o.sill+(+o.h)/2,`${OPS[o.type]}`,{c:C.op}); b+=flipT(+o.pos+(+o.w)/2,+o.sill+(+o.h)/2-fsz*1.3,`${o.w}×${o.h}`,{c:C.op,fs:fsz*.85}); });
  b+=dimHf(0,g.W,-pad*.55,`${fmt(g.W)}`);
  if(g.spans>1) g.colX.slice(0,-1).forEach((x,i)=>b+=dimHf(x,g.colX[i+1],-pad*.25,fmt(g.colX[i+1]-x)));
  b+=dimVf(-g.oh-pad*.35,0,g.H,`${fmt(g.H)}`);
  if(g.ridge>g.H) b+=dimVf(g.W+g.oh+pad*.45,0,g.ridge,`${fmt(g.ridge)}`);
  g.colX.forEach((x,i)=>b+=bubf(x,-pad*.85,String.fromCharCode(65+i)));
  b+=flipT(g.W/2,rf(g.W/2)+fsz*2.6,`坡度 ${s.slope}%（1:${s.slope?Math.round(100/s.slope*10)/10:'∞'}）`,{c:C.mut,fs:fsz*.85});
  const vbF=[-g.oh-pad,-(g.ridge+pad*.9),g.W+2*g.oh+2*pad,g.ridge+pad*2.1];
  // ---- 側視（左側牆立面，z 向右）
  let c2='';
  const yE=rf(0), hasL=s.walls.left;
  c2+=Ln(-g.gOh-pad*.5,0,g.L+g.gOh+pad*.5,0,C.gr,1.5);
  g.fz.forEach(z=>c2+=R(z-g.col.b/2,0,g.col.b,yE-g.raf.h,C.mem));
  c2+=R(-g.gOh,yE,g.L+2*g.gOh,g.pur.h,C.sec);
  c2+=Ln(0,yE-g.raf.h/2,g.L,yE-g.raf.h/2,C.mem,1.6);
  if(g.ridge>yE) c2+=Ln(-g.gOh,g.ridge+g.pur.h,g.L+g.gOh,g.ridge+g.pur.h,C.mem,1,'10 6');
  if(hasL) g.M.filter(m=>m.name==='牆檁'&&m.p1[0]<0).forEach(m=>c2+=Ln(m.p1[2],m.p1[1],m.p2[2],m.p2[1],C.sec,1,'6 4'));
  g.M.filter(m=>m.name==='牆面斜撐'&&m.p1[0]===0).forEach(m=>c2+=Ln(m.p1[2],m.p1[1],m.p2[2],m.p2[1],C.br,1));
  g.ops.filter(o=>o.wall==='left').forEach(o=>{ c2+=R(+o.pos,+o.sill,+o.w,+o.h,C.op,'none','6 4'); c2+=flipT(+o.pos+(+o.w)/2,+o.sill+(+o.h)/2,`${OPS[o.type]} ${o.w}×${o.h}`,{c:C.op,fs:fsz*.8}); });
  g.fz.slice(0,-1).forEach((z,i)=>c2+=dimHf(z,g.fz[i+1],-pad*.25,fmt(s.bays[i])));
  c2+=dimHf(0,g.L,-pad*.55,fmt(g.L));
  c2+=dimVf(-g.gOh-pad*.35,0,yE,fmt(yE));
  g.fz.forEach((z,i)=>c2+=bubf(z,-pad*.85,String(i+1)));
  const topS=Math.max(g.ridge,yE)+g.pur.h;
  const vbS=[-g.gOh-pad,-(topS+pad*.6),g.L+2*g.gOh+2*pad,topS+pad*1.6];
  // ---- 平面（z 向右、x 向下）
  let c3='';
  const PX=(z,x)=>[z,x];
  g.fz.forEach((z,i)=>{ c3+=Ln(z,-g.oh-pad*.3,z,g.W+g.oh+pad*.3,C.gr,1,'12 4 2 4'); });
  g.colX.forEach(x=>c3+=Ln(-g.gOh-pad*.3,x,g.L+g.gOh+pad*.3,x,C.gr,1,'12 4 2 4'));
  c3+=R(-g.gOh,-g.oh,g.L+2*g.gOh,g.W+2*g.oh,C.mut,'none','3 3');
  g.purX.forEach(x=>c3+=Ln(-g.gOh,x,g.L+g.gOh,x,C.sec,.8));
  g.braceBays.forEach(j=>{ const z0=g.fz[j],z1=g.fz[j+1]; const ip=[...new Set([...g.colX,...(s.roof==='gable'?[g.W/2]:[])])].sort((a,b)=>a-b);
    for(let i=0;i<ip.length-1;i++){ const a=ip[i],bb=ip[i+1],m=Math.max(1,Math.round((bb-a)/(z1-z0))); for(let q=0;q<m;q++){ const xa=a+(bb-a)*q/m, xb=a+(bb-a)*(q+1)/m; c3+=Ln(z0,xa,z1,xb,C.br,1)+Ln(z1,xa,z0,xb,C.br,1);} } });
  g.M.filter(m=>m.name==='主柱'||m.name==='中柱').forEach(m=>{ const [x,,z]=m.p1; c3+=R(z-g.col.b/2,x-g.col.h/2,g.col.b,g.col.h,C.ln,C.mem); });
  g.M.filter(m=>m.name==='山牆柱').forEach(m=>{ const [x,,z]=m.p1; c3+=R(z-g.wind.h/2,x-g.wind.b/2,g.wind.h,g.wind.b,C.ln,C.mem); });
  g.ops.forEach(o=>{ const a=+o.pos,bb=+o.pos+(+o.w); const w=fsz*.5;
    if(o.wall==='front') c3+=R(-w,a,w*2,bb-a,C.op,C.op); else if(o.wall==='back') c3+=R(g.L-w,a,w*2,bb-a,C.op,C.op);
    else if(o.wall==='left') c3+=R(a,-w,bb-a,w*2,C.op,C.op); else c3+=R(a,g.W-w,bb-a,w*2,C.op,C.op); });
  g.fz.slice(0,-1).forEach((z,i)=>c3+=dimH(z,g.fz[i+1],-g.oh-pad*.25,fmt(s.bays[i])));
  c3+=dimH(0,g.L,-g.oh-pad*.6,fmt(g.L));
  c3+=dimV(-g.gOh-pad*.35,0,g.W,fmt(g.W));
  g.fz.forEach((z,i)=>c3+=bub(z,g.W+g.oh+pad*.6,String(i+1)));
  g.colX.forEach((x,i)=>c3+=bub(g.L+g.gOh+pad*.6,x,String.fromCharCode(65+i)));
  const vbP=[-g.gOh-pad,-g.oh-pad*.9,g.L+2*g.gOh+2*pad,g.W+2*g.oh+pad*1.9];
  $('#views').innerHTML=`
    <div class="sheet"><h3><span>前視圖・山牆立面（1 軸）</span><span>單位 mm</span></h3>${svg(vbF,b)}</div>
    <div class="sheet"><h3><span>側視圖・左側牆立面（A 軸）</span><span>單位 mm</span></h3>${svg(vbS,c2)}</div>
    <div class="sheet wide"><h3><span>屋頂結構平面圖（桁條・斜撐・柱位）</span><span>單位 mm</span></h3><svg viewBox="${vbP.join(' ')}" xmlns="http://www.w3.org/2000/svg">${c3}</svg></div>`;
}

/* ================= 啟動 ================= */
fillSelects(); syncInputs(); wire(); update(true);
try{ init3D(); }catch(e){ $('#loading').textContent='此瀏覽器無法啟用 WebGL，仍可使用工程三視圖與 BOM。'; console.error(e); }
</script>
