    const over=state.vehicles.filter(v=>state.people.filter(p=>p.assignedCarId===v.id).length>(Number(v.capacity)||0)).length;
    return {total:state.people.length, need:need.length, assigned:assigned.length, unassigned:need.length-assigned.length, self:self.length, cap, used, left:cap-used, over};

  function touch(){ saveLocal(); render(); scheduleCloudSave(); }
  function scheduleCloudSave(){
    if(remoteApplying) return;
    saveLocal();
    if(!cloud.ready || !cloud.ref) return;
    clearTimeout(saveTimer);
    cloud.saving=true;
    saveTimer=setTimeout(async()=>{ try{ state.updatedAt=new Date().toISOString(); state.updatedBy=CLIENT_ID; await set(cloud.ref, {state, meta:{updatedAt:state.updatedAt, updatedBy:CLIENT_ID}}); cloud.saving=false; }catch(e){ cloud.mode='error'; cloud.message=e.message; toast('雲端儲存失敗：'+e.message,'bad'); render(); } }, 450);
  }
  async function initFirebase(){
    let cfg = hasFirebaseConfig() ? window.VEHICLE_FIREBASE_CONFIG : null;
    const raw = localStorage.getItem(CONFIG_KEY);
    if(!cfg && raw){ try{cfg=JSON.parse(raw)}catch(e){cloud.mode='error'; cloud.ready=false; toast('Firebase config JSON 格式錯誤','bad'); render(); return false;} }
    if(!cfg){cloud.mode='local'; cloud.ready=false; render(); return false;}
    if(!cfg.databaseURL){cloud.mode='error'; cloud.ready=false; toast('Firebase config 缺少 databaseURL','bad'); render(); return false;}
    try{
      cloud.mode='connecting'; render();
      const app=getApps().length?getApps()[0]:initializeApp(cfg);
      cloud.db=getDatabase(app);
      try{const auth=getAuth(app); await signInAnonymously(auth); cloud.auth=true;}catch(authErr){cloud.auth=false; console.warn('匿名登入失敗，若資料庫規則要求 auth 會無法同步', authErr);}
      const urlRoom = new URL(location.href).searchParams.get('room');
      await joinRoom(urlRoom || localStorage.getItem(ROOM_KEY) || 'main');
      return true;
    }catch(e){cloud.mode='error'; cloud.ready=false; cloud.message=e.message; toast('Firebase 連線失敗：'+e.message,'bad'); render(); return false;}
  }
  async function joinRoom(room){
    room=(room||'main').trim().replace(/[^\w\-\u4e00-\u9fa5]/g,'-').slice(0,40) || 'main';
    if(!cloud.db){ localStorage.setItem(ROOM_KEY,room); cloud.room=room; render(); return; }
    if(cloud.unsub){ cloud.unsub(); cloud.unsub=null; }
    cloud.room=room; localStorage.setItem(ROOM_KEY,room);
    try{ const url=new URL(location.href); url.searchParams.set('room',room); history.replaceState(null,'',url.toString()); }catch{}
    cloud.ref=ref(cloud.db, `vehiclePlannerRooms/${room}`);
    const snap=await get(cloud.ref);
    if(snap.exists() && snap.val().state){ state={...defaultState(), ...snap.val().state}; saveLocal(); }
    else { state.updatedAt=new Date().toISOString(); state.updatedBy=CLIENT_ID; await set(cloud.ref, {state, meta:{updatedAt:state.updatedAt, updatedBy:CLIENT_ID}}); }
    cloud.ready=true; cloud.mode='cloud'; cloud.message='已連線';
    cloud.unsub=onValue(cloud.ref, snap=>{
      if(!snap.exists() || !snap.val().state) return;
      const incoming=snap.val();
      if(incoming.meta?.updatedBy===CLIENT_ID) return;
      remoteApplying=true;
      state={...defaultState(), ...incoming.state};
      saveLocal();
      cloud.lastRemote=incoming.meta?.updatedAt || new Date().toISOString();
      remoteApplying=false;
      render(); toast('已接收其他人的更新','ok');
    });
    render(); toast('已加入共同編輯房間：'+room,'ok');
  }

  function generateNotice(){
    const un=state.people.filter(p=>p.needsRide && !p.assignedCarId);
    const self=state.people.filter(p=>!p.needsRide || p.assignedCarId==='self');
    let txt=`【${state.eventName}】行前車輛通知\n日期：${state.eventDate||'未設定'}\n集合地點：${state.meetPoint||'未設定'}\n\n`;
    state.vehicles.forEach((v,i)=>{
      const ps=state.people.filter(p=>p.assignedCarId===v.id);
      txt+=`第${i+1}車｜${v.driver}（${v.type||''}，${ps.length}/${v.capacity}）\n`;
      if(v.plate) txt+=`車牌：${v.plate}\n`; if(v.note) txt+=`備註：${v.note}\n`;

  function snapToText(s){

  function normDate(t){
    const m=String(t||'').match(/(\d{3,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
    if(!m) return String(t||'').trim();
    let y=+m[1]; if(y<1911) y+=1911; // 民國年
    return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }
  function cleanName(s){return String(s||'').replace(/^\s*(?:[-*•·‧●○▪◆□■✓✔☐☑]+|\d+\s*[.、)）]|[（(]\d+[)）])\s*/,'').replace(/\s+/g,' ').trim()}
  function parsePersons(line){ // 一行可為「姓名｜備註」或「甲、乙(暈車)、丙」
    let t=cleanName(line).replace(/^(乘客|名單|成員)\s*[:：]\s*/,'');
    if(!t || /^目前空車$|^空車$|^無$/.test(t)) return [];
    if(/[｜|]/.test(t)){const [n,...r]=t.split(/[｜|]/); return [{name:cleanName(n),note:r.join(' ').trim()}].filter(p=>p.name)}
    return t.split(/[、，,;；]/).map(x=>x.trim()).filter(Boolean).map(x=>{
      const m=x.match(/^(.+?)\s*[（(](.*)[)）]\s*$/); return m?{name:cleanName(m[1]),note:m[2].trim()}:{name:cleanName(x),note:''};
    }).filter(p=>p.name);
  }
  function parseVehicleFields(f){
    const v={driver:cleanName(f[0]||''),capacity:0,type:'',plate:'',note:''}; const rest=[];
    f.slice(1).map(x=>x.trim()).forEach((x,i)=>{
      if(!x) { rest.push(''); return; }
      let m;
      if(!v.capacity && (m=x.match(/^(?:座位|座)?\s*(\d{1,3})\s*(?:位|座)?$/))) v.capacity=+m[1];
      else if(!v.type && /人座|遊覽車|巴士|中巴|小巴|機車|貨車/.test(x)) v.type=x;
      else if(!v.plate && (m=x.match(/^車牌\s*[:：]?\s*(.+)$/))) v.plate=m[1].trim();
      else if(!v.plate && /^[A-Za-z0-9]{2,4}-[A-Za-z0-9]{2,4}$/.test(x)) v.plate=x.toUpperCase();
      else if((m=x.match(/^備註\s*[:：]\s*(.+)$/))) v.note=(v.note?v.note+' ':'')+m[1];
      else rest.push(x);
    });
    const other=rest.filter(Boolean); if(other.length) v.note=(v.note?v.note+' ':'')+other.join(' ');

  }
  function parseBlock(text, blockNo){
    const r={name:'',eventDate:'',meetPoint:'',notice:'',vehicles:[],people:[],warnings:[]};
    const notice=[]; let sec=null, car=null, vseq=0;
    const pushPeople=(arr,ln)=>arr.forEach(p=>r.people.push({...p, needsRide:sec!=='self', assignedCarId:sec==='car'?car.id:sec==='self'?'self':null, _line:ln}));
    const newCar=(v)=>{car={id:'tmpv'+(++vseq),...v}; if(!car.driver){car.driver='未命名駕駛'+vseq; r.warnings.push(`第${blockNo}筆：有車輛未填駕駛`)} r.vehicles.push(car); sec='car';};
    String(text).split('\n').forEach((raw,i)=>{
      const ln=i+1, line=raw.replace(/\s+$/,''), t=line.trim();
      if(!t){ if(sec==='notice') notice.push(''); return; }
      if(/^(#|\/\/)/.test(t)) return; // 註解
      let m=t.match(/^[【\[]\s*([^】\]]+?)\s*[】\]]\s*(.*)$/);
      if(m && !/^行前/.test(m[2]) ){
        const key=m[1], rest=m[2].trim();
        if(/^(活動|名稱|活動名稱)$/.test(key)){r.name=rest; sec=null}
        else if(/日期/.test(key)){r.eventDate=normDate(rest); sec=null}
        else if(/集合|地點/.test(key)){r.meetPoint=rest; sec=null}
        else if(/注意|備註|通知/.test(key)){sec='notice'; if(rest) notice.push(rest)}
        else if(/^(車|車輛|第\s*\d+\s*車)$/.test(key)) newCar(parseVehicleFields(rest.split(/[｜|]/)));
        else if(/自行|自理|自駕/.test(key)){sec='self'; if(rest) pushPeople(parsePersons(rest),ln)}
        else if(/未安排|未分配|待安排|候補/.test(key)){sec='un'; if(rest) pushPeople(parsePersons(rest),ln)}
        else r.warnings.push(`第${blockNo}筆 第${ln}行：無法辨識區塊「${key}」`);
        return;
      }
      // ---- 相容「複製通知」產生的 LINE 文字 ----
      if((m=t.match(/^【(.+?)】\s*行前.*通知/))){r.name=m[1]; sec=null; return}
      if((m=t.match(/^日期\s*[:：]\s*(.*)$/)) && sec!=='notice'){r.eventDate=normDate(m[1]); return}
      if((m=t.match(/^集合地點\s*[:：]\s*(.*)$/)) && sec!=='notice'){r.meetPoint=m[1].trim(); return}
      if((m=t.match(/^第\s*\d+\s*車\s*[｜|:：]\s*(.+)$/))){
        const body=m[1]; const mm=body.match(/^(.+?)\s*[（(](.*)[)）]\s*$/);
        const driver=mm?mm[1]:body, inner=mm?mm[2]:'';
        const cap=(inner.match(/\/\s*(\d+)/)||[])[1]; const type=(inner.match(/[^，,]*(?:人座|遊覽車|巴士)[^，,]*/)||[''])[0].trim();
        newCar({driver:cleanName(driver),capacity:+cap||0,type,plate:'',note:''}); return;
      }
      if(sec==='car' && (m=t.match(/^車牌\s*[:：]\s*(.*)$/))){car.plate=m[1].trim(); return}
      if(sec==='car' && (m=t.match(/^備註\s*[:：]\s*(.*)$/))){car.note=m[1].trim(); return}
      if((m=t.match(/^自行前往\s*[:：]\s*(.*)$/))){sec='self'; pushPeople(parsePersons(m[1]),ln); return}
      if((m=t.match(/^(?:⚠️\s*)?尚未安排\s*[:：]\s*(.*)$/))){sec='un'; pushPeople(parsePersons(m[1]),ln); return}
      if((m=t.match(/^注意事項\s*[:：]\s*(.*)$/))){sec='notice'; if(m[1]) notice.push(m[1]); return}
      // ---- 一般內容 ----
      if(sec==='notice'){notice.push(line.replace(/^\s+/,'')); return}
      if(!sec){sec='un'; r.warnings.push(`第${blockNo}筆 第${ln}行「${t.slice(0,20)}」不在任何區塊內，已列為未安排`)}
      pushPeople(parsePersons(line),ln);
    });
    r.notice=notice.join('\n').replace(/^\n+|\n+$/g,'');
    return r;
  }
  function parseText(text){
    const blocks=String(text||'').replace(/\r/g,'').split(/^\s*={5,}\s*$/m).filter(b=>b.replace(/^\s*(#|\/\/).*$/gm,'').trim());

  function nameKey(n){return String(n||'').replace(/\s+/g,'').toLowerCase()}

  function optimize(r, src, opts){
    const log=[];
    // 1. 去除重複姓名（保留有分車的那筆，合併備註）
    if(opts.dedupe){
      const seen=new Map(); const keep=[];
      r.people.forEach(p=>{
        const k=nameKey(p.name), prev=seen.get(k);
        if(!prev){seen.set(k,p); keep.push(p); return}
        const rank=x=>x.assignedCarId&&x.assignedCarId!=='self'?2:x.assignedCarId==='self'?1:0;
        if(rank(p)>rank(prev)){prev.assignedCarId=p.assignedCarId; prev.needsRide=p.needsRide}
        if(p.note && !String(prev.note||'').includes(p.note)) prev.note=[prev.note,p.note].filter(Boolean).join(' ');
        log.push(`重複姓名「${p.name}」已合併`);
      });
      r.people=keep;
      const dv=new Map(); r.vehicles=r.vehicles.filter(v=>{const k=nameKey(v.driver); if(!dv.has(k)){dv.set(k,v); return true}
        const keepV=dv.get(k); r.people.forEach(p=>{if(p.assignedCarId===v.id)p.assignedCarId=keepV.id}); keepV.capacity=Math.max(+keepV.capacity||0,+v.capacity||0); log.push(`重複駕駛「${v.driver}」已合併為同一台車`); return false});
    }
    // 2. 補齊座位數 / 車型
    r.vehicles.forEach(v=>{
      if(!(+v.capacity>0)){const fromType=parseInt(v.type); const old=(src?.vehicles||[]).find(o=>nameKey(o.driver)===nameKey(v.driver)); v.capacity=fromType||(+old?.capacity)||4; log.push(`「${v.driver}」未填座位數，已設為 ${v.capacity}`)}
      v.capacity=+v.capacity;
      if(opts.fillType && !v.type){v.type=v.capacity>=20?'遊覽車':`${v.capacity}人座`}
    });
    // 3. 沿用原有 ID（駕駛同名沿用車輛 ID、姓名同沿用人員 ID）
    const oldV=new Map((src?.vehicles||[]).map(v=>[nameKey(v.driver),v.id]));
    const usedV=new Set();
    r.vehicles.forEach(v=>{const o=oldV.get(nameKey(v.driver)); const nid=(o && !usedV.has(o))?o:id(); usedV.add(nid); r.people.forEach(p=>{if(p.assignedCarId===v.id)p.assignedCarId='__'+nid}); v.id=nid});
    r.people.forEach(p=>{if(String(p.assignedCarId||'').startsWith('__'))p.assignedCarId=p.assignedCarId.slice(2)});
    const oldP=new Map((src?.people||[]).map(p=>[nameKey(p.name),p.id])); const usedP=new Set();
    r.people.forEach(p=>{const o=oldP.get(nameKey(p.name)); p.id=(o&&!usedP.has(o))?o:id(); usedP.add(p.id); delete p._line});
    // 4. 超載處理：超出座位的乘客移到未安排
    if(opts.overflow){
      r.vehicles.forEach(v=>{const ps=r.people.filter(p=>p.assignedCarId===v.id); if(ps.length>v.capacity){ps.slice(v.capacity).forEach(p=>{p.assignedCarId=null; p.needsRide=true}); log.push(`「${v.driver}」超載 ${ps.length-v.capacity} 人，已移出：${ps.slice(v.capacity).map(p=>p.name).join('、')}`)}});
    }
    // 5. 未安排者自動補進空位（依座位使用率最低者優先）
    if(opts.autoFill){
      const moved=[];
      r.people.filter(p=>p.needsRide && !p.assignedCarId).forEach(p=>{
        const cnt=v=>r.people.filter(x=>x.assignedCarId===v.id).length;
        const v=[...r.vehicles].filter(v=>cnt(v)<v.capacity).sort((a,b)=>cnt(a)/a.capacity-cnt(b)/b.capacity)[0];
        if(v){p.assignedCarId=v.id; moved.push(`${p.name}→${v.driver}`)}
      });
      if(moved.length) log.push(`自動補位：${moved.join('、')}`);
    }
    // 6. 未填活動資訊沿用原資料
    if(opts.keepHeader && src){['name','eventDate','meetPoint'].forEach(k=>{if(!r[k] && src[k]){r[k]=src[k]}})}
    return log;
  }
  function placeOf(s,p){if(isSelf(p))return '自行前往'; const v=(s.vehicles||[]).find(v=>v.id===p.assignedCarId); return v?v.driver:'未安排'}
  function diffSnap(a,b){ // a=原始, b=新
    const out=[]; const T=(type,txt)=>out.push({type,txt});
    if(!a){T('info','新資料（無原始資料可比對）'); return out}
    if((a.name||'')!==(b.name||'')) T('chg',`活動名稱：${a.name||'（空）'} → ${b.name||'（空）'}`);
    if((a.eventDate||'')!==(b.eventDate||'')) T('chg',`日期：${a.eventDate||'（空）'} → ${b.eventDate||'（空）'}`);
    if((a.meetPoint||'')!==(b.meetPoint||'')) T('chg',`集合地點：${a.meetPoint||'（空）'} → ${b.meetPoint||'（空）'}`);
    if((a.notice||'').trim()!==(b.notice||'').trim()) T('chg','注意事項已修改');
    const av=new Map((a.vehicles||[]).map(v=>[nameKey(v.driver),v])), bv=new Map((b.vehicles||[]).map(v=>[nameKey(v.driver),v]));
    bv.forEach((v,k)=>{const o=av.get(k); if(!o) T('add',`新增車輛：${v.driver}（${v.capacity}座）`); else {
      if(+o.capacity!==+v.capacity) T('chg',`${v.driver} 座位：${o.capacity} → ${v.capacity}`);
      ['type','plate','note'].forEach(f=>{if((o[f]||'')!==(v[f]||'')) T('chg',`${v.driver} ${({type:'車型',plate:'車牌',note:'備註'})[f]}：${o[f]||'（空）'} → ${v[f]||'（空）'}`)})}});
    av.forEach((v,k)=>{if(!bv.has(k)) T('del',`移除車輛：${v.driver}`)});
    const ap=new Map((a.people||[]).map(p=>[nameKey(p.name),p])), bp=new Map((b.people||[]).map(p=>[nameKey(p.name),p]));
    bp.forEach((p,k)=>{const o=ap.get(k); if(!o) T('add',`新增人員：${p.name}（${placeOf(b,p)}）`); else {
      const x=placeOf(a,o), y=placeOf(b,p); if(x!==y) T('move',`${p.name}：${x} → ${y}`);
      if((o.note||'')!==(p.note||'')) T('chg',`${p.name} 備註：${o.note||'（空）'} → ${p.note||'（空）'}`)}});
    ap.forEach((p,k)=>{if(!bp.has(k)) T('del',`移除人員：${p.name}`)});
    return out;
  }
  function snapStats(s){
    const cap=s.vehicles.reduce((t,v)=>t+(+v.capacity||0),0); const riding=s.people.filter(p=>!isSelf(p));
    const un=riding.filter(p=>!s.vehicles.some(v=>v.id===p.assignedCarId)).length;
    const over=s.vehicles.filter(v=>s.people.filter(p=>p.assignedCarId===v.id).length>v.capacity).length;
    return {people:s.people.length, cars:s.vehicles.length, cap, used:riding.length-un, un, self:s.people.length-riding.length, over};
  }
  function lineDiff(a,b){
    const A=a.replace(/\n$/,'').split('\n'), B=b.replace(/\n$/,'').split('\n'), n=A.length, m=B.length;
    if(n*m>2500000) return null;
    const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const ops=[]; let i=0,j=0;
    while(i<n&&j<m){ if(A[i]===B[j]){ops.push(['eq',A[i],i+1,j+1]);i++;j++} else if(dp[i+1][j]>=dp[i][j+1]){ops.push(['del',A[i],i+1,'']);i++} else {ops.push(['add',B[j],'',j+1]);j++} }
    while(i<n){ops.push(['del',A[i],i+1,'']);i++} while(j<m){ops.push(['add',B[j],'',j+1]);j++}
    return ops;
  }

        <div class="te-col">
          <div class="te-col-head"><span>編輯區（可整頁修改／貼上）</span><span id="teLines"></span></div>
          <textarea id="teEdit" class="te-text" spellcheck="false" oninput="app.teInput()"></textarea>
        </div>
        <div class="te-col te-side-col"><div class="te-side">
          <div class="te-box"><h4><span>⚙️ 轉換優化</span></h4>
            ${opt('dedupe','去除重複姓名／駕駛','同名合併，保留有分車那筆並合併備註')}
            ${opt('overflow','超載自動移出','超過座位數的乘客移到「未安排」')}
            ${opt('autoFill','未安排自動補位','依座位使用率最低的車優先補入')}
            ${opt('fillType','自動補車型','未填車型時依座位數產生，如「7人座」')}
            ${opt('keepHeader','空白欄位沿用原資料','活動名稱／日期／集合點未填時沿用')}
            ${opt('backup','套用前先備份目前活動到歷史','避免覆蓋後無法還原')}
          </div>
          <div id="teResult"></div>
        </div></div>
      </div>
      <div class="te-foot">
        <span id="tePickWrap"></span>
        <button class="btn light" onclick="app.closeTextEditor()">取消</button>
        <button class="btn purple" onclick="app.teSaveHistory()">🗂️ 另存為新歷史</button>
        <button class="btn blue" onclick="app.teApply()">✅ 轉成新資料（套用為目前活動）</button>
      </div>
    </div></div>`;
    document.getElementById('teOrig').value=editor.origText || '（空白來源：請在右側貼上文字）';
    document.getElementById('teEdit').value=text;
  }
  function computeEditor(){
    if(!editor) return;
    const text=document.getElementById('teEdit')?.value||'';
    const parsed=parseText(text);
    editor.logs=[]; editor.results=parsed.map((r,i)=>{
      const src=editor.key==='all'?editor.origList[i]:editor.origList[0];
      const log=optimize(r,src,editor.opts); editor.logs.push(log); return r;
    });
    const lines=text?text.split('\n').length:0; const le=document.getElementById('teLines'); if(le) le.textContent=`${lines} 行｜${parsed.length} 筆活動`;
    if(editor.view==='diff') renderDiffView();
    renderResult();
  }
  function renderDiffView(){
    const el=document.getElementById('teDiff'); if(!el) return;
    const ops=lineDiff(editor.origText, document.getElementById('teEdit').value);
    if(!ops){el.innerHTML='<div class="empty" style="margin:12px">內容過長，請改用右側「變更清單」比對</div>'; return}
    const a=ops.filter(o=>o[0]==='add').length, d=ops.filter(o=>o[0]==='del').length;
    el.innerHTML=`<div style="padding:4px 12px 8px;display:block"><span class="pill ok">+${a} 行</span> <span class="pill bad">−${d} 行</span></div>`+
      ops.map(o=>`<div class="${o[0]}"><i>${o[0]==='add'?o[3]:o[2]}</i><span>${h(o[1])||' '}</span></div>`).join('');
  }
  function renderResult(){
    const el=document.getElementById('teResult'); if(!el) return;
    const R=editor.results;
    if(!R.length){el.innerHTML='<div class="empty">右側尚無可轉換的內容</div>'; document.getElementById('tePickWrap').innerHTML=''; return}
    const icon={add:['ok','新增'],del:['bad','移除'],move:['info','換車'],chg:['warn','修改'],info:['cyan','說明']};
    el.innerHTML=R.map((r,i)=>{
      const s=snapStats(r); const src=editor.key==='all'?editor.origList[i]:editor.origList[0];
      const d=diffSnap(src,r); const logs=editor.logs[i]||[];
      return `<div class="te-box"><h4><span>${R.length>1?`#${i+1} `:''}${h(r.name||'（未命名活動）')}</span><span class="pill ${s.un||s.over?'warn':'ok'}">${h(r.eventDate||'無日期')}</span></h4>
        <div class="te-kv"><div><b>${s.people}</b>人數</div><div><b>${s.cars}</b>車輛</div><div><b>${s.used}/${s.cap}</b>座位</div><div><b>${s.un}</b>未安排</div><div><b>${s.self}</b>自行</div><div><b style="${s.over?'color:var(--red)':''}">${s.over}</b>超載車</div></div>
        ${r.warnings.length?`<div class="mt">${r.warnings.map(w=>`<div class="te-chg"><span class="pill bad">注意</span><span>${h(w)}</span></div>`).join('')}</div>`:''}
        ${logs.length?`<div class="mt">${logs.map(w=>`<div class="te-chg"><span class="pill purple">優化</span><span>${h(w)}</span></div>`).join('')}</div>`:''}
        <div class="mt"><div class="sub" style="font-weight:900">與原資料差異（${d.length} 項）</div>${d.length?d.map(x=>`<div class="te-chg"><span class="pill ${icon[x.type][0]}">${icon[x.type][1]}</span><span>${h(x.txt)}</span></div>`).join(''):'<div class="te-chg"><span class="pill ok">相同</span><span>沒有變更</span></div>'}</div>
      </div>`}).join('');
    const pw=document.getElementById('tePickWrap');
    if(R.length>1){ if(editor.pick>=R.length) editor.pick=0;
      pw.innerHTML=`<select style="width:auto" onchange="app.tePick(this.value)">${R.map((r,i)=>`<option value="${i}" ${editor.pick===i?'selected':''}>套用第 ${i+1} 筆：${h(r.name||'未命名')}</option>`).join('')}</select>`;
    } else pw.innerHTML='';
  }
  function resultToSnap(r){return {name:r.name||'未命名活動', eventDate:r.eventDate||'', meetPoint:r.meetPoint||'', notice:r.notice||'', people:r.people.map(p=>({id:p.id,name:p.name,needsRide:!!p.needsRide,assignedCarId:p.assignedCarId||null,note:p.note||''})), vehicles:r.vehicles.map(v=>({id:v.id,driver:v.driver,capacity:+v.capacity||0,type:v.type||'',plate:v.plate||'',note:v.note||''}))}}

  window.app={
    openTextEditor(key){openEditor(key||'current')},
    closeTextEditor(){
      if(editor && document.getElementById('teEdit') && document.getElementById('teEdit').value!==editor.origText && !confirm('編輯內容尚未轉換，確定關閉？')) return;
      clearTimeout(editor?.timer); editor=null; document.getElementById('editorHost').innerHTML='';
    },
    teInput(){clearTimeout(editor.timer); editor.timer=setTimeout(computeEditor,250)},
    teSource(key){
      const cur=document.getElementById('teEdit').value;
      if(cur!==editor.origText && !confirm('切換來源會以新來源文字取代編輯區，確定？')){renderEditor(cur); return}
      openEditor(key);
    },
    teView(v){editor.view=v; document.getElementById('teOrig').classList.toggle('hidden',v!=='orig'); document.getElementById('teDiff').classList.toggle('hidden',v!=='diff'); document.getElementById('teVOrig').classList.toggle('on',v==='orig'); document.getElementById('teVDiff').classList.toggle('on',v==='diff'); if(v==='diff') renderDiffView()},
    teOpt(k,v){editor.opts[k]=v; try{localStorage.setItem(TE_OPT_KEY,JSON.stringify(editor.opts))}catch{} computeEditor()},
    tePick(i){editor.pick=+i},
    async teCopy(which){const t=which==='orig'?editor.origText:document.getElementById('teEdit').value; try{await navigator.clipboard.writeText(t); toast(which==='orig'?'已複製原文':'已複製編輯後文字','ok')}catch{const ta=document.getElementById(which==='orig'?'teOrig':'teEdit'); ta.classList.remove('hidden'); ta.select(); document.execCommand('copy'); toast('已複製','ok')}},
    teReset(){if(!confirm('還原為原始文字？目前編輯內容會消失。'))return; document.getElementById('teEdit').value=editor.origText; computeEditor()},
    teFormat(){if(!editor.results.length) return toast('沒有可整理的內容','warn'); document.getElementById('teEdit').value=snapsToText(editor.results.map(resultToSnap)); computeEditor(); toast('已整理成標準格式（含優化結果），可再比對確認','ok')},
    teHelp(){showModal('文字格式說明',`<div class="copybox">${h(`【活動】週末登山活動
【日期】2026-11-21        ← 也接受 2026/11/21、115.11.21（民國）
【集合】集合點 A

【車】駕駛｜座位數｜車型｜車牌｜備註
王小明｜會暈車             ← 乘客：姓名｜備註
李大華、張美美(素食)       ← 一行可多人，用「、」或「，」分隔

【自行前往】
趙先生

【未安排】
孫小美｜新朋友

【注意】
可多行，直到下一個【區塊】為止

==============================   ← 多筆活動以 5 個以上「=」分隔
# 開頭為 # 的行是註解，不會轉換`)}</div><div class="sub mt">也可直接貼上本系統「複製通知」產生的 LINE 文字（第1車｜駕駛（7人座，3/7）、乘客：甲、乙…），會自動辨識轉換。</div>`,`<button class="btn blue" onclick="app.closeModal()">知道了</button>`)},
    teApply(){
      const r=editor.results[editor.results.length>1?editor.pick:0]; if(!r) return toast('沒有可套用的內容','warn');
      const s=snapStats(r); if(!confirm(`套用為目前活動？\n${r.name||'未命名'}｜${s.people} 人｜${s.cars} 車｜未安排 ${s.un}｜超載 ${s.over}${editor.opts.backup?'\n（會先把目前活動備份到歷史）':''}`)) return;
      if(editor.opts.backup) this.archive();
      const n=resultToSnap(r);
      state.eventName=n.name; state.eventDate=n.eventDate||state.eventDate; state.meetPoint=n.meetPoint; state.notice=n.notice; state.people=n.people; state.vehicles=n.vehicles;
      editor=null; document.getElementById('editorHost').innerHTML=''; activeTab='dashboard'; touch(); toast('已轉成新資料並套用為目前活動','ok');
    },
    teSaveHistory(){
      const R=editor.results; if(!R.length) return toast('沒有可存的內容','warn');
      if(!confirm(`將 ${R.length} 筆活動另存為新的歷史紀錄？（原歷史不會被修改）`)) return;
      [...R].reverse().forEach(r=>{const n=resultToSnap(r); state.historyEvents.unshift({id:id(),date:new Date().toLocaleString()+'（文字編輯）',...n})});
      editor.origText=document.getElementById('teEdit').value; // 已保存，關閉不再提示
      touch(); toast(`已新增 ${R.length} 筆歷史紀錄`,'ok');
    },
    async copyAllHistoryText(){
      if(!state.historyEvents.length) return toast('尚無歷史紀錄','warn');
      const t=snapsToText(state.historyEvents.map(snapOf));
      try{await navigator.clipboard.writeText(t); toast(`已複製 ${state.historyEvents.length} 筆歷史文字`,'ok')}catch{openEditor('all'); toast('瀏覽器不允許直接複製，已開啟編輯器','warn')}
    },
    setTab(t){activeTab=t; render()},
    updateField(k,v){state[k]=v; touch()},
    filterPeople(q){document.getElementById('peopleList').innerHTML=peopleListHTML(q)},
    addPerson(){const name=document.getElementById('newPersonName')?.value.trim(); if(!name)return toast('請輸入姓名','warn'); const note=document.getElementById('newPersonNote')?.value.trim()||''; state.people.push({id:id(),name,needsRide:true,assignedCarId:null,note}); touch(); toast('已新增人員','ok')},
    batchAddPeople(){showModal('批次加入人員',`<textarea id="batchNames" placeholder="每行一位，例如：\n陳先生\n黃小姐｜會暈車\n林小美｜自行"></textarea><div class="sub mt">可用「姓名｜備註」格式；備註含「自行」會自動設為自行前往。</div>`,`<button class="btn light" onclick="app.closeModal()">取消</button><button class="btn blue" onclick="app.doBatchAdd()">加入</button>`)},
    doBatchAdd(){const raw=document.getElementById('batchNames').value; const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean); if(!lines.length)return; lines.forEach(line=>{const [name,...rest]=line.split(/[｜|,，]/); const note=rest.join(' ').trim(); const self=/自行|自理/.test(note); state.people.push({id:id(),name:name.trim(),needsRide:!self,assignedCarId:self?'self':null,note});}); this.closeModal(); touch(); toast(`已加入 ${lines.length} 位人員`,'ok')},
    editPerson(pid){const p=state.people.find(x=>x.id===pid); if(!p)return; showModal('編輯人員',`<div class="stack"><label class="sub">姓名</label><input id="epName" value="${h(p.name)}"/><label class="sub">備註</label><input id="epNote" value="${h(p.note||'')}"/><label class="row"><input id="epNeed" type="checkbox" ${p.needsRide?'checked':''} style="width:auto"> 需要搭車</label></div>`,`<button class="btn light" onclick="app.closeModal()">取消</button><button class="btn blue" onclick="app.savePerson('${pid}')">儲存</button>`)},
    savePerson(pid){const p=state.people.find(x=>x.id===pid); if(!p)return; p.name=document.getElementById('epName').value.trim()||p.name; p.note=document.getElementById('epNote').value.trim(); p.needsRide=document.getElementById('epNeed').checked; if(!p.needsRide)p.assignedCarId='self'; this.closeModal(); touch(); toast('已更新人員','ok')},
    deletePerson(pid){if(!confirm('確定刪除此人員？'))return; state.people=state.people.filter(p=>p.id!==pid); touch(); toast('已刪除','ok')},
    assign(pid,cid){const p=state.people.find(x=>x.id===pid); if(!p)return; p.assignedCarId=cid||null; p.needsRide=cid==='self'?false:true; touch()},
    addVehicle(){const driver=document.getElementById('newDriver')?.value.trim(); if(!driver)return toast('請輸入駕駛名','warn'); state.vehicles.push({id:id(),driver,capacity:parseInt(document.getElementById('newCapacity').value)||4,type:document.getElementById('newType').value,plate:document.getElementById('newPlate').value.trim(),note:document.getElementById('newVehicleNote').value.trim()}); touch(); toast('已新增車輛','ok')},
    editVehicle(vid){const v=state.vehicles.find(x=>x.id===vid); if(!v)return; showModal('編輯車輛',`<div class="stack"><label class="sub">駕駛</label><input id="evDriver" value="${h(v.driver)}"/><label class="sub">座位數</label><input id="evCap" type="number" min="1" value="${h(v.capacity)}"/><label class="sub">車型</label><input id="evType" value="${h(v.type||'')}"/><label class="sub">車牌</label><input id="evPlate" value="${h(v.plate||'')}"/><label class="sub">備註</label><input id="evNote" value="${h(v.note||'')}"/></div>`,`<button class="btn light" onclick="app.closeModal()">取消</button><button class="btn blue" onclick="app.saveVehicle('${vid}')">儲存</button>`)},
    saveVehicle(vid){const v=state.vehicles.find(x=>x.id===vid); if(!v)return; v.driver=document.getElementById('evDriver').value.trim()||v.driver; v.capacity=parseInt(document.getElementById('evCap').value)||v.capacity; v.type=document.getElementById('evType').value.trim(); v.plate=document.getElementById('evPlate').value.trim(); v.note=document.getElementById('evNote').value.trim(); this.closeModal(); touch(); toast('已更新車輛','ok')},
    deleteVehicle(vid){if(!confirm('刪除車輛？該車乘客會變成未分配。'))return; state.vehicles=state.vehicles.filter(v=>v.id!==vid); state.people.forEach(p=>{if(p.assignedCarId===vid)p.assignedCarId=null}); touch(); toast('已刪除車輛','ok')},
    autoAssign(){const queue=state.people.filter(p=>p.needsRide && !p.assignedCarId); queue.forEach(p=>{const v=state.vehicles.find(v=>state.people.filter(x=>x.assignedCarId===v.id).length<(Number(v.capacity)||0)); if(v)p.assignedCarId=v.id;}); touch(); toast('已依空位自動安排','ok')},
    balanceAssign(){const targets=state.people.filter(p=>p.needsRide && p.assignedCarId!=='self'); targets.forEach(p=>p.assignedCarId=null); targets.forEach(p=>{const sorted=[...state.vehicles].sort((a,b)=>state.people.filter(x=>x.assignedCarId===a.id).length/(a.capacity||1)-state.people.filter(x=>x.assignedCarId===b.id).length/(b.capacity||1)); const v=sorted.find(v=>state.people.filter(x=>x.assignedCarId===v.id).length<(Number(v.capacity)||0)); if(v)p.assignedCarId=v.id;}); touch(); toast('已平均分配','ok')},
    clearAssign(){if(!confirm('清空所有乘車安排？'))return; state.people.forEach(p=>{if(p.assignedCarId!=='self')p.assignedCarId=null}); touch(); toast('已清空安排','ok')},
    archive(){const snap={id:id(),date:new Date().toLocaleString(),name:state.eventName,people:JSON.parse(JSON.stringify(state.people)),vehicles:JSON.parse(JSON.stringify(state.vehicles)),notice:state.notice,eventDate:state.eventDate,meetPoint:state.meetPoint}; state.historyEvents.unshift(snap); touch(); toast('已存入歷史快照','ok')},
    viewHistory(hid){const his=state.historyEvents.find(h=>h.id===hid); if(!his)return; const missing=(his.people||[]).filter(hp=>!state.people.some(p=>p.name===hp.name)); const html=`<div class="stack"><div class="row between"><div><div class="driver">${h(his.name)}</div><div class="sub">${h(his.date)}｜${h(his.eventDate||'')}</div></div><button class="btn blue" onclick="app.restoreHistory('${hid}')">還原成目前活動</button></div><div class="hr"></div><div class="title"><span>遺漏名單</span><span class="pill ${missing.length?'warn':'ok'}">${missing.length?missing.length+' 人':'全員到齊'}</span></div>${missing.length?missing.map(p=>`<div class="person"><div class="row between"><div><div class="pname">${h(p.name)}</div><div class="mini">${h(p.note||'')}</div></div><button class="btn small orange" onclick="app.addMissingFromHistory('${hid}','${h(p.name)}')">加入</button></div></div>`).join(''):'<div class="empty">目前名單已包含歷史活動人員。</div>'}<div class="hr"></div><div class="title"><span>當時分車</span></div>${(his.vehicles||[]).map(v=>{const ps=(his.people||[]).filter(p=>p.assignedCarId===v.id);return `<div class="person"><div class="pname">${h(v.driver)}｜${ps.length}/${h(v.capacity)}</div><div class="mini">${ps.map(p=>h(p.name)).join('、')||'空車'}</div></div>`}).join('')}</div>`; document.getElementById('historyView').innerHTML=html},
    addMissingFromHistory(hid,name){const his=state.historyEvents.find(h=>h.id===hid); const p=his?.people?.find(x=>x.name===name); if(!p)return; state.people.push({...p,id:id(),assignedCarId:null,needsRide:true}); touch(); this.viewHistory(hid)},
    restoreHistory(hid){const his=state.historyEvents.find(h=>h.id===hid); if(!his||!confirm('還原此歷史活動？目前畫面會被覆蓋。'))return; state.eventName=his.name; state.eventDate=his.eventDate||state.eventDate; state.meetPoint=his.meetPoint||state.meetPoint; state.notice=his.notice||state.notice; state.people=JSON.parse(JSON.stringify(his.people||[])); state.vehicles=JSON.parse(JSON.stringify(his.vehicles||[])); touch(); toast('已還原歷史活動','ok')},
    deleteHistory(hid){if(!confirm('刪除此歷史紀錄？'))return; state.historyEvents=state.historyEvents.filter(h=>h.id!==hid); touch()},
    openCopy(){showModal('複製行前通知',`<div class="copybox" id="copyText">${h(generateNotice())}</div>`,`<button class="btn light" onclick="app.closeModal()">取消</button><button class="btn green" onclick="app.copyNotice()">複製內容</button>`)},
    async copyNotice(){await navigator.clipboard.writeText(generateNotice()).catch(()=>{}); this.closeModal(); toast('已複製通知內容','ok')},
    exportJSON(){download(`${state.eventName}_共同編輯備份_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state,null,2),'application/json;charset=utf-8'); toast('已匯出 JSON','ok')},
    exportCSV(){let rows=[['姓名','搭車狀態','分配車輛','備註']]; state.people.forEach(p=>{const v=state.vehicles.find(v=>v.id===p.assignedCarId); rows.push([p.name,(!p.needsRide||p.assignedCarId==='self')?'自行前往':p.assignedCarId?'已安排':'未安排',v?v.driver:'',p.note||'']);}); download(`${state.eventName}_人員分車表.csv`, '\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv;charset=utf-8'); toast('已匯出 CSV','ok')},
    printPage(){window.print()},
    toggleTheme(){localStorage.setItem(THEME_KEY,(localStorage.getItem(THEME_KEY)||'light')==='light'?'dark':'light'); render()},
    resetDemo(){if(!confirm('還原範例資料？目前資料會被覆蓋。'))return; state=defaultState(); touch()},
    closeModal(){document.getElementById('modalHost').innerHTML=''},
    openRoomModal(){activeTab='tools'; render(); setTimeout(()=>document.getElementById('roomInput')?.focus(),50)},
    async saveFirebaseConfig(){const raw=document.getElementById('firebaseConfigInput').value.trim(); if(!raw)return toast('請貼上 Firebase config','warn'); try{JSON.parse(raw)}catch{return toast('JSON 格式錯誤','bad')} localStorage.setItem(CONFIG_KEY,raw); toast('已儲存 Firebase 設定，開始連線','ok'); await initFirebase()},
    clearFirebaseConfig(){if(!confirm('移除 Firebase 設定後會回到本機模式。'))return; localStorage.removeItem(CONFIG_KEY); cloud.ready=false; cloud.mode='local'; if(cloud.unsub)cloud.unsub(); cloud.unsub=null; render(); toast('已改成本機模式','ok')},
    joinRoomFromInput(){joinRoom(document.getElementById('roomInput').value)},
    randomRoom(){const r='room-'+Math.random().toString(36).slice(2,8); document.getElementById('roomInput').value=r; joinRoom(r)},
    async copyShareLink(){let link; try{const url=new URL(location.href); url.searchParams.set('room',cloud.room||document.getElementById('roomInput')?.value||'main'); link=url.toString()}catch{link=`房間碼：${cloud.room||'main'}`} await navigator.clipboard.writeText(link).catch(()=>{}); toast('已複製共編網址，分享後對方可直接進入填寫','ok')}
  };

  document.getElementById('importFile').addEventListener('change', e=>{
    const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); if(confirm(`載入「${data.eventName||'備份資料'}」？目前資料會被覆蓋。`)){state={...defaultState(),...data}; touch(); toast('匯入成功','ok')}}catch{toast('備份檔格式錯誤','bad')} e.target.value='';}; reader.readAsText(file);
  });

  render();
  initFirebase();
</script>

<script>
  // PWA：註冊離線快取與手機桌面安裝提示
  (function(){
    var deferredPrompt = null;
    var tip = null;
    var btn = null;
    function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
    function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone; }
    function showTip(text, canInstall){
      tip = tip || document.getElementById('pwaInstallTip');
      btn = btn || document.getElementById('pwaInstallBtn');
      var label = document.getElementById('pwaInstallText');
      if(!tip || isStandalone()) return;
      if(label && text) label.textContent = text;
      if(btn) btn.style.display = canInstall ? 'inline-block' : 'none';
      tip.classList.add('show');
    }
    window.hidePwaInstallTip = function(){
      tip = tip || document.getElementById('pwaInstallTip');
      if(tip) tip.classList.remove('show');
      try{ localStorage.setItem('vehiclePlanner_pwaTipDismissed', Date.now().toString()); }catch(e){}
    };
    if('serviceWorker' in navigator && location.protocol !== 'file:'){
      window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('SW register failed', e); }); });
    }
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault(); deferredPrompt = e;
      setTimeout(function(){ showTip('按「加入」即可放到手機桌面，下次直接從桌面啟動。', true); }, 900);
    });
    window.addEventListener('load', function(){
      btn = document.getElementById('pwaInstallBtn');
      if(btn){ btn.addEventListener('click', async function(){
        if(!deferredPrompt){ showTip('請用瀏覽器選單 → 加入主畫面。', false); return; }
        deferredPrompt.prompt();
        try{ await deferredPrompt.userChoice; }catch(e){}
        deferredPrompt = null; window.hidePwaInstallTip();
      }); }
      if(isIOS() && !isStandalone()){
        setTimeout(function(){ showTip('iPhone：點分享圖示 → 加入主畫面，即可從桌面啟動。', false); }, 1200);
      }
    });
  })();
</script>

</body>
</html>
