<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>室內空間 3D 設計器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: engineering workbench — room parameters on top, 3D / plan stage with furniture library at the side, calculation tables docked below */
:root{
  --bg:#0b131d; --panel:#101b28; --panel-2:#152335; --line:#223449; --fg:#dbe6f2; --muted:#8398ae;
  --accent:#3d8bff; --accent-2:#f0883e; --ok:#36c78a; --warn:#f2b441; --err:#ff5c5c; --chip:#1b2c42;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
@media (max-width:520px){.info{font-size:11px;padding:6px 9px}}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:flex;flex-direction:column;gap:10px;max-width:1800px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.top-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{border-color:#5a2a2e;color:#ffb3b3}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{background:#0d1724;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{font-family:var(--mono);text-align:center}
input[type=color]{padding:0;width:30px;height:26px;border-radius:5px}
.params{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px}
.f>span{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.f input[type=number]{width:84px}
.chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);padding-bottom:6px}
.sw-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;border-radius:5px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.stage-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-radius:7px;padding:6px 12px;color:var(--muted);cursor:pointer}
.tab.on{background:var(--chip);color:#9cc4ff;font-weight:600}
.stage-bar .sp{flex:1}
.viewport{position:relative;height:min(64vh,640px);min-height:360px;background:#0d1622}
#v3d,#plan{position:absolute;inset:0}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none}
#plan{width:100%;height:100%;touch-action:none;user-select:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;background:#1d4fa8;border:1px solid #5d9bff;color:#fff;white-space:nowrap}
.tag.h{background:#4b2a8a;border-color:#9b7dff}
.tag.sel{background:#8a3f13;border-color:var(--accent-2)}
.info{position:absolute;left:10px;top:10px;background:rgba(13,23,36,.88);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.65;pointer-events:none;max-width:calc(100% - 20px)}
.info b{color:#9cc4ff;font-family:var(--mono)}
.hint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(13,23,36,.8);padding:3px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 20px)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:12px;min-width:0;max-height:calc(min(64vh,640px) + 48px);overflow:auto}
.side h3{margin:0;font-size:13px;color:#7fb2ff;font-weight:600;letter-spacing:.04em}
.cats{display:flex;flex-wrap:wrap;gap:5px}
.cat{background:var(--chip);border:1px solid transparent;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.cat.on{border-color:var(--accent);color:#cfe1ff}
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 4px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tile:hover{border-color:var(--accent)}
.tile svg{width:56px;height:40px}
.tile span{font-size:11.5px;line-height:1.25}
.tile small{font-size:10px;color:var(--muted);font-family:var(--mono)}
.props{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2 .f input,.grid2 .f select{width:100%}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.note{color:var(--muted);font-size:12px;line-height:1.6}
.note b{color:var(--fg)}
.bottom{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.bottom-bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.summary{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.summary b{color:var(--fg);font-family:var(--mono)}
.summary .tot{color:var(--ok);font-size:14px}
.tbl-wrap{overflow:auto;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid #1a2a3d;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel-2);z-index:1}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}
tr.click:hover td{background:#13243a}
tr.on td{background:#16304f}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
td input[type=number]{width:96px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid #ffffff44}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600}
.pill.err{background:#4a1d22;color:#ff9b9b}
.pill.warn{background:#4a3a14;color:#ffd27a}
.pill.ok{background:#123d2c;color:#7ff0bd}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;padding:10px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h4{margin:0;font-size:12.5px;color:#7fb2ff}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:600}
.big{font-size:20px;font-family:var(--mono);color:var(--ok);font-weight:600}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(760px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:16px}
dialog textarea{width:100%;height:300px;background:#0d1724;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--mono);font-size:12px}
dialog img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px;align-items:center}
.dlg-actions .note{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16304f;border:1px solid var(--accent);color:#fff;padding:9px 16px;border-radius:9px;z-index:50;max-width:calc(100vw - 32px);font-size:13px}
/* plan svg */
#plan text{font-family:var(--font);fill:#dbe6f2;paint-order:stroke;stroke:#0d1622;stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sym *,#plan *{vector-effect:non-scaling-stroke}
.sym .body{fill:var(--c);fill-opacity:.55;stroke:#d6e2ee;stroke-opacity:.8;stroke-width:1.2}
.sym .ln{fill:none;stroke:#d6e2ee;stroke-opacity:.6;stroke-width:1}
.sym .dk{fill:#0d1622;fill-opacity:.6;stroke:#d6e2ee;stroke-opacity:.6;stroke-width:1}
#plan .it{cursor:grab}
#plan .it.sel .body{stroke:var(--accent-2);stroke-width:2.4;stroke-opacity:1}
#plan .it.bad .body{stroke:var(--err);stroke-width:2.4;stroke-opacity:1}
#plan .it.warn .body{stroke:var(--warn);stroke-width:2;stroke-opacity:1}
#plan .wall{fill:#46576b;stroke:#6f8399;stroke-width:1}
#plan .floor{fill:#16212f}
#plan .gridl{stroke:#22344a;stroke-width:1}
#plan .cut{fill:#16212f}
#plan .op{fill:none;stroke:#f0a46b;stroke-width:1.4}
#plan .opwin{fill:none;stroke:#7fd0ff;stroke-width:1.2}
#plan .op-hit{fill:transparent;cursor:ew-resize}
#plan .op-hit.sel{fill:rgba(240,136,62,.25)}
#plan .swing{fill:#f0883e;fill-opacity:.07}
#plan .zone{fill:#3d8bff;fill-opacity:.08;stroke:#3d8bff;stroke-dasharray:6 4;stroke-width:1}
#plan .dim line{stroke:#7f95ad;stroke-width:1}
#plan .dim.a line{stroke:#5d9bff}
#plan .dim rect{fill:#1d4fa8;stroke:#5d9bff;stroke-width:1}
#plan .dim.o rect{fill:#8a3f13;stroke:#f0883e}
#plan .dim text{fill:#fff;stroke:none;font-family:var(--mono)}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{max-height:none}
  .viewport{height:58vh}
}
@media (max-width:520px){
  .lib{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.6"><path d="M2 7 10 2l8 5v11H2z"/><path d="M6 18v-6h8v6M2 7h16"/></svg></div>
      <div><h1>室內空間 3D 設計器</h1><small>平面配置・家具擺設・動線檢查・材料計算・系統櫃拆單・估價</small></div>
    </div>
    <div class="top-actions">
      <select id="tplSel" aria-label="載入範本">
        <option value="">載入範本…</option>
      </select>
      <button class="btn" id="undoBtn" type="button" title="復原 (Ctrl+Z)">復原</button>
      <button class="btn" id="projBtn" type="button">專案存取</button>
      <button class="btn" id="csvBtn" type="button">匯出清單 (CSV)</button>
      <button class="btn" id="imgBtn" type="button">匯出圖片</button>
      <button class="btn primary" id="stepBtn" type="button">匯出 3D STEP</button>
      <button class="btn primary" id="pdfBtn" type="button">匯出 2D PDF</button>
    </div>
  </header>

  <section class="params" aria-label="空間參數">
    <label class="f"><span>專案名稱</span><input id="mName" type="text" style="width:150px"></label>
    <label class="f"><span>房間寬 W (mm)</span><input id="rW" type="number" step="10" min="1000"></label>
    <label class="f"><span>房間深 D (mm)</span><input id="rD" type="number" step="10" min="1000"></label>
    <label class="f"><span>樓高 H (mm)</span><input id="rH" type="number" step="10" min="2000"></label>
    <label class="f"><span>牆厚 (mm)</span><input id="rT" type="number" step="10" min="60"></label>
    <label class="f"><span>空間用途</span><select id="rType"></select></label>
    <label class="f"><span>地板材質</span><select id="rFloor"></select></label>
    <label class="f"><span>天花板</span><select id="rCeil"><option value="flat">平釘天花（矽酸鈣板）</option><option value="none">不做天花（直接油漆）</option></select></label>
    <div class="f"><span>牆面顏色</span><div class="sw-row" id="wallSw"></div></div>
    <label class="f"><span>吸附格點</span><select id="sSnap"><option value="10">10 mm</option><option value="50">50 mm</option><option value="100">100 mm</option></select></label>
    <label class="f"><span>最小通道 (mm)</span><input id="sPath" type="number" step="50" min="300"></label>
  </section>

  <div class="main">
    <section class="stage">
      <div class="stage-bar">
        <button class="tab on" data-view="3d" type="button">3D 擺設預覽</button>
        <button class="tab" data-view="plan" type="button">平面配置圖</button>
        <span class="sp"></span>
        <span id="camBtns" class="row">
          <button class="btn sm" data-cam="iso" type="button">等角</button>
          <button class="btn sm" data-cam="front" type="button">前視</button>
          <button class="btn sm" data-cam="right" type="button">右視</button>
          <button class="btn sm" data-cam="top" type="button">俯視</button>
          <label class="chk" style="padding:0 0 0 4px"><input type="checkbox" id="sCut">自動剖切牆</label>
        </span>
      </div>
      <div class="viewport" id="viewport">
        <div id="v3d"></div>
        <div id="labels"></div>
        <svg id="plan" hidden xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="info" id="info"></div>
        <div class="hint" id="hint"></div>
      </div>
    </section>

    <aside class="side">
      <div class="props">
        <h3>家具庫</h3>
        <div class="cats" id="cats"></div>
        <div class="lib" id="lib"></div>
      </div>
      <div class="props" id="props"></div>
      <div class="props">
        <h3>門窗開口</h3>
        <div class="row">
          <select id="opWall" aria-label="新增在哪面牆"><option value="N">北牆（上）</option><option value="S">南牆（下）</option><option value="W">西牆（左）</option><option value="E">東牆（右）</option></select>
          <button class="btn sm" data-addop="door" type="button">＋門</button>
          <button class="btn sm" data-addop="slide" type="button">＋拉門</button>
          <button class="btn sm" data-addop="window" type="button">＋窗</button>
          <button class="btn sm" data-addop="open" type="button">＋開口</button>
        </div>
        <p class="note">在平面配置圖拖曳門窗可沿牆移動；點選後可修改尺寸。</p>
      </div>
    </aside>
  </div>

  <section class="bottom">
    <div class="bottom-bar">
      <button class="tab on" data-bt="bom" type="button">家具清單</button>
      <button class="tab" data-bt="mat" type="button">裝修材料計算</button>
      <button class="tab" data-bt="cab" type="button">系統櫃拆單</button>
      <button class="tab" data-bt="chk" type="button">動線檢查</button>
      <button class="tab" data-bt="est" type="button">估價單</button>
      <div class="summary" id="summary"></div>
    </div>
    <div id="bottomBody"></div>
  </section>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">匯出</h2>
  <div id="dlgBody"></div>
  <div class="dlg-actions">
    <span class="note" id="dlgNote"></span>
    <span id="dlgExtra"></span>
    <button class="btn" type="button" id="dlgCopy">複製</button>
    <button class="btn primary" type="button" id="dlgClose">關閉</button>
  </div>
</dialog>
<div id="toast" class="toast" hidden></div>

<script src="vendor/three.min.js"></script>
<script src="app.js"></script>
<script src="export.js"></script>
</body>
</html>
